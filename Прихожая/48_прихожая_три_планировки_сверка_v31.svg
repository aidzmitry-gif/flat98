<text x="1150" y="492" text-anchor="start" class="body">Моющаяся отделка внизу ниши облегчает уборку.</text>
<text x="1150" y="522" text-anchor="start" class="body">В B просвет 400 мм по всей ширине ниши.</text>
<text x="1150" y="552" text-anchor="start" class="body">Щит и розетки закладываем в сухой секции у D1.</text>
<text x="1150" y="582" text-anchor="start" class="body">Место внутренних перегородок — по обмеру.</text>
<text x="1150" y="615" text-anchor="start" class="tiny">Основания размеров · B — БТИ · R — обмер / U01 · P — эскиз · M — замерить</text>
