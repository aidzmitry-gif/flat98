<text x="270.00" y="1330.00" class="small" text-anchor="start" >От верха нижней полки до оси штанги: 1750 − 380 = 1370 мм P.</text>
<text x="270.00" y="1363.00" class="small" text-anchor="start" >Фактическое место под одежду меньше из-за вешалок и фурнитуры.</text>
