<text x="1290.00" y="800.00" class="body" text-anchor="start" >Внешний размер сухого ящика:</text>
<text x="1290.00" y="832.00" class="body" text-anchor="start" >370 вдоль стены × 380 глубина × 90 высота P.</text>
<text x="1920.00" y="800.00" class="body" text-anchor="start" >Для высокой обуви оставлен</text>
<text x="1920.00" y="832.00" class="body" text-anchor="start" >просвет около 400 мм P.</text>
<rect x="1220.00" y="913.00" width="1335.00" height="502.00" fill="white" stroke="#dbe4dc" stroke-width="2" rx="20"/>
<text x="1250.00" y="953.00" class="head" text-anchor="start" >03  Что ещё означают размеры</text>
<text x="1250.00" y="992.00" class="body" text-anchor="start" >• 400 и 396 мм — ширина отделений внутри, между деталями P.</text>
<text x="1250.00" y="1028.00" class="body" text-anchor="start" >• Верхняя полка на h = 2150 мм; над ней около 532 мм P.</text>
<text x="1250.00" y="1064.00" class="body" text-anchor="start" >• Штанга на h = 1750 мм; нижняя съёмная полка на h = 380 мм P.</text>
<text x="1250.00" y="1100.00" class="body" text-anchor="start" >• 580 мм — наружная глубина шкафа вместе с фасадом P.</text>
<text x="1250.00" y="1136.00" class="body" text-anchor="start" >• Ящик указан снаружи; внутри меньше из-за стенок и направляющих.</text>
<text x="1250.00" y="1172.00" class="body" text-anchor="start" >• Высота, ширина и ось щита: M; на рисунке габарит условный.</text>
<text x="1250.00" y="1208.00" class="body" text-anchor="start" >• Фасады, зеркало, петли, задняя стенка и кабели — после обмера.</text>
<text x="1250.00" y="1244.00" class="body" text-anchor="start" >• Обувь стоит на общем полу одним рядом, не на выдвижной полке.</text>
<text x="1250.00" y="1301.00" class="small" text-anchor="start" >B — БТИ · P — предложение · M — нужно замерить.</text>
<text x="1250.00" y="1335.00" class="small" text-anchor="start" >Щит и трассу переноса проверяет электрик; мебель — после чистового обмера.</text>
<rect x="45.00" y="1434.00" width="2510.00" height="206.00" fill="#fff9ef" stroke="#dbe4dc" stroke-width="2" rx="20"/>
<text x="72.00" y="1477.00" class="head" text-anchor="start" >Проверка размерной цепочки</text>
<text x="72.00" y="1518.00" class="body" text-anchor="start" >Стенка: 25 + 850 + 775 + 25 = 1675 мм. Шкаф: 400 + 396 + 3 × 18 = 850 мм. Размеры конструкции — P.</text>
<text x="72.00" y="1557.00" class="body" text-anchor="start" >Сиденье: 460 − 35 подушка − 25 основание = 400 мм. В зоне ящика: 400 − 90 = 310 мм P.</text>
<text x="72.00" y="1591.00" class="small" text-anchor="start" >До заказа проверить привязки D1/D2, размеры щита, чистовой пол, петли, направляющие и проходы с открытыми створками.</text>
