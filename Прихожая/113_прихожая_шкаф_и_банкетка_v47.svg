</defs><rect width="2600" height="1700" fill="#f1f4ef"/><text x="55.0" y="52.0" class="eyebrow" text-anchor="start" >APT-001 / ПРИХОЖАЯ / ПРОВЕРКА ГЕОМЕТРИИ · V47</text><text x="55.0" y="112.0" class="title" text-anchor="start" >Шкаф и банкетка: размеры и хранение</text><text x="58.0" y="153.0" class="subtitle" text-anchor="start" >Вид из кухни на левую стену; открытый коридор слева, входная дверь справа</text><rect x="40.0" y="180.0" width="1505.0" height="1320.0" fill="#fff" stroke="#dce7dc" stroke-width="2" rx="20"/><rect x="1565.0" y="180.0" width="995.0" height="1320.0" fill="#fff" stroke="#dce7dc" stroke-width="2" rx="20"/><text x="70.0" y="225.0" class="head" text-anchor="start" >01  Развёртка без фасадов</text><text x="70.0" y="258.0" class="small" text-anchor="start" >Одинаковый масштаб по ширине и высоте; пунктир не задаёт размер щита.</text><line x1="330.0" y1="317.5" x2="1048.2" y2="317.5" stroke="#aabbb0" stroke-width="3" /><rect x="369.8" y="337.0" width="409.5" height="1053.0" fill="#ead8be" stroke="#8d7455" stroke-width="3" /><rect x="376.8" y="344.0" width="214.5" height="1039.0" fill="#ebf3e7" stroke="#b7cbb4" stroke-width="2" /><rect x="598.3" y="344.0" width="173.9" height="1039.0" fill="#f7efe3" stroke="#d3c2a9" stroke-width="2" /><line x1="598.3" y1="551.5" x2="772.2" y2="551.5" stroke="#9e805e" stroke-width="6" /><line x1="598.3" y1="1241.8" x2="772.2" y2="1241.8" stroke="#9e805e" stroke-width="6" /><line x1="614.7" y1="707.5" x2="755.9" y2="707.5" stroke="#514e47" stroke-width="5" /><line x1="633.4" y1="707.5" x2="633.4" y2="844.0" stroke="#8c957f" stroke-width="20" /><line x1="676.3" y1="707.5" x2="676.3" y2="844.0" stroke="#8c957f" stroke-width="20" /><line x1="719.2" y1="707.5" x2="719.2" y2="844.0" stroke="#8c957f" stroke-width="20" /><text x="484.0" y="590.5" class="label" text-anchor="middle" >СЕКЦИЯ ЩИТА</text><text x="484.0" y="625.6" class="small" text-anchor="middle" >550 P в свету</text><text x="484.0" y="695.8" class="small" text-anchor="middle" >ЩИТ: РАЗМЕР M</text><text x="685.3" y="454.0" class="label" text-anchor="middle" >ОДЕЖДА</text><text x="685.3" y="493.0" class="small" text-anchor="middle" >446 P</text><rect x="779.2" y="337.0" width="224.2" height="214.5" fill="#d0b38c" stroke="#9e825e" stroke-width="2" /><rect x="779.2" y="551.5" width="224.2" height="659.1" fill="#dcebd9" stroke="#a7beaa" stroke-width="2" /><rect x="779.2" y="1210.6" width="224.2" height="23.4" fill="#d9cabb" stroke="#9e825e" stroke-width="2" /><rect x="779.2" y="1234.0" width="97.5" height="35.1" fill="#c4a17a" stroke="#9e825e" stroke-width="2" /><rect x="884.6" y="1280.8" width="42.9" height="109.2" fill="#756957" stroke="#756957" stroke-width="1" rx="5"/><rect x="931.4" y="1280.8" width="42.9" height="109.2" fill="#756957" stroke="#756957" stroke-width="1" rx="5"/><text x="891.4" y="1039.0" class="small" text-anchor="middle" >КРЮЧКИ</text><text x="891.4" y="1120.9" class="label" text-anchor="middle" >БАНКЕТКА</text><text x="828.0" y="1253.5" class="tiny" text-anchor="middle" >ящик</text><text x="937.2" y="1368.5" class="tiny" text-anchor="middle" >обувь</text><line x1="220.0" y1="317.5" x2="220.0" y2="1390.0" stroke="#416d5e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="205.0" y="853.8" class="measure" text-anchor="middle" transform="rotate(-90 205.0 853.8)">2750 R*</text><line x1="285.0" y1="337.0" x2="285.0" y2="1390.0" stroke="#416d5e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="270.0" y="863.5" class="measure" text-anchor="middle" transform="rotate(-90 270.0 863.5)">2700 P</text><line x1="1093.2" y1="1210.6" x2="1093.2" y2="1390.0" stroke="#416d5e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1078.2" y="1300.3" class="measure" text-anchor="middle" transform="rotate(-90 1078.2 1300.3)">460 P</text><line x1="369.8" y1="1450.0" x2="779.2" y2="1450.0" stroke="#416d5e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="574.5" y="1440.0" class="measure" text-anchor="middle" >1050 P</text><line x1="779.2" y1="1450.0" x2="1003.5" y2="1450.0" stroke="#416d5e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="891.4" y="1440.0" class="measure" text-anchor="middle" >575 P</text><text x="80.0" y="1490.0" class="small" text-anchor="start" >* Высота по отмеченным точкам C09; чистовой пол и потолок не учтены.</text><text x="1595.0" y="225.0" class="head" text-anchor="start" >02  Размеры элементов</text><text x="1610.0" y="285.0" class="body" text-anchor="start" >Общий шкаф</text><text x="1610.0" y="320.0" class="measure" text-anchor="start" >1050 × 580 × 2700 P</text><text x="1610.0" y="365.0" class="body" text-anchor="start" >Корпус + фасад</text><text x="1610.0" y="400.0" class="measure" text-anchor="start" >562 + 18 = 580 P</text><text x="1610.0" y="445.0" class="body" text-anchor="start" >Секция щита внутри</text><text x="1610.0" y="480.0" class="measure" text-anchor="start" >550 P; размеры щита M</text><text x="1610.0" y="525.0" class="body" text-anchor="start" >Секция одежды внутри</text><text x="1610.0" y="560.0" class="measure" text-anchor="start" >446 P; штанга +1750 P</text><text x="1610.0" y="605.0" class="body" text-anchor="start" >Верх над банкеткой</text><text x="1610.0" y="640.0" class="measure" text-anchor="start" >575 × 420 × 550 P</text><text x="1610.0" y="685.0" class="body" text-anchor="start" >Сиденье</text><text x="1610.0" y="720.0" class="measure" text-anchor="start" >575 × 420; высота 460 P</text><text x="1610.0" y="765.0" class="body" text-anchor="start" >Ящик для сухих тапочек</text><text x="1610.0" y="800.0" class="measure" text-anchor="start" >250 × 380 × 90 P, снаружи</text><text x="1610.0" y="845.0" class="body" text-anchor="start" >До пола без ящика</text><text x="1610.0" y="880.0" class="measure" text-anchor="start" >400 P</text><text x="1610.0" y="925.0" class="body" text-anchor="start" >До пола под ящиком</text><text x="1610.0" y="960.0" class="measure" text-anchor="start" >310 P</text><text x="1610.0" y="1005.0" class="body" text-anchor="start" >Зона для высокой обуви</text><text x="1610.0" y="1040.0" class="measure" text-anchor="start" >325 P до вычета креплений</text><line x1="1610.0" y1="1108.0" x2="2520.0" y2="1108.0" stroke="#d9e4d9" stroke-width="2" /><text x="1610.0" y="1160.0" class="body" text-anchor="start" >Под банкеткой обувь стоит на полу,</text><text x="1610.0" y="1198.0" class="body" text-anchor="start" >а не на полке.</text><text x="1610.0" y="1250.0" class="warn" text-anchor="start" >Ориентир: 2 пары в один ряд, не гарантия;</text><text x="1610.0" y="1288.0" class="warn" text-anchor="start" >проверить обувь, боковины и крепления.</text><text x="1610.0" y="1360.0" class="small" text-anchor="start" >Электрощит и его открывание не обмерены.</text><text x="1610.0" y="1400.0" class="small" text-anchor="start" >Внутренняя глубина отделений пока не определена.</text><rect x="40.0" y="1525.0" width="2520.0" height="125.0" fill="#fffaf1" stroke="#ead7b6" stroke-width="2" rx="18"/><text x="68.0" y="1571.0" class="small" text-anchor="start" >P — предварительное предложение; M — измерения отсутствуют. Щит 550 мм не равен размеру самого щита.</text><text x="68.0" y="1610.0" class="small" text-anchor="start" >Перед заказом проверить чистовую высоту, раскрой, доступ к щиту, петли и открывание мебели.</text></svg>