<text x="1547.25" y="323.00" class="dimtext" text-anchor="middle" >610 B</text>
<text x="1696.50" y="338.00" class="small" text-anchor="start" >D1 →</text>
<text x="1400.00" y="1195.00" class="small" text-anchor="start" >↓ открытый переход в коридор 4</text>
<text x="1920.00" y="360.00" class="head" text-anchor="start" >Глубина каждого элемента</text>
<text x="1920.00" y="400.00" class="body" text-anchor="start" >Секция щита: 580 P с фасадом</text>
<text x="1920.00" y="435.00" class="body" text-anchor="start" >Секция одежды: 580 P с фасадом</text>
<text x="1920.00" y="470.00" class="body" text-anchor="start" >Верх над сиденьем: 420 P</text>
<text x="1920.00" y="505.00" class="body" text-anchor="start" >Банкетка: 420 P</text>
<text x="1920.00" y="540.00" class="body" text-anchor="start" >Ящик для тапочек: 380 P</text>
<text x="1920.00" y="606.00" class="head" text-anchor="start" >Внутренние глубины — M:</text>
<text x="1920.00" y="641.00" class="body" text-anchor="start" >зависят от задней стенки,</text>
<text x="1920.00" y="676.00" class="body" text-anchor="start" >фасадов и прокладки кабелей.</text>
<text x="1920.00" y="755.00" class="body" text-anchor="start" >У D1 по B01: 610 − 420 = 190.</text>
<text x="1920.00" y="790.00" class="small" text-anchor="start" >Это не замер до коробки</text>
<text x="1920.00" y="820.00" class="small" text-anchor="start" >и не проверка открывания.</text>
<text x="1920.00" y="900.00" class="body" text-anchor="start" >Ранее показанный рендер</text>
<text x="1920.00" y="935.00" class="body" text-anchor="start" >относится к ширине 850/775,</text>
<text x="1920.00" y="970.00" class="body" text-anchor="start" >а не к этой новой пропорции.</text>
<rect x="45.00" y="1327.00" width="2510.00" height="370.00" fill="#fff9ef" stroke="#dbe4dc" stroke-width="2" rx="20"/>
<text x="72.00" y="1370.00" class="head" text-anchor="start" >Сначала проверить щит и доступ</text>
<text x="72.00" y="1410.00" class="body" text-anchor="start" >550 мм — предполагаемая внутренняя ширина секции, не размер щита и не гарантия, что он поместится.</text>
<text x="72.00" y="1447.00" class="body" text-anchor="start" >Нужны реальные ширина, высота и глубина щита с рамой, открывание его дверцы, кабельные вводы и доступ для обслуживания.</text>
<text x="72.00" y="1484.00" class="body" text-anchor="start" >Перенос, размещение внутри мебели, материалы, допустимые расстояния и возможность обслуживания проверяются с электриком по месту.</text>
<text x="72.00" y="1521.00" class="small" text-anchor="start" >B — БТИ · P — проектное предложение · M — измерить. Мебельные размеры не являются размерами для изготовления.</text>
<text x="72.00" y="1557.00" class="small" text-anchor="start" >D1: 610 + 1010 + 470 = 2090 по B01; отдельный контроль 1140 × 2150 к углам не привязан.</text>
<text x="72.00" y="1593.00" class="small" text-anchor="start" >Уменьшение банкетки снижает запас для обуви: 2 пары — ориентир, а не подтверждённая вместимость.</text>
</svg>