<text x="678.25" y="1285.00" class="dimtext" text-anchor="middle" >575 P</text>
<text x="830.00" y="346.00" class="head" text-anchor="start" >Шкаф общий</text>
<text x="830.00" y="381.00" class="body" text-anchor="start" >1050 × 580 × 2700 P</text>
<text x="830.00" y="415.00" class="body" text-anchor="start" >550 — свет секции щита P</text>
<text x="830.00" y="448.00" class="body" text-anchor="start" >446 — свет секции одежды P</text>
<text x="830.00" y="514.00" class="head" text-anchor="start" >Антресоль у входа</text>
<text x="830.00" y="549.00" class="body" text-anchor="start" >575 × 420 × 550 P</text>
<text x="830.00" y="583.00" class="body" text-anchor="start" >Низ на высоте 2150 P</text>
<text x="830.00" y="650.00" class="head" text-anchor="start" >Банкетка</text>
<text x="830.00" y="685.00" class="body" text-anchor="start" >575 × 420, высота 460 P</text>
<text x="830.00" y="718.00" class="body" text-anchor="start" >Ящик 250 × 380 × 90 P</text>
<text x="830.00" y="785.00" class="head" text-anchor="start" >Место для обуви</text>
<text x="830.00" y="820.00" class="body" text-anchor="start" >Один ряд на полу.</text>
<text x="830.00" y="853.00" class="body" text-anchor="start" >Ориентир: около 2 пар;</text>
<text x="830.00" y="886.00" class="body" text-anchor="start" >зависит от обуви и боковин.</text>
<text x="830.00" y="969.00" class="small" text-anchor="start" >Было: шкаф 850 / место 775.</text>
<text x="830.00" y="1001.00" class="small" text-anchor="start" >Стало: шкаф 1050 / место 575.</text>
<text x="830.00" y="1033.00" class="small" text-anchor="start" >Секция щита: 400 → 550 P.</text>
<text x="830.00" y="1097.00" class="small" text-anchor="start" >Высота шкафа — корпуса;</text>
<text x="830.00" y="1129.00" class="small" text-anchor="start" >размеры фасадов уточняются.</text>
<text x="830.00" y="1200.00" class="body" text-anchor="start" >25 + 1050 + 575 + 25 = 1675</text>
<text x="1352.00" y="226.00" class="head" text-anchor="start" >02  План сверху: ширина и глубина</text>
<text x="1354.00" y="259.00" class="small" text-anchor="start" >Глубины 580 и 420 — наружные, от левой стены</text>
