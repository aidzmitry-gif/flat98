</defs><rect width="2600" height="1700" fill="#f1f4ef"/><text x="55.0" y="52.0" class="eyebrow" text-anchor="start" >APT-001 / ПРИХОЖАЯ / ПРОВЕРКА ГЕОМЕТРИИ · V47</text><text x="55.0" y="112.0" class="title" text-anchor="start" >Прихожая: план и расстояния</text><text x="58.0" y="153.0" class="subtitle" text-anchor="start" >План B01 и мебельное предложение; все размеры в миллиметрах</text><rect x="40.0" y="180.0" width="1510.0" height="1320.0" fill="#fff" stroke="#dce7dc" stroke-width="2" rx="20"/><rect x="1570.0" y="180.0" width="990.0" height="1320.0" fill="#fff" stroke="#dce7dc" stroke-width="2" rx="20"/><text x="70.0" y="225.0" class="head" text-anchor="start" >01  План сверху</text><text x="70.0" y="258.0" class="small" text-anchor="start" >Вход сверху, шкаф слева, кухня справа; фасады закрыты.</text><rect x="275.0" y="445.0" width="1149.5" height="921.3" fill="#f8f9f4" stroke="none" stroke-width="1" /><line x1="275.0" y1="445.0" x2="275.0" y2="1366.2" stroke="#263d36" stroke-width="9" /><line x1="275.0" y1="445.0" x2="610.5" y2="445.0" stroke="#263d36" stroke-width="9" /><line x1="1166.0" y1="445.0" x2="1424.5" y2="445.0" stroke="#263d36" stroke-width="9" /><line x1="610.5" y1="445.0" x2="1166.0" y2="445.0" stroke="#222a28" stroke-width="11" /><line x1="1424.5" y1="445.0" x2="1424.5" y2="755.8" stroke="#263d36" stroke-width="9" /><line x1="1424.5" y1="1256.2" x2="1424.5" y2="1366.2" stroke="#263d36" stroke-width="9" /><line x1="1424.5" y1="755.8" x2="1424.5" y2="1256.2" stroke="#bd812a" stroke-width="4" stroke-dasharray="12 9"/><text x="888.2" y="429.0" class="label" text-anchor="middle" >ВХОДНАЯ ДВЕРЬ D1</text><text x="1470.0" y="1000.5" class="label" text-anchor="middle" transform="rotate(90 1470 1000.5)">D2 910 B</text><text x="849.8" y="1408.2" class="label" text-anchor="middle" >ОТКРЫТЫЙ ПЕРЕХОД В КОРИДОР 4</text><rect x="275.0" y="458.8" width="231.0" height="316.2" fill="#dcebd9" stroke="#92aa94" stroke-width="2" /><rect x="275.0" y="775.0" width="319.0" height="255.2" fill="#e6d0b0" stroke="#aa8e6a" stroke-width="2" /><rect x="275.0" y="1030.2" width="319.0" height="322.3" fill="#d6bd99" stroke="#aa8e6a" stroke-width="2" /><rect x="584.1" y="775.0" width="9.9" height="577.5" fill="#a67d50" stroke="#8b704f" stroke-width="1" /><text x="390.5" y="538.5" class="label" text-anchor="middle" >БАНКЕТКА</text><text x="390.5" y="574.2" class="small" text-anchor="middle" >575 × 420 P</text><text x="429.0" y="871.2" class="label" text-anchor="middle" >КУРТКИ</text><text x="429.0" y="904.2" class="small" text-anchor="middle" >глубина 580 P</text><text x="429.0" y="1132.5" class="label" text-anchor="middle" >ЩИТ</text><text x="429.0" y="1168.2" class="small" text-anchor="middle" >габарит M</text><line x1="275.0" y1="298.0" x2="1424.5" y2="298.0" stroke="#416d5e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="849.8" y="288.0" class="measure" text-anchor="middle" >2090 B</text><line x1="275.0" y1="355.0" x2="610.5" y2="355.0" stroke="#416d5e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="442.8" y="345.0" class="measure" text-anchor="middle" >610 B</text><line x1="610.5" y1="355.0" x2="1166.0" y2="355.0" stroke="#416d5e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="888.2" y="345.0" class="measure" text-anchor="middle" >1010 B</text><line x1="1166.0" y1="355.0" x2="1424.5" y2="355.0" stroke="#416d5e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1295.2" y="345.0" class="measure" text-anchor="middle" >470 B</text><line x1="275.0" y1="368.0" x2="275.0" y2="441.0" stroke="#8aa296" stroke-width="1" /><line x1="610.5" y1="368.0" x2="610.5" y2="441.0" stroke="#8aa296" stroke-width="1" /><line x1="1166.0" y1="368.0" x2="1166.0" y2="441.0" stroke="#8aa296" stroke-width="1" /><line x1="1424.5" y1="368.0" x2="1424.5" y2="441.0" stroke="#8aa296" stroke-width="1" /><line x1="155.0" y1="445.0" x2="155.0" y2="1366.2" stroke="#416d5e" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="140.0" y="905.6" class="measure" text-anchor="middle" transform="rotate(-90 140.0 905.6)">1675 B</text><line x1="506.0" y1="665.0" x2="1424.5" y2="665.0" stroke="#326653" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="898.2" y="627.0" width="134.0" height="36.0" fill="#f8f9f4" stroke="none" stroke-width="1" rx="8"/><text x="965.2" y="654.0" class="measure" text-anchor="middle" >1670*</text><line x1="594.0" y1="1308.5" x2="1424.5" y2="1308.5" stroke="#326653" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="942.2" y="1270.5" width="134.0" height="36.0" fill="#f8f9f4" stroke="none" stroke-width="1" rx="8"/><text x="1009.2" y="1297.5" class="measure" text-anchor="middle" >1510*</text><text x="70.0" y="1465.0" class="small" text-anchor="start" >* Остатки до плоскости стены B01, без отделки, ручек и открытых створок.</text><text x="1600.0" y="225.0" class="head" text-anchor="start" >02  Расчёты и проверка</text><text x="1610.0" y="290.0" class="body" text-anchor="start" >Глубина шкафа с фасадом</text><text x="2520.0" y="290.0" class="measure" text-anchor="end" >580 P</text><text x="1610.0" y="337.0" class="body" text-anchor="start" >Глубина банкетки</text><text x="2520.0" y="337.0" class="measure" text-anchor="end" >420 P</text><line x1="1610.0" y1="365.0" x2="2520.0" y2="365.0" stroke="#d9e4d9" stroke-width="2" /><text x="1610.0" y="416.0" class="body" text-anchor="start" >Закрытый шкаф: 2090 − 580</text><text x="2520.0" y="416.0" class="measure" text-anchor="end" >1510</text><text x="1610.0" y="452.0" class="body" text-anchor="start" >У банкетки: 2090 − 420</text><text x="2520.0" y="452.0" class="measure" text-anchor="end" >1670</text><text x="1610.0" y="495.0" class="small" text-anchor="start" >Это номинальная геометрия, не чистый проход.</text><line x1="1610.0" y1="530.0" x2="2520.0" y2="530.0" stroke="#d9e4d9" stroke-width="2" /><text x="1610.0" y="580.0" class="body" text-anchor="start" >Если створка 574 P открыта на 90°:</text><text x="1610.0" y="622.0" class="measure" text-anchor="start" >2090 − 580 − 574 = 936 мм</text><text x="1610.0" y="660.0" class="small" text-anchor="start" >Одна условная створка, без ручки и толщины.</text><text x="1610.0" y="694.0" class="small" text-anchor="start" >Петли и реальный угол пока не определены.</text><line x1="1610.0" y1="730.0" x2="2520.0" y2="730.0" stroke="#d9e4d9" stroke-width="2" /><text x="1610.0" y="780.0" class="body" text-anchor="start" >Если петли D1 у левого края B01:</text><text x="1610.0" y="822.0" class="measure" text-anchor="start" >610 − 580 = 30 мм до оси полотна</text><text x="1610.0" y="860.0" class="small" text-anchor="start" >Только пример открытия внутрь на 90°.</text><text x="1610.0" y="894.0" class="small" text-anchor="start" >Коробка, ручка и фактические петли не учтены.</text><line x1="1610.0" y1="930.0" x2="2520.0" y2="930.0" stroke="#d9e4d9" stroke-width="2" /><text x="1610.0" y="980.0" class="body" text-anchor="start" >Вход D1 — два разных источника</text><text x="1610.0" y="1022.0" class="measure" text-anchor="start" >B01: 610 + 1010 + 470 = 2090</text><text x="1610.0" y="1062.0" class="measure" text-anchor="start" >Контроль: 1140 × 2150; привязка M</text><text x="1610.0" y="1100.0" class="small" text-anchor="start" >Сохранять эти данные раздельно.</text><text x="1610.0" y="1160.0" class="warn" text-anchor="start" >До изготовления: обмер D1, D2, щита,</text><text x="1610.0" y="1196.0" class="warn" text-anchor="start" >чистового пола и фактических откосов.</text><text x="1610.0" y="1255.0" class="small" text-anchor="start" >Полный контур коридора не обмерен;</text><text x="1610.0" y="1290.0" class="small" text-anchor="start" >расстояния до D3–D5 здесь не назначены.</text><rect x="40.0" y="1525.0" width="2520.0" height="125.0" fill="#fffaf1" stroke="#ead7b6" stroke-width="2" rx="18"/><text x="68.0" y="1571.0" class="small" text-anchor="start" >B — план БТИ; P — предложение; M — отсутствует. Размеры фасадов, петель и щита требуют проверки на месте.</text><text x="68.0" y="1610.0" class="small" text-anchor="start" >Схема не подтверждает открывание входной двери, доступ к щиту или безопасную ширину прохода.</text></svg>