<text x="855.00" y="430.00" class="head" text-anchor="start" >ЩИТ</text>
<text x="855.00" y="465.00" class="body" text-anchor="start" >550 мм внутри P</text>
<text x="855.00" y="500.00" class="body" text-anchor="start" >Высота/глубина</text>
<text x="855.00" y="535.00" class="body" text-anchor="start" >самого щита: M</text>
<text x="855.00" y="615.00" class="head" text-anchor="start" >КУРТКИ</text>
<text x="855.00" y="650.00" class="body" text-anchor="start" >446 мм внутри P</text>
<text x="855.00" y="685.00" class="body" text-anchor="start" >Штанга h1750 P</text>
<text x="855.00" y="720.00" class="body" text-anchor="start" >Верх полки h2150 P</text>
<text x="855.00" y="755.00" class="body" text-anchor="start" >Нижняя h380 P</text>
<text x="855.00" y="835.00" class="head" text-anchor="start" >БАНКЕТКА</text>
<text x="855.00" y="870.00" class="body" text-anchor="start" >575 × 420 P</text>
<text x="855.00" y="905.00" class="body" text-anchor="start" >h сиденья 460 P</text>
<text x="855.00" y="970.00" class="body" text-anchor="start" >250 — ящик вдоль стены</text>
<text x="855.00" y="1005.00" class="body" text-anchor="start" >325 — оставшийся участок</text>
<text x="855.00" y="1040.00" class="small" text-anchor="start" >до учёта боковин и зазоров</text>
<text x="855.00" y="1110.00" class="body" text-anchor="start" >Панель: 550 + 446 +</text>
<text x="855.00" y="1145.00" class="body" text-anchor="start" >3 × 18 = 1050 P</text>
<text x="1292.00" y="226.00" class="head" text-anchor="start" >02  Две части банкетки сбоку</text>
