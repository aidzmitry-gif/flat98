<text x="1320.00" y="755.00" class="body" text-anchor="start" >Ящик снаружи: 250 вдоль стены</text>
<text x="1320.00" y="788.00" class="body" text-anchor="start" >× 380 в глубину × 90 в высоту P.</text>
<text x="1920.00" y="755.00" class="body" text-anchor="start" >Просвет для высокой обуви</text>
<text x="1920.00" y="788.00" class="body" text-anchor="start" >до сиденья около 400 мм P.</text>
<text x="1320.00" y="830.00" class="small" text-anchor="start" >Внутренний размер ящика меньше; примерить тапочки.</text>
<text x="1292.00" y="924.00" class="head" text-anchor="start" >03  Ширина фасадов — только предварительная</text>
<text x="1292.00" y="964.00" class="body" text-anchor="start" >Два фасада шкафа: ≈574 и 470 мм P, если они накладные и все три зазора по 2 мм.</text>
<text x="1292.00" y="1000.00" class="body" text-anchor="start" >Два фасада антресоли: ≈284,5 мм каждый P при тех же условных зазорах.</text>
<text x="1292.00" y="1036.00" class="body" text-anchor="start" >Фактическая ширина проёма меняется из-за петель; размер дверцы щита неизвестен.</text>
<text x="1292.00" y="1072.00" class="body" text-anchor="start" >Зеркало, петли и направление распахивания определить после измерения и выбора фурнитуры.</text>
<text x="1292.00" y="1133.00" class="body" text-anchor="start" >Для одежды расстояние от верха нижней полки до оси штанги: 1750 − 380 = 1370 мм P.</text>
<text x="1292.00" y="1170.00" class="body" text-anchor="start" >Вешалки занимают часть этой высоты; ширину штанги уменьшат крепления.</text>
<text x="1292.00" y="1236.00" class="small" text-anchor="start" >Размеры B — БТИ; P — предложение; M — неизвестно, необходимо измерить.</text>
<rect x="45.00" y="1327.00" width="2510.00" height="370.00" fill="#fff9ef" stroke="#dbe4dc" stroke-width="2" rx="20"/>
<text x="72.00" y="1368.00" class="head" text-anchor="start" >Проверка и компромисс</text>
<text x="72.00" y="1409.00" class="body" text-anchor="start" >25 + 1050 + 575 + 25 = 1675 мм. Корпус: 550 + 446 + 3 × 18 = 1050 мм.</text>
<text x="72.00" y="1446.00" class="body" text-anchor="start" >575 − 250 = 325 мм — только плановая разность для участка под обувь, до учёта опор, стенок и креплений.</text>
<text x="72.00" y="1483.00" class="body" text-anchor="start" >Для 550 мм необходимо отдельно проверить реальную чистую ширину проёма, открывание дверцы щита и место под кабели.</text>
<text x="72.00" y="1520.00" class="body" text-anchor="start" >Даже увеличенная секция может оказаться мала. До заказа измерить щит и согласовать конструкцию и перенос с электриком.</text>
<text x="72.00" y="1573.00" class="small" text-anchor="start" >Под сиденьем: 460 − 35 подушка − 25 основание = 400; под ящиком 400 − 90 = 310 мм P.</text>
<text x="72.00" y="1608.00" class="small" text-anchor="start" >Обувь — на полу в один ряд; точное число пар зависит от габаритов обуви и конструкции.</text>
</svg>