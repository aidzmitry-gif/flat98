<line x1="373.75" y1="1050" x2="567.5" y2="1050" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="267.5" y="1075" class="dimtext" text-anchor="middle">850 P</text>
<text x="470.625" y="1075" class="dimtext" text-anchor="middle">775 P</text>
<circle cx="636" cy="327" r="15" class="badgebg"/><text x="636" y="332" class="badge" text-anchor="middle">1</text>
<text x="660" y="333" class="callhead" text-anchor="start">Щиток · отделение 400 P</text>
<text x="660" y="363" class="body" text-anchor="start">Размер самого щита пока неизвестен.</text>
<text x="660" y="390" class="body" text-anchor="start">Независимая мебельная дверца.</text>
<text x="660" y="417" class="body" text-anchor="start">Свободный подход к крышке щита.</text>
<line x1="620" y1="442" x2="977" y2="442" class="guide"/>
<circle cx="636" cy="474" r="15" class="badgebg"/><text x="636" y="479" class="badge" text-anchor="middle">2</text>
<text x="660" y="480" class="callhead" text-anchor="start">Куртки · отделение 396 P</text>
<text x="660" y="510" class="body" text-anchor="start">Штанга на высоте 1750 мм от пола.</text>
<text x="660" y="537" class="body" text-anchor="start">Ориентир — 3–4 объёмные куртки.</text>
<text x="660" y="564" class="body" text-anchor="start">На крепления штанги нужен запас.</text>
<line x1="620" y1="588" x2="977" y2="588" class="guide"/>
<circle cx="636" cy="620" r="15" class="badgebg"/><text x="636" y="625" class="badge" text-anchor="middle">3</text>
<text x="660" y="626" class="callhead" text-anchor="start">Верхняя полка</text>
<text x="660" y="656" class="body" text-anchor="start">Верх полки h=2150 мм.</text>
<text x="660" y="683" class="body" text-anchor="start">Свободная высота над ней ≈532 мм.</text>
<text x="660" y="710" class="body" text-anchor="start">Шапки и сезонные вещи.</text>
<line x1="620" y1="734" x2="977" y2="734" class="guide"/>
<circle cx="636" cy="766" r="15" class="badgebg"/><text x="636" y="771" class="badge" text-anchor="middle">4</text>
<text x="660" y="772" class="callhead" text-anchor="start">Сиденье и обувь</text>
<text x="660" y="802" class="body" text-anchor="start">Банкетка 775 × 420 мм, h=460 мм.</text>
<text x="660" y="829" class="body" text-anchor="start">Сухой ящик для тапочек под сиденьем.</text>
<text x="660" y="856" class="body" text-anchor="start">Снизу — один открытый ряд на полу.</text>
<line x1="620" y1="880" x2="977" y2="880" class="guide"/>
<text x="620" y="918" class="small" text-anchor="start">Нижняя съёмная полка h=380 мм.</text>
<text x="620" y="945" class="small" text-anchor="start">От неё до оси штанги 1370 мм.</text>
<text x="620" y="972" class="small" text-anchor="start">Цоколь шкафа 80 мм. Материал 18 мм.</text>
<text x="620" y="999" class="small" text-anchor="start">Все внутренние размеры — эскиз P.</text>
<rect x="1030" y="168" width="842" height="468" class="card" rx="18"/>
<text x="1058" y="209" class="head" text-anchor="start">02   Банкетка в разрезе</text>
<text x="1058" y="237" class="small" text-anchor="start">Два участка одного сиденья · высота 460 мм</text>
<text x="1080" y="275" class="callhead" text-anchor="start">Со стороны шкафа</text>
<text x="1470" y="275" class="callhead" text-anchor="start">Со стороны входной двери</text>
<line x1="1090" y1="355" x2="1090" y2="540" class="wall"/>
<line x1="1086" y1="540" x2="1296" y2="540" class="floor"/>
<rect x="1090" y="392.8" width="134.4" height="11.2" class="cushion" rx="2"/>
<rect x="1090" y="404" width="134.4" height="8" class="shelf"/>
<line x1="1090" y1="330" x2="1224.4" y2="330" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="1157.2" y="321" class="dimtext" text-anchor="middle">420 P</text>
<rect x="1090" y="412" width="134.4" height="28.8" class="drawer"/>
<line x1="1186" y1="425" x2="1210" y2="425" class="guide"/>
<line x1="1245" y1="440.8" x2="1245" y2="540" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="1254" y="495.4" class="dimtext" text-anchor="start">310</text>
<path d="M1127 538 v-28 h20 v20 h15 q8 0 8 9 Z" class="shoe"/>
<line x1="1470" y1="355" x2="1470" y2="540" class="wall"/>
<line x1="1466" y1="540" x2="1676" y2="540" class="floor"/>
<rect x="1470" y="392.8" width="134.4" height="11.2" class="cushion" rx="2"/>
<rect x="1470" y="404" width="134.4" height="8" class="shelf"/>
<line x1="1470" y1="330" x2="1604.4" y2="330" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="1537.2" y="321" class="dimtext" text-anchor="middle">420 P</text>
<line x1="1625" y1="412" x2="1625" y2="540" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="1634" y="481" class="dimtext" text-anchor="start">400</text>
<path d="M1507 538 v-70 h20 v61 h15 q8 0 8 9 Z" class="shoe"/>
<text x="1090" y="585" class="small" text-anchor="start">ящик ≈370 × 380 × 90 P</text>
<text x="1470" y="585" class="small" text-anchor="start">ботинки стоят на общем полу</text>
<text x="1058" y="614" class="tiny" text-anchor="start">Размеры ящика внешние. Полезная высота меньше после установки направляющих.</text>
<rect x="1030" y="652" width="842" height="448" class="card" rx="18"/>
<text x="1058" y="695" class="head" text-anchor="start">03   Глубина и устройство шкафа</text>
<text x="1058" y="723" class="small" text-anchor="start">План шкафа · размер по глубине условный</text>
<line x1="1080" y1="794" x2="1080" y2="1036" class="wall"/>
<rect x="1083" y="796" width="280" height="230" class="coatbay"/>
<rect x="1354" y="796" width="9" height="230" class="casewall"/>
<line x1="1095" y1="1036" x2="1363" y2="1036" class="floor"/>
<line x1="1080" y1="767" x2="1363" y2="767" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="1221" y="757" class="dimtext" text-anchor="middle">580 P с фасадом</text>
<line x1="1093" y1="1005" x2="1347" y2="1005" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="1220" y="996" class="small" text-anchor="middle">≈550–555 P внутри</text>
<circle cx="1222" cy="895" r="13" fill="#748b80" stroke="#3a554a" stroke-width="2"/>
<text x="1222" y="934" class="tiny" text-anchor="middle">ось штанги</text>
<text x="1408" y="799" class="body" text-anchor="start">Обычная штанга вдоль фасада.</text>
<text x="1408" y="831" class="body" text-anchor="start">Плечики и объём курток примерить.</text>
<text x="1408" y="875" class="body" text-anchor="start">Задняя стенка в зоне щита</text>
<text x="1408" y="902" class="body" text-anchor="start">зависит от корпуса и кабелей.</text>
<text x="1408" y="946" class="body" text-anchor="start">Розетки E-03 привязать отдельно</text>
<text x="1408" y="973" class="body" text-anchor="start">к доступной сухой зоне.</text>
<text x="1058" y="1074" class="small" text-anchor="start">При 18-мм деталях 400 + 396 + 3 × 18 = 850 мм.</text>
<rect x="48" y="1118" width="1824" height="210" class="warncard" rx="18"/>
<text x="76" y="1157" class="head" text-anchor="start">Размер щита ещё не измерен</text>
<text x="76" y="1191" class="body" text-anchor="start">400 мм — предварительная ширина отделения, а не ширина щита. После обмера щита, вводов и его дверцы электрик определит необходимый доступ.</text>
<text x="76" y="1223" class="body" text-anchor="start">Дверцы шкафа, крепление банкетки и положение розеток согласуются после проверки на месте. Место для щита находится дальше от входной двери.</text>
<text x="76" y="1255" class="body" text-anchor="start">Габарит по стене · 25 + 850 + 775 + 25 = 1675 мм по B01. Потолок 2750 мм по точкам S09. Высота корпуса 2700 мм принята для эскиза.</text>
<text x="76" y="1294" class="small" text-anchor="start">B — план БТИ · P — эскиз · M — замерить. База 850/775 соответствует варианту C v32. Размеры в миллиметрах.</text>
</svg>
