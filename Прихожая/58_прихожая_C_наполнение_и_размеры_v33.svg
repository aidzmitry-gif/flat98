<circle cx="391.75" cy="516" r="15" class="badgebg"/><text x="391.75" y="521" class="badge" text-anchor="middle">3</text>
<circle cx="391.75" cy="933.5" r="15" class="badgebg"/><text x="391.75" y="938.5" class="badge" text-anchor="middle">4</text>
