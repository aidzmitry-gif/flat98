<text x="48" y="101" class="title">Что будет внутри шкафа</text>
<text x="50" y="135" class="subtitle">Один ряд обуви на полу · банкетка у входа · щиток в дальней сухой секции</text>
<rect x="48" y="168" width="964" height="932" class="card" rx="18"/>
<text x="76" y="209" class="head" text-anchor="start">01   Внутреннее наполнение</text>
<text x="76" y="237" class="small" text-anchor="start">Развёртка без мебельных дверей. От коридора к входной двери D1.</text>
<text x="159" y="286" class="tiny" text-anchor="start">к коридору</text>
<text x="571.75" y="286" class="tiny" text-anchor="end">к D1</text>
