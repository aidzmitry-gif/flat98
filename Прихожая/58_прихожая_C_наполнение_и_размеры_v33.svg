<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1365" viewBox="0 0 1920 1365">
<title>Прихожая C — наполнение шкафа и банкетки, v33</title>
<desc>Эскизное внутреннее наполнение мебели вдоль стены 1675 мм по БТИ. Щит в дальней сухой части, габарит неизвестен и требует обмера. Схема не является рабочим чертежом.</desc>
