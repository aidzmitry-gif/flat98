<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1024" viewBox="0 0 1640 1024">
<title>APT‑001, прихожая C. Банкетка у двери, щит дальше</title>
<desc>Эскиз v32. План, фасад и проверки по переносу электрощита из зоны входа в сухую доступную секцию шкафа. Геометрия БТИ B01 и эскизные размеры мебели даны раздельно.</desc>
<defs>
  <marker id="dim" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#53655f"/></marker>
  <marker id="route" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#265e56"/></marker>
</defs>
<style>
 text{font-family:"Segoe UI",Arial,sans-serif;fill:#223733}
 .top{font-size:16px;font-weight:700;letter-spacing:1.5px;fill:#265e56}
 .title{font-size:42px;font-weight:750}
 .caption{font-size:19px;fill:#4b635c}
 .head{font-size:24px;font-weight:700}
 .subhead{font-size:19px;font-weight:700}
 .body{font-size:17px}
 .small{font-size:15px;fill:#455b55}
 .tiny{font-size:13px;fill:#4b625b}
 .door,.dimtext{font-size:15px;font-weight:700}
 .door{fill:#8f581d}
 .badge{font-size:14px;font-weight:700;fill:white}
 .card{fill:white;stroke:#d7e0d9;stroke-width:1.5}
 .room{fill:#f8f7f3}
 .wall{stroke:#2e4140;stroke-width:7;stroke-linecap:square}
 .opening{stroke:#b07527;stroke-width:3;stroke-dasharray:8 5}
 .openedge{stroke:#76918a;stroke-width:2;stroke-dasharray:6 7}
 .guide{stroke:#b2bfb7;stroke-width:1}
 .dimline{stroke:#53655f;stroke-width:1.4}
 .case{fill:#e3d8c8;stroke:#817763;stroke-width:1.2}
 .alcove{fill:#e6efe5;stroke:#99b2a0;stroke-width:1}
 .mirror{fill:#cadfe1;stroke:#759397;stroke-width:1}
 .floor{stroke:#265e56;stroke-width:2.1}
 .cushion{fill:#b09072;stroke:#795d47;stroke-width:1}
 .deck{fill:#ae957a;stroke:#795d47;stroke-width:1}
 .hook{fill:none;stroke:#51635e;stroke-width:1.6;stroke-linecap:round}
 .shoe{fill:#796655;stroke:#55463c;stroke-width:1;stroke-linejoin:round}
</style>
<rect width="1640" height="1024" fill="#f3f6f1"/>
<text x="48" y="48" class="top">APT‑001 / ПРИХОЖАЯ 3 / ВАРИАНТ C / РЕДАКЦИЯ v32</text>
<text x="48" y="98" class="title">Банкетка у двери, щит дальше</text>
<text x="49" y="129" class="caption">Левая стена 1675 мм по БТИ · можно сесть сразу при входе</text>
<rect x="48" y="153" width="742" height="520" class="card" rx="16"/>
<text x="74" y="194" class="head" text-anchor="start">01   План с банкеткой у входа</text>
<line x1="134" y1="233" x2="562.45" y2="233" class="dimline" marker-start="url(#dim)" marker-end="url(#dim)"/>
<line x1="134" y1="236" x2="134" y2="261" class="guide"/>
<line x1="562.45" y1="236" x2="562.45" y2="261" class="guide"/>
<text x="348.225" y="222" class="dimtext" text-anchor="middle">2090 B</text>
<line x1="100" y1="268" x2="100" y2="611.375" class="dimline" marker-start="url(#dim)" marker-end="url(#dim)"/>
<line x1="107" y1="268" x2="127" y2="268" class="guide"/>
<line x1="107" y1="611.375" x2="127" y2="611.375" class="guide"/>
<text x="88" y="439.688" transform="rotate(-90 88 439.688)" text-anchor="middle" class="dimtext">1675 B</text>
<rect x="134" y="268" width="428.45" height="343.375" class="room"/>
<rect x="134" y="273.125" width="86.1" height="158.875" class="alcove"/>
<rect x="134" y="432" width="118.9" height="174.25" class="case"/>
<line x1="134" y1="268" x2="134" y2="611.375" class="wall"/>
<line x1="134" y1="268" x2="259.05" y2="268" class="wall"/>
<line x1="466.1" y1="268" x2="562.45" y2="268" class="wall"/>
<line x1="562.45" y1="268" x2="562.45" y2="383.825" class="wall"/>
<line x1="562.45" y1="570.375" x2="562.45" y2="611.375" class="wall"/>
<line x1="259.05" y1="268" x2="466.1" y2="268" class="opening"/>
<line x1="562.45" y1="383.825" x2="562.45" y2="570.375" class="opening"/>
<line x1="134" y1="611.375" x2="562.45" y2="611.375" class="openedge"/>
<text x="362.575" y="290" class="door" text-anchor="middle">D1 · 1010 B</text>
<path d="M388 306 Q370 356 251 357" fill="none" stroke="#265e56" stroke-width="2.2" marker-end="url(#route)"/>
<text x="337" y="379" class="tiny" text-anchor="middle">к банкетке</text>
<circle cx="153" cy="352" r="12" fill="#9c632a"/><text x="153" y="357" class="badge" text-anchor="middle">1</text>
<text x="177.05" y="318" class="dimtext" text-anchor="middle">420 P</text>
<text x="177.05" y="404" class="tiny" text-anchor="middle">банкетка</text>
<text x="193.45" y="479" class="dimtext" text-anchor="middle">580 P</text>
<text x="193.45" y="502" class="tiny" text-anchor="middle">шкаф</text>
<circle cx="156" cy="565" r="12" fill="#265e56"/><text x="156" y="570" class="badge" text-anchor="middle">2</text>
<line x1="255.9" y1="550" x2="557.45" y2="550" class="dimline" marker-start="url(#dim)" marker-end="url(#dim)"/>
<text x="407.675" y="538" class="dimtext" text-anchor="middle">1510 P</text>
<text x="407.675" y="575" class="tiny" text-anchor="middle">поперёк при закрытом шкафе</text>
<text x="588" y="425" class="door" text-anchor="start">D2 · 910 B</text>
<text x="588" y="450" class="small" text-anchor="start">в кухню</text>
<text x="588" y="474" class="tiny" text-anchor="start">открывается в кухню</text>
<text x="348.225" y="643" class="small" text-anchor="middle">открытый переход в коридор 4</text>
<rect x="806" y="153" width="786" height="520" class="card" rx="16"/>
<text x="832" y="194" class="head" text-anchor="start">02   Левая стена от коридора к двери</text>
<text x="852" y="227" class="tiny" text-anchor="start">к коридору</text>
<text x="1086.5" y="227" class="tiny" text-anchor="end">к D1</text>
<rect x="852" y="243" width="234.5" height="385" class="room" stroke="#a4b1a9" stroke-width="1"/>
<rect x="855.5" y="250" width="119" height="378" class="case"/>
<line x1="915" y1="250" x2="915" y2="628" class="guide"/>
<rect x="920" y="306" width="49.5" height="286.3" class="mirror" rx="4"/>
<line x1="925" y1="370.4" x2="964.5" y2="348" stroke="#eff7f6" stroke-width="2"/>
<circle cx="885.25" cy="448.8" r="12" fill="#265e56"/><text x="885.25" y="453.8" class="badge" text-anchor="middle">2</text>
<rect x="974.5" y="250" width="108.5" height="82.6" class="case"/>
<rect x="974.5" y="332.6" width="108.5" height="231" class="alcove"/>
<path d="M992.945 399.8 v8 q0 6 5 4" class="hook"/>
<path d="M1016.815 399.8 v8 q0 6 5 4" class="hook"/>
<path d="M1040.685 399.8 v8 q0 6 5 4" class="hook"/>
<path d="M1064.555 399.8 v8 q0 6 5 4" class="hook"/>
<path d="M990.775 469.4 v7 q0 5 4 3" class="hook"/>
<path d="M1065.64 469.4 v7 q0 5 4 3" class="hook"/>
<rect x="974.5" y="563.6" width="108.5" height="4.9" class="cushion" rx="2"/>
<rect x="974.5" y="568.5" width="108.5" height="3.5" class="deck"/>
<rect x="974.5" y="572" width="54.25" height="12.6" class="case"/>
<line x1="992.945" y1="578.72" x2="1010.305" y2="578.72" stroke="#82765e" stroke-width="1.4"/>
<path d="M987.03 627 v-9 h8 v4 h3 q4 0 4 5 Z" class="shoe"/>
<path d="M1014.155 627 v-9 h8 v4 h3 q4 0 4 5 Z" class="shoe"/>
<path d="M1052.13 627 v-25 h8 v20 h3 q4 0 4 5 Z" class="shoe"/>
<line x1="846" y1="628" x2="1092.5" y2="628" class="floor"/>
<text x="915" y="655" class="dimtext" text-anchor="middle">850 P</text>
<text x="1028.75" y="655" class="dimtext" text-anchor="middle">775 P</text>
<text x="1121" y="254" class="subhead" text-anchor="start">Банкетка 775 × 420 мм</text>
<text x="1121" y="280" class="small" text-anchor="start">Высота сиденья 460 мм. Крючки на двух высотах.</text>
<text x="1121" y="306" class="small" text-anchor="start">Пол продолжается под банкеткой.</text>
<text x="1121" y="332" class="small" text-anchor="start">У D1 — просвет 400 мм под высокие ботинки.</text>
<text x="1121" y="358" class="small" text-anchor="start">Со стороны шкафа — ящик для тапочек, просвет 310 мм.</text>
<line x1="1121" y1="381" x2="1564" y2="381" class="guide"/>
<text x="1121" y="410" class="subhead" text-anchor="start">Шкаф 850 × 580 мм</text>
<text x="1121" y="436" class="small" text-anchor="start">Зеркало на фасаде рядом с банкеткой.</text>
<text x="1121" y="462" class="small" text-anchor="start">Щит за отдельной открываемой дверцей дальше от входа.</text>
<text x="1121" y="488" class="small" text-anchor="start">Деление фасадов и внутренней секции уточняется.</text>
<line x1="1121" y1="512" x2="1564" y2="512" class="guide"/>
<text x="1121" y="542" class="subhead" text-anchor="start">Размерная цепочка стены</text>
<text x="1121" y="568" class="body" text-anchor="start">25 + 775 + 850 + 25 = 1675 мм</text>
<text x="1121" y="595" class="small" text-anchor="start">Торцевые доборы и чистовую высоту проверить.</text>
<rect x="48" y="691" width="1544" height="296" class="card" rx="16"/>
<text x="74" y="732" class="head" text-anchor="start">03   Что проверить на месте</text>
<line x1="814" y1="756" x2="814" y2="866" class="guide"/>
<circle cx="87" cy="773" r="12" fill="#9c632a"/><text x="87" y="778" class="badge" text-anchor="middle">1</text>
<text x="112" y="780" class="subhead" text-anchor="start">Существующая зона по фото F08</text>
<text x="112" y="808" class="body" text-anchor="start">Щит и три низкие розетки на левой стене рядом с D1.</text>
<text x="112" y="835" class="body" text-anchor="start">Если E-03 окажутся под банкеткой, согласовать их новое</text>
<text x="112" y="862" class="body" text-anchor="start">место в доступной сухой секции.</text>
<circle cx="853" cy="773" r="12" fill="#265e56"/><text x="853" y="778" class="badge" text-anchor="middle">2</text>
<text x="878" y="780" class="subhead" text-anchor="start">Место для щита в дальнем конце шкафа</text>
<text x="878" y="808" class="body" text-anchor="start">Электрик проверяет ввод, длину линий и доступ к крышке щита.</text>
<text x="878" y="835" class="body" text-anchor="start">Затем уточняются привязки, трасса и конструкция сервисной дверцы.</text>
<text x="878" y="862" class="small" text-anchor="start">Обозначения 1 и 2 показывают зоны. Оси щита требуют обмера.</text>
<line x1="74" y1="882" x2="1567" y2="882" class="guide"/>
<text x="74" y="910" class="small" text-anchor="start">D1 по БТИ · 610 + 1010 + 470 = 2090 мм. Разница по ширине у входа · 610 − 420 = 190 мм. Коробку, ручку и ход двери проверить по месту.</text>
<text x="74" y="936" class="small" text-anchor="start">Проём D1 1140 × 2150 мм (U01). Высота 2750 мм по точкам S09. План БТИ и контрольный проём учитываются раздельно.</text>
<text x="74" y="961" class="small" text-anchor="start">B — по БТИ. P — эскизное значение. Планировка согласуется до переноса щита и изготовления шкафа.</text>
</svg>
