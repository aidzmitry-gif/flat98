<line x1="130" y1="112" x2="1272" y2="112" class="dimline"/><line x1="130" y1="118" x2="130" y2="138" class="ext"/><line x1="1272" y1="118" x2="1272" y2="138" class="ext"/>
<text x="701" y="105" class="dim" text-anchor="middle">5710 (плановая ширина; контрольный замер 5705)</text>
<line x1="130" y1="713" x2="1272" y2="713" class="dimline"/><line x1="130" y1="680" x2="130" y2="720" class="ext"/><line x1="178" y1="680" x2="178" y2="720" class="ext"/><line x1="298" y1="680" x2="298" y2="720" class="ext"/><line x1="858" y1="680" x2="858" y2="720" class="ext"/><line x1="1272" y1="680" x2="1272" y2="720" class="ext"/>
<text x="154" y="742" class="dim" text-anchor="middle">240</text><text x="238" y="742" class="dim" text-anchor="middle">600</text><text x="578" y="742" class="dim" text-anchor="middle">2800</text><text x="1065" y="742" class="dim" text-anchor="middle">2070</text>
<text x="701" y="770" class="label" text-anchor="middle">240 + 600 + 2800 + 2070 = 5710 мм</text>
<!-- screen width and cabinet side margins -->
<line x1="357" y1="520" x2="804" y2="520" class="dimline"/><text x="580" y="545" class="dim" text-anchor="middle">2214</text>
<line x1="822" y1="253" x2="822" y2="504" class="dimline"/><text x="840" y="379" class="dim" text-anchor="middle" transform="rotate(-90 840 379)">1245</text>
<text x="328" y="570" class="small" text-anchor="middle">293</text><text x="832" y="570" class="small" text-anchor="middle">293</text>
<line x1="72" y1="200" x2="72" y2="680" class="dimline"/><line x1="80" y1="200" x2="130" y2="200" class="ext"/><line x1="80" y1="680" x2="130" y2="680" class="ext"/><text x="60" y="440" class="dim" text-anchor="middle" transform="rotate(-90 60 440)">стеллаж H=2400</text>
<line x1="92" y1="572" x2="92" y2="680" class="dimline"/><text x="80" y="626" class="small" text-anchor="middle" transform="rotate(-90 80 626)">540*</text>

<!-- Option cards -->
<text x="70" y="818" class="title" style="font-size:23px">Предлагаемые размеры отделки</text>
<rect x="70" y="842" width="460" height="240" rx="12" fill="#f0e8dd" stroke="#c4b6a5"/>
<text x="94" y="878" class="cardTitle">1 · Панель под травертин</text>
<rect x="96" y="900" width="120" height="96" fill="#d7c7ad" stroke="#8f806d"/><rect x="137" y="925" width="45" height="27" fill="#52605f" stroke="#283033"/>
<text x="240" y="914" class="cardBody">Ширина: 2800</text><text x="240" y="941" class="cardBody">Высота: ≈2100*</text><text x="240" y="968" class="cardBody">Выступ: ориентир 15–20</text>
<text x="94" y="1030" class="small">По ширине тумбы; нижняя кромка от её верха.</text><text x="94" y="1054" class="small">Финальную высоту — по потолку и отделке.</text>

<rect x="570" y="842" width="460" height="240" rx="12" fill="#eee9e3" stroke="#c4b6a5"/>
<text x="594" y="878" class="cardTitle">2 · Тканевые акустические панели</text>
<rect x="605" y="923" width="23" height="72" fill="#a29486" stroke="#71675e"/><rect x="637" y="935" width="94" height="52" fill="#59635d" stroke="#283033"/><rect x="740" y="923" width="23" height="72" fill="#a29486" stroke="#71675e"/>
<text x="790" y="918" class="cardBody">2 шт. × 220 × 1250</text><text x="790" y="945" class="cardBody">Толщина: около 25</text><text x="790" y="972" class="cardBody">По бокам экрана</text>
<text x="594" y="1030" class="small">Центр за экраном остаётся ровным.</text><text x="594" y="1054" class="small">Размер панели — эскизный, подогнать к раме.</text>

<rect x="1070" y="842" width="460" height="240" rx="12" fill="#eee8df" stroke="#c4b6a5"/>
<text x="1094" y="878" class="cardTitle">3 · Рельефная штукатурка</text>
<rect x="1100" y="906" width="76" height="102" fill="#d6cec2" stroke="#897d70"/><path d="M1118 907 Q1142 930 1118 956 T1118 1007 M1137 907 Q1160 931 1137 956 T1137 1007 M1156 907 Q1178 931 1156 956 T1156 1007" fill="none" stroke="#b3a898" stroke-width="4"/>
<text x="1200" y="918" class="cardBody">Ш × В: ≈1100 × 2200</text><text x="1200" y="945" class="cardBody">Рельеф: до 20–25</text><text x="1200" y="972" class="cardBody">На свободной стене справа</text>
<text x="1094" y="1030" class="small">Оставить запас от наличника двери.</text><text x="1094" y="1054" class="small">Габарит и место — концепт для согласования.</text>

<text x="70" y="1118" class="warn">* Проверка перед заказом: 5710 — плановая ширина, в обмерах есть 5705; потолок по точкам 2712–2727. H тумбы 540 — из 3D-модели, не утверждённый заказной размер.</text>
<text x="70" y="1147" class="small muted">Экран: ориентир активного поля 2214 × 1245; его внешняя рама будет больше. Схема согласовательная, не монтажный чертёж.</text>
</svg>
