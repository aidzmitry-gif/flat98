<rect x="357" y="251" width="447" height="255" rx="2" fill="#171a1b" stroke="#0d0f10" stroke-width="2"/>
<rect x="359" y="253" width="443" height="251" fill="#74837c"/>
<text x="130" y="126" class="small muted">ПОТОЛОК H ≈ 2712–2727* · в модели для визуализации принято H=2700</text>
<text x="202" y="436" class="small" transform="rotate(-90 202 436)" text-anchor="middle" fill="#fff">книжный стеллаж</text>
<text x="578" y="635" class="label" text-anchor="middle" fill="#fff">тумба 2800 × 450 × 540*</text>
<text x="580" y="530" class="small" text-anchor="middle">полезное поле экрана 2214 × 1245</text>
<text x="580" y="550" class="small" text-anchor="middle">ось экрана S=2240</text>
<text x="1065" y="427" class="label" text-anchor="middle">свободная стена</text>
<text x="1065" y="451" class="small" text-anchor="middle">2070</text>

