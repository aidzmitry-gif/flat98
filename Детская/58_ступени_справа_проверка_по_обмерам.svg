<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="955" viewBox="0 0 1560 955">
<defs><style>.title{font:700 30px 'Segoe UI',sans-serif;fill:#183e33}.h{font:700 20px 'Segoe UI',sans-serif;fill:#183e33}.t{font:16px 'Segoe UI',sans-serif;fill:#29483e}.s{font:14px 'Segoe UI',sans-serif;fill:#435d53}.b{font-weight:700}.card{fill:#fffefa;stroke:#cad9d1;stroke-width:1.5}.wall{stroke:#23443a;stroke-width:4;fill:none}.dim{stroke:#427b8e;stroke-width:1.5;marker-start:url(#arr);marker-end:url(#arr)}.guide{stroke:#9baea4;stroke-width:1;stroke-dasharray:5 5}.note{fill:#fff0e4;stroke:#c59471;stroke-width:1.5}</style><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 1L1 4L8 7" fill="none" stroke="#427b8e" stroke-width="1.2"/></marker></defs>
<rect width="1560" height="955" fill="#f6f5ef"/>
<text x="35" y="47" class="title">Детская · проверка правой лестницы</text><text x="35" y="76" class="t">Вид сверху · обмер S10 и план БТИ B01 · все размеры в мм</text>
<rect x="1285" y="22" width="240" height="50" rx="8" class="note"/><text x="1405" y="54" text-anchor="middle" class="t b">ЭСКИЗ РАССТАНОВКИ</text>
<rect x="30" y="100" width="950" height="818" rx="12" class="card"/><text x="55" y="135" class="h">Привязка мебели и входа</text><text x="55" y="160" class="s">Вид с окном слева. Контур прямоугольный для расчёта; разница длин стен указана отдельно.</text>
<!-- reference rectangle 3837 × 2810; scale .18 px/mm; window at left and P2 at right -->
<line x1="145" y1="230" x2="835.66" y2="230" class="wall"/><line x1="145" y1="735.8" x2="835.66" y2="735.8" class="wall"/>
<line x1="145" y1="230" x2="145" y2="735.8" class="wall"/><line x1="835.66" y1="393.8" x2="835.66" y2="735.8" class="wall"/>
<line x1="835.66" y1="230" x2="835.66" y2="393.8" stroke="#4e8594" stroke-width="3" stroke-dasharray="6 5"/><text x="845" y="294" class="s b">ВХОД P2</text><text x="845" y="316" class="s">910 B</text>
<line x1="145" y1="338" x2="145" y2="626" stroke="#4e8594" stroke-width="5"/><text x="61" y="483" class="s b">ОКНО</text><text x="61" y="505" class="s">1600 B</text>
<text x="490" y="211" text-anchor="middle" class="s b">СТЕНА СО СПОРТОМ · 3825 R</text>
<rect x="145" y="230" width="90" height="397.8" fill="#eee8d5" stroke="#c1ac88"/><text x="190" y="450" text-anchor="middle" class="s b">СТОЛ</text><text x="190" y="470" text-anchor="middle" class="s">500 P</text>
<rect x="145" y="627.8" width="234" height="108" fill="#ead6b5" stroke="#ae906a"/><text x="262" y="674" text-anchor="middle" class="s b">ШКАФ У ОКНА</text><text x="262" y="696" text-anchor="middle" class="s">1300 × 600 P</text>
<rect x="457.66" y="546.8" width="378" height="189" fill="#dcebdd" stroke="#76947b" stroke-width="2"/><text x="646" y="626" text-anchor="middle" class="t b">КРОВАТЬ</text><text x="646" y="652" text-anchor="middle" class="s">2100 × 1050 P</text><text x="646" y="676" text-anchor="middle" class="s">хранение под нижним ярусом</text>
<line x1="615" y1="393.8" x2="903" y2="393.8" class="guide"/><line x1="835.66" y1="546.8" x2="903" y2="546.8" class="guide"/>
<rect x="635" y="475" width="200.66" height="71.8" rx="6" fill="#fff0cf" stroke="#bd965a" stroke-width="2" stroke-dasharray="6 4"/><text x="736" y="504" text-anchor="middle" class="s b">СТУПЕНИ СПРАВА</text><text x="736" y="526" text-anchor="middle" class="s">место условно, габарит M</text>
<line x1="905" y1="393.8" x2="905" y2="546.8" class="dim"/><text x="924" y="470" text-anchor="middle" transform="rotate(90 924 470)" class="s b">850 B/P</text>
<line x1="145" y1="772" x2="379" y2="772" class="dim"/><text x="262" y="765" text-anchor="middle" class="s">1300 P</text><line x1="379" y1="772" x2="457.66" y2="772" class="dim"/><text x="418" y="765" text-anchor="middle" class="s">437 P</text><line x1="457.66" y1="772" x2="835.66" y2="772" class="dim"/><text x="646" y="765" text-anchor="middle" class="s">2100 P</text>
<line x1="145" y1="816" x2="835.66" y2="816" class="dim"/><text x="490" y="808" text-anchor="middle" class="t b">СТЕНА С КРОВАТЬЮ · 3837 R</text>
<text x="55" y="858" class="s">850 — расстояние до проекции края проёма по B01. Свободный проход зависит от лестницы.</text><text x="55" y="883" class="s">Открывание двери, фасадов, выдвижение ящиков и зона колец требуют проверки.</text>
<rect x="1000" y="100" width="530" height="818" rx="12" class="card"/><text x="1025" y="137" class="h">Размеры и вывод</text>
<text x="1025" y="178" class="t b">Обмер S10</text><text x="1025" y="206" class="t">3837 — стена с кроватью.</text><text x="1025" y="232" class="t">3825 — стена со спортом.</text><text x="1025" y="258" class="t">2712–2716 — высота по точкам.</text><text x="1025" y="284" class="s">Стороны сопоставлены по положению входа.</text>
<text x="1025" y="328" class="t b">План БТИ B01</text><text x="1025" y="356" class="t">2810 — поперечный размер комнаты.</text><text x="1025" y="382" class="t">910 — участок входа P2 на плане.</text><text x="1025" y="408" class="s">Грани проёма и чистовую ширину уточнить на месте.</text>
<text x="1025" y="452" class="t b">Вдоль стены с мебелью</text><text x="1025" y="480" class="t">3837 − 1300 − 2100 = 437.</text><text x="1025" y="506" class="s">Остаток до учёта доборов и монтажных зазоров.</text>
<rect x="1020" y="540" width="490" height="180" rx="9" class="note"/><text x="1037" y="571" class="t b">Лестница спереди, у правого торца</text><text x="1037" y="600" class="t">2810 − 910 − 1050 = 850.</text><text x="1037" y="626" class="s">При выступе больше 850 её контур пересекает</text><text x="1037" y="648" class="s">проекцию входа по B01. Меньший выступ</text><text x="1037" y="670" class="s">требует проверки двери, ящиков и прохода.</text><text x="1037" y="696" class="s">Вылет лестницы и зона колец пока неизвестны.</text>
<text x="1025" y="762" class="s">R — обмер. B — план БТИ.</text><text x="1025" y="786" class="s">P — проектное допущение. M — данных нет.</text><text x="1025" y="838" class="s">Основание: фото S10, план B01 и ведомость обмеров.</text>
</svg>
