<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1100" viewBox="0 0 1700 1100">
<defs><style>.title{font:700 30px 'Segoe UI',sans-serif;fill:#193d32}.h{font:700 21px 'Segoe UI',sans-serif;fill:#193d32}.t{font:16px 'Segoe UI',sans-serif;fill:#29483e}.s{font:14px 'Segoe UI',sans-serif;fill:#455d53}.b{font-weight:700}.card{fill:#fffefa;stroke:#ccd8d0;stroke-width:1.5}.wall{stroke:#23443a;stroke-width:4;fill:none}.dim{stroke:#427b8e;stroke-width:1.5;marker-start:url(#arr);marker-end:url(#arr)}.guide{stroke:#81998e;stroke-width:1;stroke-dasharray:5 4}.alert{fill:#fff1e5;stroke:#ca9873;stroke-width:1.5}</style><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 1L1 4L8 7" fill="none" stroke="#427b8e" stroke-width="1.2"/></marker></defs>
<rect width="1700" height="1100" fill="#f6f5ef"/><text x="40" y="45" class="title">Детская · кровать с хранением и ступени</text><text x="40" y="73" class="t">Обмеры комнаты и предварительный контур мебели · вид сверху · мм</text><rect x="1430" y="20" width="225" height="48" rx="8" class="alert"/><text x="1542" y="51" class="t b" text-anchor="middle">НЕ ДЛЯ ЗАКАЗА</text>
<rect x="35" y="95" width="1050" height="930" rx="12" class="card"/><text x="65" y="130" class="h">1. Проверка места: окно слева, кровать справа</text><text x="65" y="155" class="s">Кровать и шкаф — предложенные контуры. Область ступеней показана условно, без масштаба.</text>
<!-- scale .18 px/mm; width 3825 length x 2810 room -->
<line x1="160" y1="245" x2="848.5" y2="245" class="wall"/><line x1="160" y1="750.8" x2="848.5" y2="750.8" class="wall"/><line x1="160" y1="245" x2="160" y2="750.8" class="wall"/><line x1="848.5" y1="245" x2="848.5" y2="750.8" class="guide"/>
<text x="62" y="430" class="s">ОКНО ←</text><text x="62" y="451" class="s">привязка M</text><text x="865" y="420" class="s">ВХОДНАЯ</text><text x="865" y="442" class="s">СТОРОНА</text><text x="865" y="464" class="s">проём M</text>
<rect x="434.5" y="245" width="270" height="54" fill="#c8dec9" stroke="#6c8d73"/><text x="569" y="277" class="s b" text-anchor="middle">СПОРТ · 1500 × 300 P</text>
<rect x="160" y="245" width="90" height="397.8" fill="#eee8d5" stroke="#c3ad88"/><text x="205" y="429" class="s b" text-anchor="middle">СТОЛ</text><text x="205" y="450" class="s" text-anchor="middle">500 P</text>
<rect x="160" y="642.8" width="234" height="108" fill="#ead6b5" stroke="#ae906a"/><text x="277" y="689" class="s b" text-anchor="middle">ШКАФ У ОКНА</text><text x="277" y="711" class="s" text-anchor="middle">1300 × 600 P</text>
<rect x="470.5" y="561.8" width="378" height="189" fill="#dcebdd" stroke="#76947b" stroke-width="2"/><text x="659" y="636" class="t b" text-anchor="middle">КРОВАТЬ</text><text x="659" y="660" class="s" text-anchor="middle">2100 × 1050 P</text><text x="659" y="681" class="s" text-anchor="middle">ящики под нижним ярусом</text>
<rect x="470.5" y="480.8" width="234" height="81" fill="#fff0cf" stroke="#bd965a" stroke-width="2" stroke-dasharray="6 4"/><text x="587" y="511" class="s b" text-anchor="middle">СТУПЕНИ · УСЛОВНО</text><text x="587" y="533" class="s" text-anchor="middle">это не габарит лестницы</text><text x="587" y="554" class="s" text-anchor="middle">длина и выступ M</text>
<line x1="160" y1="785" x2="394" y2="785" class="dim"/><text x="277" y="779" class="s" text-anchor="middle">1300 P</text><line x1="394" y1="785" x2="470.5" y2="785" class="dim"/><text x="432" y="779" class="s" text-anchor="middle">425 P</text><line x1="470.5" y1="785" x2="848.5" y2="785" class="dim"/><text x="659" y="779" class="s" text-anchor="middle">2100 P</text>
<line x1="160" y1="833" x2="848.5" y2="833" class="dim"/><text x="504" y="825" class="t b" text-anchor="middle">3825 R · для расчёта принята меньшая стена</text>
<line x1="957" y1="245" x2="957" y2="750.8" class="dim"/><text x="976" y="498" class="s" transform="rotate(90 976 498)" text-anchor="middle">2810 B · ширина комнаты по плану</text>
<text x="65" y="878" class="s">Границы двери, окна, ящиков и створок не заданы. Зона колец и проход не проверены.</text><text x="65" y="901" class="s">425 P — остаток между прямоугольниками шкафа и кровати, а не проверенный доступ.</text><text x="65" y="935" class="s">Положение ступеней у левого края кровати является гипотезой для проверки.</text><text x="65" y="958" class="s">Их габариты, подъём, выход и открывание ящиков определяет изготовитель.</text>
<rect x="1110" y="95" width="555" height="930" rx="12" class="card"/><text x="1138" y="132" class="h">2. Какие размеры известны</text><text x="1138" y="170" class="t b">Из ведомости обмеров</text><text x="1138" y="200" class="t">Продольные стены: 3825 и 3837 R.</text><text x="1138" y="226" class="t">Какая из них со стороны кровати — M.</text><text x="1138" y="252" class="t">Высота: минимум 2712 R по точкам.</text><text x="1138" y="292" class="t b">По плану, перепроверить</text><text x="1138" y="322" class="t">Ширина комнаты 2810 B.</text>
<text x="1138" y="364" class="t b">Гипотеза мебели, не замер</text><text x="1138" y="394" class="t">Кровать до 2100 × 1050 P.</text><text x="1138" y="420" class="t">Размер лестницы ещё не выбран;</text><text x="1138" y="446" class="t">общий габарит кровати со ступенями</text><text x="1138" y="472" class="t">неизвестен и требует расчёта.</text>
<rect x="1135" y="500" width="503" height="160" rx="8" class="alert"/><text x="1150" y="530" class="t b">Исполнимость не подтверждена</text><text x="1150" y="558" class="s">Эти размеры не доказывают, что лестница</text><text x="1150" y="580" class="s">поместится, будет удобна и даст доступ</text><text x="1150" y="602" class="s">к кровати, шкафу и его ящикам.</text><text x="1150" y="634" class="s">Паспортную зону колец проверить отдельно.</text>
<text x="1138" y="702" class="t b">Что нужно до изготовления</text><text x="1138" y="730" class="s">• Привязать дверь, окно и обе стены по обмеру.</text><text x="1138" y="753" class="s">• Подобрать готовую модель или проект кровати.</text><text x="1138" y="776" class="s">• Проверить ступени, борта, матрас, ящики и фасады.</text><text x="1138" y="799" class="s">• Определить зону колец и место детского столика.</text><text x="1138" y="835" class="s">Для маленького ребёнка доступ на верхний ярус</text><text x="1138" y="858" class="s">исключить по инструкции выбранной кровати.</text>
<line x1="1138" y1="884" x2="1637" y2="884" stroke="#d1ddd4"/><text x="1138" y="913" class="s">R — измерено; B — план, проверить;</text><text x="1138" y="935" class="s">P — предположение; M — данных нет.</text><text x="1138" y="968" class="s">Источники: ведомость обмеров и схема детской 48.</text>
</svg>
