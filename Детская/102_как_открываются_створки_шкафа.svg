<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="585" viewBox="0 0 1380 585">
  <defs>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#263c33}
      .title{font-size:30px;font-weight:700}.head{font-size:21px;font-weight:700}
      .body{font-size:16px}.small{font-size:14px}.bold{font-weight:700}
      .arrow{stroke:#517b8e;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <g id="case">
      <rect x="-9" y="-6" width="298" height="216" rx="3" fill="#b89f7c"/>
      <rect width="280" height="201" fill="#d2b88b"/>
      <path d="M0 64h280 M0 128h280 M140 0v201" stroke="#ad8e64" stroke-width="4"/>
      <path d="M3 65h275 M3 129h275" stroke="#e3cda7" stroke-width="2"/>
      <path d="M0 220h280 M0 233h280" stroke="#8fa3a6" stroke-width="2"/>
    </g>
    <g id="leaf-a">
      <rect width="144" height="201" fill="#f4e6d0" stroke="#bda482"/>
      <rect x="125" y="91" width="5" height="25" rx="2" fill="#987a59"/>
    </g>
    <g id="leaf-b">
      <rect width="144" height="201" fill="#e4d9c1" stroke="#b1a184"/>
      <rect x="14" y="91" width="5" height="25" rx="2" fill="#987a59"/>
    </g>
  </defs>
  <rect width="1380" height="585" fill="#f6f4ee"/>
  <text x="34" y="48" class="title">Детская · как открываются створки шкафа</text>
  <text x="35" y="77" class="body">Вид на фасад правого шкафа · слева от него стол · ширина секции по проекту 800 мм</text>

  <rect x="30" y="104" width="426" height="405" rx="13" fill="#fffefa" stroke="#cbd7cd"/>
  <text x="54" y="143" class="head">Шкаф закрыт</text>
  <g transform="translate(103 194)">
    <use href="#case"/>
    <use href="#leaf-b" x="136"/>
    <use href="#leaf-a"/>
    <path d="M0 220h144" stroke="#b39672" stroke-width="6" stroke-linecap="round"/>
    <path d="M136 233h144" stroke="#8d7d64" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="243" y="465" text-anchor="middle" class="small">У каждой створки своя направляющая.</text>

  <rect x="477" y="104" width="426" height="405" rx="13" fill="#fffefa" stroke="#cbd7cd"/>
  <text x="501" y="143" class="head">Открыт отсек у стола</text>
  <g transform="translate(550 194)">
    <use href="#case"/>
    <use href="#leaf-b" x="136"/>
    <use href="#leaf-a" x="136"/>
    <path d="M54 -21h138l-9-7m9 7l-9 7" class="arrow"/>
    <path d="M136 220h144" stroke="#b39672" stroke-width="6" stroke-linecap="round"/>
    <path d="M136 233h144" stroke="#8d7d64" stroke-width="6" stroke-linecap="round"/>
    <text x="67" y="101" text-anchor="middle" class="small bold">ДОСТУП</text>
  </g>
  <text x="690" y="465" text-anchor="middle" class="small">Ближнюю к столу створку сдвигаем вправо.</text>

  <rect x="924" y="104" width="426" height="405" rx="13" fill="#fffefa" stroke="#cbd7cd"/>
  <text x="948" y="143" class="head">Открыт дальний отсек</text>
  <g transform="translate(997 194)">
    <use href="#case"/>
    <use href="#leaf-b"/>
    <use href="#leaf-a"/>
    <path d="M226 -21H88l9-7m-9 7l9 7" class="arrow"/>
    <path d="M0 220h144" stroke="#b39672" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 233h144" stroke="#8d7d64" stroke-width="6" stroke-linecap="round"/>
    <text x="214" y="101" text-anchor="middle" class="small bold">ДОСТУП</text>
  </g>
  <text x="1137" y="465" text-anchor="middle" class="small">Дальняя створка уходит влево за ближнюю.</text>

  <text x="34" y="544" class="body">Доступ открывается примерно к половине секции. Чистый проём зависит от направляющих и нахлёста.</text>
  <text x="34" y="568" class="small">У будущего левого шкафа направления зеркальные.</text>
</svg>
