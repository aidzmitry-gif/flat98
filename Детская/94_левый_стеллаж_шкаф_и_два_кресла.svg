  <text x="786" y="321" class="small" text-anchor="middle" transform="rotate(-90 786 321)">стена с окном</text>

  <rect x="714" y="500" width="705" height="321" rx="14" class="card"/>
  <text x="738" y="539" class="head">Сколько места остаётся</text>
  <text x="738" y="579" class="body bold">Два места · 2810 − 300 − 600 = 1910</text>
  <text x="738" y="607" class="body">По 955 ширины на место. Кресла на плане условно 600 × 600.</text>
  <text x="738" y="635" class="body">800 от кромки стола до границы зоны кресел · проектный отступ.</text>
  <text x="738" y="679" class="body bold">Будущий шкаф · 3825 − 500 − 800 − 910 = 1615</text>
  <text x="738" y="707" class="body">Предлагаемый шкаф 1000 × 300. До дуги двери по стене 615.</text>
  <text x="738" y="745" class="small">Столешница опирается на нижний корпус. Скрытый крепёж изнутри.</text>
  <text x="738" y="772" class="small">Размеры мебели, фактическое открывание двери и кресла проверить по месту.</text>
  <text x="738" y="795" class="small">Зазор 735 у мата относится к габаритам, зону занятий проверяют отдельно.</text>
