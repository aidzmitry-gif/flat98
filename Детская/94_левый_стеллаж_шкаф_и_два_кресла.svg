  <text x="990" y="321" class="tiny bold" text-anchor="middle">ЕДИНАЯ СТОЛЕШНИЦА</text>
  <text x="990" y="372" class="body bold" text-anchor="middle">Нижняя секция хранения</text>
  <path d="M806 215h382.5 M806 209v12 M1188.5 209v12 M806 433h425 M806 427v12 M1231 427v12" class="dim"/>
  <text x="997" y="208" class="small bold" text-anchor="middle">450 · корпус</text>
