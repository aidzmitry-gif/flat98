<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs><style>.title{font:700 29px 'Segoe UI',sans-serif;fill:#193a31}.h{font:700 20px 'Segoe UI',sans-serif;fill:#193a31}.t{font:15px 'Segoe UI',sans-serif;fill:#304a42}.s{font:13px 'Segoe UI',sans-serif;fill:#455e54}.bold{font-weight:700}.box{fill:#fffefa;stroke:#ccd9d2;stroke-width:1.5}.dim{stroke:#477d91;stroke-width:1.7;marker-start:url(#arr);marker-end:url(#arr)}.wall{stroke:#29433b;stroke-width:6}.door{fill:#dfa96e;fill-opacity:.25;stroke:#a4673c;stroke-width:2}</style><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 1L1 4L8 7" fill="none" stroke="#477d91" stroke-width="1.4"/></marker></defs>
<rect width="1600" height="1050" fill="#f6f4ee"/><text x="45" y="47" class="title">Детская · левая стена напротив кровати</text><text x="45" y="75" class="t">Дверь слева · спорткомплекс с кольцами · шкаф и окно справа</text><rect x="1270" y="24" width="280" height="50" rx="8" fill="#fff0e4" stroke="#c58b68"/><text x="1410" y="55" text-anchor="middle" class="t bold">ЭСКИЗ · НЕ ДЛЯ ЗАКАЗА</text>
<rect x="40" y="104" width="1520" height="395" rx="12" class="box"/><text x="65" y="139" class="h">1. Вид на стену со стороны кровати</text><text x="65" y="163" class="s">Длины в масштабе расчётной стены 3825 мм; высота мебели и расположение двери условны.</text>
<!-- 3825 × 0.30 -->
<line x1="205" y1="390" x2="1352.5" y2="390" class="wall"/><text x="65" y="289" class="t bold">ДВЕРЬ</text><text x="65" y="313" class="s">положение M</text><text x="1374" y="301" class="t bold">ОКНО →</text>
<!-- X start 800, sport 1500, gap225, cabinet1300 -->
<rect x="445" y="220" width="450" height="170" rx="6" fill="#e0ebdc" stroke="#6a886d" stroke-width="2"/><line x1="475" y1="244" x2="865" y2="244" stroke="#708d72" stroke-width="7" stroke-linecap="round"/><line x1="550" y1="244" x2="550" y2="305" stroke="#708d72" stroke-width="2"/><line x1="635" y1="244" x2="635" y2="305" stroke="#708d72" stroke-width="2"/><circle cx="550" cy="320" r="15" fill="none" stroke="#708d72" stroke-width="4"/><circle cx="635" cy="320" r="15" fill="none" stroke="#708d72" stroke-width="4"/><text x="670" y="357" text-anchor="middle" class="t bold">S1 · спорт + кольца</text><text x="670" y="378" text-anchor="middle" class="s">1500 P вдоль стены</text>
<rect x="962.5" y="204" width="390" height="186" fill="#ead7b1" stroke="#977145" stroke-width="2"/><line x1="1082.5" y1="204" x2="1082.5" y2="390" stroke="#977145"/><rect x="1202.5" y="204" width="150" height="186" fill="#f6e4bf" stroke="#a67c48" stroke-dasharray="5 4"/><text x="1082" y="333" text-anchor="middle" class="s bold">2 ФАСАДА × 400 P</text><text x="1278" y="264" text-anchor="middle" class="s bold">ПОЛКИ</text><text x="1278" y="287" text-anchor="middle" class="s">к столу</text><text x="1278" y="309" text-anchor="middle" class="s">500 P</text>
<line x1="205" y1="430" x2="445" y2="430" class="dim"/><line x1="445" y1="430" x2="895" y2="430" class="dim"/><line x1="895" y1="430" x2="962.5" y2="430" class="dim"/><line x1="962.5" y1="430" x2="1352.5" y2="430" class="dim"/><text x="325" y="420" text-anchor="middle" class="s bold">800 P</text><text x="670" y="420" text-anchor="middle" class="s bold">1500 P · спорт</text><text x="929" y="420" text-anchor="middle" class="s bold">225 P</text><text x="1157" y="420" text-anchor="middle" class="s bold">1300 P · шкаф</text>
<line x1="205" y1="465" x2="1352.5" y2="465" class="dim"/><text x="779" y="487" text-anchor="middle" class="t bold">3825 R · меньшая из двух измеренных длинных стен</text>
<rect x="40" y="518" width="940" height="430" rx="12" class="box"/><text x="65" y="552" class="h">2. План сверху · дуги открывания шкафа</text><text x="65" y="576" class="s">Справа — окно и стол; у окна секция открытых полок выше столешницы.</text>
<line x1="130" y1="869" x2="818" y2="869" class="wall"/><rect x="130" y="812" width="285" height="57" fill="#e0ebdc" stroke="#6a886d" stroke-width="2"/><text x="272" y="845" text-anchor="middle" class="s bold">спорткомплекс · глубина 300 P</text><rect x="130" y="736" width="285" height="133" fill="none" stroke="#6a886d" stroke-width="2" stroke-dasharray="7 5"/><text x="273" y="760" text-anchor="middle" class="s">условный мат · до 700 P</text>
<rect x="547.5" y="689" width="390" height="180" fill="#ead7b1" stroke="#977145" stroke-width="2"/><rect x="787.5" y="689" width="150" height="180" fill="#f6e4bf" stroke="#a67c48" stroke-dasharray="5 4"/><text x="667" y="760" text-anchor="middle" class="s bold">шкаф · 800 P</text><text x="862" y="751" text-anchor="middle" class="s bold">полки</text><text x="862" y="773" text-anchor="middle" class="s">500 P</text>
<path d="M547.5 689 L667.5 689 A120 120 0 0 0 547.5 569 Z" class="door"/><path d="M787.5 689 L667.5 689 A120 120 0 0 1 787.5 569 Z" class="door"/><line x1="547.5" y1="689" x2="547.5" y2="569" stroke="#a4673c" stroke-width="3"/><line x1="787.5" y1="689" x2="787.5" y2="569" stroke="#a4673c" stroke-width="3"/><rect x="787.5" y="608" width="150" height="81" fill="#eee6d8" stroke="#a18f73" stroke-dasharray="5 4"/><text x="862" y="644" text-anchor="middle" class="s">стол / окно</text><text x="862" y="666" text-anchor="middle" class="s">примыкание</text><text x="65" y="924" class="s">Дуги условны: открытые фасады могут входить в зону занятий; их нужно закрывать перед использованием колец.</text>
<rect x="1000" y="518" width="560" height="430" rx="12" class="box"/><text x="1025" y="554" class="h">Статус размеров и проверки</text><text x="1025" y="592" class="t bold">800 + 1500 + 225 + 1300 = 3825 мм.</text><text x="1025" y="617" class="s">Это предварительная расстановка, а не замер мебели.</text><text x="1025" y="654" class="s">• Стены 3825 и 3837 мм измерены отдельно;</text><text x="1025" y="678" class="s">  какая именно здесь — необходимо уточнить.</text><text x="1025" y="710" class="s">• Ширина 2810 мм и окно 1600 мм — из плана B01,</text><text x="1025" y="734" class="s">  требуется контрольный обмер.</text><text x="1025" y="766" class="s">• 800 мм от угла — не расстояние от дверного проёма.</text><text x="1025" y="790" class="s">  Положение, ширина и открывание двери не измерены.</text><text x="1025" y="822" class="s">• Дверцы 400 мм, полки 500 мм, петли и зазоры — P.</text><text x="1025" y="854" class="s">• Размер мата и крепление определяют по паспорту</text><text x="1025" y="878" class="s">  спорткомплекса и проверенному основанию стены.</text><text x="1025" y="918" class="s">R — измерено · P — проектное предположение.</text>
<text x="48" y="987" class="s">Источники: docs/04_Цифровая_ведомость_обмеров_v1.md; docs/20_Чистые_размеры_детской_APT-001_revision_10.md.</text>
</svg>
