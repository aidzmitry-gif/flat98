<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
<defs><style>.title{font:700 29px 'Segoe UI',sans-serif;fill:#183931}.h{font:700 20px 'Segoe UI',sans-serif;fill:#183931}.t{font:15px 'Segoe UI',sans-serif;fill:#29483f}.s{font:13px 'Segoe UI',sans-serif;fill:#405b52}.bold{font-weight:700}.box{fill:#fffefa;stroke:#cad6cf;stroke-width:1.5}.dim{stroke:#447d90;stroke-width:1.7;marker-start:url(#a);marker-end:url(#a)}.door{fill:#dca36a;fill-opacity:.24;stroke:#a4683c;stroke-width:2}</style><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 1L1 4L8 7" fill="none" stroke="#447d90" stroke-width="1.4"/></marker></defs>
<rect width="1600" height="1040" fill="#f6f4ed"/><text x="45" y="48" class="title">Детская · правая стена — зеркальный вид</text><text x="45" y="76" class="t">Глухая боковая стена слева · кровать в углу · шкаф и окно справа</text>
<rect x="1270" y="24" width="280" height="50" rx="9" fill="#fff0e4" stroke="#c58b68"/><text x="1410" y="55" text-anchor="middle" class="t bold">ЭСКИЗ · НЕ ДЛЯ ЗАКАЗА</text>
<rect x="40" y="103" width="1520" height="393" rx="12" class="box"/><text x="65" y="138" class="h">1. Вид на стену со стороны левой стены</text><text x="65" y="162" class="s">Длины показаны пропорционально; высоты мебели — условные.</text>
<line x1="207.5" y1="389" x2="1355" y2="389" stroke="#29443c" stroke-width="6"/><line x1="207.5" y1="189" x2="207.5" y2="389" stroke="#29443c" stroke-width="6"/><text x="70" y="283" class="s">глухая</text><text x="70" y="304" class="s">стена</text><text x="1370" y="303" class="t bold">ОКНО →</text>
<rect x="207.5" y="244" width="630" height="145" rx="5" fill="#e0eadc" stroke="#66846c" stroke-width="2"/><line x1="215" y1="299" x2="830" y2="299" stroke="#66846c" stroke-width="8"/><text x="522" y="275" text-anchor="middle" class="t bold">ДВУХЪЯРУСНАЯ КРОВАТЬ</text><text x="522" y="351" text-anchor="middle" class="s">до 2100 P · торец у глухой стены</text>
<rect x="965" y="203" width="390" height="186" fill="#ead7b1" stroke="#977145" stroke-width="2"/><line x1="1085" y1="203" x2="1085" y2="389" stroke="#977145"/><rect x="1205" y="203" width="150" height="186" fill="#f6e4bf" stroke="#a67c48" stroke-dasharray="5 4"/><text x="1085" y="336" text-anchor="middle" class="s bold">ДВЕРЦЫ · 2 × 400 P</text><text x="1280" y="263" text-anchor="middle" class="s bold">ПОЛКИ</text><text x="1280" y="287" text-anchor="middle" class="s">к столу</text><text x="1280" y="309" text-anchor="middle" class="s">500 P</text>
<line x1="207.5" y1="429" x2="837.5" y2="429" class="dim"/><line x1="837.5" y1="429" x2="965" y2="429" class="dim"/><line x1="965" y1="429" x2="1355" y2="429" class="dim"/><text x="522" y="420" text-anchor="middle" class="s bold">2100 P · кровать</text><text x="901" y="420" text-anchor="middle" class="s bold">425 P</text><text x="1160" y="420" text-anchor="middle" class="s bold">1300 P · шкаф</text>
<line x1="207.5" y1="463" x2="1355" y2="463" class="dim"/><text x="781" y="485" text-anchor="middle" class="t bold">3825 R · меньшая из двух измеренных длинных стен</text>
<rect x="40" y="515" width="940" height="435" rx="12" class="box"/><text x="65" y="550" class="h">2. План сверху · открывание шкафа</text><text x="65" y="574" class="s">Два условных фасада по 400 мм, полки у окна; углы открывания показаны на 90°.</text>
<line x1="170" y1="868" x2="820" y2="868" stroke="#29443c" stroke-width="6"/><rect x="170" y="712" width="250" height="156" fill="#e0eadc" stroke="#66846c" stroke-width="2"/><text x="295" y="783" text-anchor="middle" class="s bold">← кровать продолжается</text>
<rect x="547.5" y="688" width="390" height="180" fill="#ead7b1" stroke="#977145" stroke-width="2"/><rect x="787.5" y="688" width="150" height="180" fill="#f6e4bf" stroke="#a67c48" stroke-dasharray="5 4"/><text x="667" y="760" text-anchor="middle" class="s bold">шкаф · 800 P</text><text x="862" y="751" text-anchor="middle" class="s bold">полки</text><text x="862" y="773" text-anchor="middle" class="s">500 P</text>
<path d="M547.5 688 L667.5 688 A120 120 0 0 0 547.5 568 Z" class="door"/><path d="M787.5 688 L667.5 688 A120 120 0 0 1 787.5 568 Z" class="door"/><line x1="547.5" y1="688" x2="547.5" y2="568" stroke="#a4683c" stroke-width="3"/><line x1="787.5" y1="688" x2="787.5" y2="568" stroke="#a4683c" stroke-width="3"/>
<rect x="787.5" y="607" width="150" height="81" fill="#eee6d8" stroke="#a18f73" stroke-dasharray="5 4"/><text x="862" y="643" text-anchor="middle" class="s">стол / окно</text><text x="862" y="665" text-anchor="middle" class="s">примыкание</text><line x1="420" y1="904" x2="547.5" y2="904" class="dim"/><text x="484" y="895" text-anchor="middle" class="s bold">425 P</text><text x="65" y="930" class="s">Фасады, полки и петли — предварительное предложение; необходимы монтажные зазоры.</text>
<rect x="1000" y="515" width="560" height="435" rx="12" class="box"/><text x="1025" y="551" class="h">Что означают размеры</text><text x="1025" y="590" class="t bold">425 мм — остаток по стене,</text><text x="1025" y="614" class="t bold">не подтверждённый проход к шкафу.</text><text x="1025" y="653" class="s">• 3825 и 3837 мм — разные измеренные стены;</text><text x="1025" y="677" class="s">  какая именно справа — проверить по обмеру.</text><text x="1025" y="711" class="s">• Ширина 2810 мм и окно 1600 мм — по плану B01,</text><text x="1025" y="735" class="s">  нужны контрольные измерения.</text><text x="1025" y="769" class="s">• Проверить открывание дверей и ящиков, петли,</text><text x="1025" y="793" class="s">  положение лестницы, доступ к столу и радиатору.</text><text x="1025" y="829" class="s">• Положение двери комнаты на этом виде не задано.</text><text x="1025" y="865" class="s">R — обмер; P — проектное предположение.</text><text x="1025" y="901" class="s">Верхний ярус — только по возрасту и паспорту.</text>
<text x="48" y="990" class="s">Источник обмеров: docs/04_Цифровая_ведомость_обмеров_v1.md; размеры мебели предварительные.</text>
</svg>
