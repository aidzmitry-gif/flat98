<line x1="835.66" y1="373.8" x2="916" y2="373.8" class="guide"/><line x1="835.66" y1="526.8" x2="916" y2="526.8" class="guide"/>
<line x1="912" y1="373.8" x2="912" y2="526.8" class="dim"/><text x="930" y="450" text-anchor="middle" transform="rotate(90 930 450)" class="s b">850 до линии входа</text>
<line x1="145" y1="749" x2="379" y2="749" class="dim"/><text x="262" y="742" text-anchor="middle" class="s">1300</text>
<line x1="379" y1="749" x2="457.66" y2="749" class="dim"/><text x="418" y="742" text-anchor="middle" class="s">437</text>
<line x1="457.66" y1="749" x2="835.66" y2="749" class="dim"/><text x="646" y="742" text-anchor="middle" class="s">2100</text>
<line x1="145" y1="792" x2="835.66" y2="792" class="dim"/><text x="490" y="783" text-anchor="middle" class="t b">3837 · СТЕНА С КРОВАТЬЮ ПО ОБМЕРУ</text>
<text x="55" y="828" class="s">2810 — ширина по БТИ. Контуры спорткомплекса и мата перенесены из схемы 48.</text>

<rect x="1000" y="100" width="510" height="758" rx="12" class="card"/>
<text x="1025" y="137" class="h">Проверка двух торцов</text>
<text x="1025" y="178" class="t b">Лестница у правой стены</text>
<text x="1025" y="208" class="t">2810 − 910 − 1050 = 850.</text>
<text x="1025" y="234" class="s">От края кровати до линии проёма P2 по БТИ.</text>
<text x="1025" y="259" class="s">Сверить вылет лестницы с ящиками и входом.</text>
<rect x="1020" y="294" width="470" height="195" rx="9" class="warn"/>
<text x="1037" y="325" class="t b">Горка слева выходит к спортзоне</text>
<text x="1037" y="355" class="s">При вылете 1334 и мате глубиной 700</text>
<text x="1037" y="379" class="s">наложение по глубине составляет около 274 мм.</text>
<text x="1037" y="403" class="s">До условной рамы остаётся около 126 мм.</text>
<text x="1037" y="431" class="s">Размер зоны съезда и зона колец пока не заданы.</text>
<text x="1037" y="455" class="s">Габариты примера горки взяты по Maxtrix.</text>
<text x="1025" y="540" class="t b">Хранение под горкой</text>
<text x="1025" y="570" class="s">Фасады со стороны нижнего яруса.</text>
<text x="1025" y="595" class="s">Проверить открывание и доступ к шкафу.</text>
<line x1="1025" y1="642" x2="1485" y2="642" stroke="#d1ddd4"/>
<text x="1025" y="673" class="s">Основание: S10, БТИ B01, схемы детской 48 и 70.</text>
</svg>
