<rect x="145" y="607.8" width="234" height="108" fill="#ead6b5" stroke="#ae906a"/><text x="262" y="654" text-anchor="middle" class="s b">ШКАФ У ОКНА</text><text x="262" y="676" text-anchor="middle" class="s">1300 × 600, проект</text>
