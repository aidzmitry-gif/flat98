<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="890" viewBox="0 0 1540 890">
<defs>
  <style>.title{font:700 30px 'Segoe UI',sans-serif;fill:#183e33}.h{font:700 20px 'Segoe UI',sans-serif;fill:#183e33}.t{font:16px 'Segoe UI',sans-serif;fill:#29483e}.s{font:14px 'Segoe UI',sans-serif;fill:#435d53}.b{font-weight:700}.card{fill:#fffefa;stroke:#cad9d1;stroke-width:1.5}.wall{stroke:#23443a;stroke-width:4;fill:none}.dim{stroke:#427b8e;stroke-width:1.5;marker-start:url(#arr);marker-end:url(#arr)}.guide{stroke:#81998e;stroke-width:1.2;stroke-dasharray:5 5}.warn{fill:#fce8db;stroke:#bf8066;stroke-width:1.5}</style>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 1L1 4L8 7" fill="none" stroke="#427b8e" stroke-width="1.2"/></marker>
  <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="#bc664e" stroke-width="2.5"/></pattern>
</defs>
<rect width="1540" height="890" fill="#f6f5ef"/>
<text x="35" y="47" class="title">Детская · лестница у правой стены</text>
<text x="35" y="76" class="t">Вид сверху · обмер S10 и план БТИ B01 · мм</text>
<rect x="1275" y="23" width="230" height="48" rx="9" class="warn"/><text x="1390" y="53" class="t b" text-anchor="middle">ЭСКИЗ РАССТАНОВКИ</text>

<rect x="30" y="100" width="950" height="758" rx="12" class="card"/>
