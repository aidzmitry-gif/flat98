<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <style>
    text { font-family: Arial, sans-serif; fill: #24332b; }
    .title { font-size: 30px; font-weight: 700; }
    .sub { font-size: 16px; fill: #52645a; }
    .head { font-size: 20px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 700; }
    .small { font-size: 13px; fill: #52645a; }
    .note { font-size: 13px; fill: #80582e; }
    .dim { font-size: 14px; fill: #2e6b80; font-weight: 700; }
    .room { fill: #fbfcfa; stroke: #2b3b32; stroke-width: 4; }
    .wall { stroke: #2b3b32; stroke-width: 10; }
    .window { stroke: #5294bd; stroke-width: 11; }
    .radiator { fill: #e8d5bf; stroke: #9b6945; stroke-width: 2; }
    .bed { fill: #c7d8c4; stroke: #587a57; stroke-width: 2; }
    .wardrobe { fill: #dfc79f; stroke: #957344; stroke-width: 2; }
    .storage { fill: #e8eee6; stroke: #78927a; stroke-width: 2; }
    .play { fill: #f3ede0; stroke: #c9ae79; stroke-width: 2; stroke-dasharray: 8 7; }
    .future { fill: #e5eef3; stroke: #51809b; stroke-width: 3; stroke-dasharray: 10 8; }
    .arrow { stroke: #2e6b80; stroke-width: 2; fill: none; marker-start: url(#a); marker-end: url(#a); }
    .ext { stroke: #2e6b80; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="none" stroke="#2e6b80" stroke-width="1.5"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#f7f6f1"/>
  <text x="55" y="55" class="title">Детская 3 850 × 2 810 мм — рекомендуемая модульная схема</text>
  <text x="55" y="84" class="sub">Основа: B01; окно O2 1 600 мм и радиатор под ним; проход из коридора 910 мм. Концепция, не заказной чертёж.</text>

  <text x="70" y="140" class="head">Сейчас: сон, игра, компактное хранение</text>
  <text x="850" y="140" class="head">Позже: два отдельных спальных места</text>

  <!-- Left plan: current phase. Scale 0.18 px/mm, inner shell 693 x 506. -->
  <g transform="translate(70 180)">
    <rect x="0" y="0" width="693" height="506" class="room"/>
    <!-- Opening to corridor: upper 910 mm of left short wall; swing intentionally not assumed. -->
    <line x1="0" y1="0" x2="0" y2="164" stroke="#f7f6f1" stroke-width="16"/>
    <line x1="0" y1="164" x2="0" y2="506" class="wall"/>
    <text x="-16" y="89" class="dim" transform="rotate(-90 -16 89)">проход 910</text>
    <text x="-45" y="188" class="small" transform="rotate(-90 -45 188)">створка/открывание н/д</text>

    <!-- Window and radiator on the opposite short wall, centred: 600 + 1600 + 610. -->
    <line x1="693" y1="108" x2="693" y2="396" class="window"/>
    <rect x="641" y="184" width="38" height="137" rx="3" class="radiator"/>
    <text x="624" y="253" class="label" transform="rotate(-90 624 253)">O2 1 600</text>
    <text x="659" y="253" class="small" transform="rotate(-90 659 253)">радиатор — не закрывать</text>

    <!-- A grown-up single bed with toddler guard. -->
    <rect x="120" y="344" width="360" height="162" rx="12" class="bed"/>
    <text x="300" y="420" text-anchor="middle" class="label">кровать 90 × 200</text>
    <text x="300" y="442" text-anchor="middle" class="small">съёмный бортик сейчас</text>

    <!-- Compact tall storage goes on the solid part of the entry end, after verification. -->
    <rect x="0" y="216" width="108" height="234" rx="8" class="wardrobe"/>
    <text x="54" y="323" text-anchor="middle" class="label" transform="rotate(-90 54 323)">шкаф 600 × 1 300</text>
    <text x="54" y="341" text-anchor="middle" class="small" transform="rotate(-90 54 341)">точно после обмера</text>

    <!-- Low, movable toy storage. -->
    <rect x="190" y="0" width="270" height="54" rx="6" class="storage"/>
    <text x="325" y="33" text-anchor="middle" class="label">низкое хранение 300 × 1 500</text>

    <!-- Free play centre. -->
    <rect x="174" y="116" width="330" height="190" rx="70" class="play"/>
    <text x="339" y="199" text-anchor="middle" class="label">свободный центр</text>
    <text x="339" y="220" text-anchor="middle" class="small">игра / ковёр / мобильный пуф</text>

    <!-- Dimensions. -->
    <line x1="0" y1="545" x2="693" y2="545" class="arrow"/>
    <line x1="0" y1="506" x2="0" y2="557" class="ext"/><line x1="693" y1="506" x2="693" y2="557" class="ext"/>
    <text x="346" y="535" text-anchor="middle" class="dim">3 850 мм</text>
    <line x1="-40" y1="0" x2="-40" y2="506" class="arrow"/>
    <line x1="-50" y1="0" x2="-1" y2="0" class="ext"/><line x1="-50" y1="506" x2="-1" y2="506" class="ext"/>
    <text x="-55" y="253" text-anchor="middle" class="dim" transform="rotate(-90 -55 253)">2 810 мм</text>
  </g>

  <!-- Right plan: future phase. The two beds keep a 1,010-mm middle strip. -->
  <g transform="translate(850 180)">
    <rect x="0" y="0" width="693" height="506" class="room"/>
    <line x1="0" y1="0" x2="0" y2="164" stroke="#f7f6f1" stroke-width="16"/>
    <line x1="0" y1="164" x2="0" y2="506" class="wall"/>
    <text x="-16" y="89" class="dim" transform="rotate(-90 -16 89)">проход 910</text>

    <line x1="693" y1="108" x2="693" y2="396" class="window"/>
    <rect x="641" y="184" width="38" height="137" rx="3" class="radiator"/>
    <text x="659" y="253" class="small" transform="rotate(-90 659 253)">O2 + радиатор</text>

    <rect x="120" y="344" width="360" height="162" rx="12" class="bed"/>
    <text x="300" y="420" text-anchor="middle" class="label">кровать 1 · 90 × 200</text>

    <rect x="180" y="0" width="342" height="162" rx="12" class="future"/>
    <text x="351" y="74" text-anchor="middle" class="label">кровать 2 · 80/90 × 190/200</text>
    <text x="351" y="98" text-anchor="middle" class="small">заменяет низкое хранение</text>

    <rect x="0" y="216" width="108" height="234" rx="8" class="wardrobe"/>
    <text x="54" y="323" text-anchor="middle" class="label" transform="rotate(-90 54 323)">шкаф</text>
    <text x="54" y="340" text-anchor="middle" class="small" transform="rotate(-90 54 340)">600 глубина</text>

    <rect x="145" y="174" width="430" height="150" rx="50" class="play"/>
    <text x="360" y="243" text-anchor="middle" class="label">центральный проход ≈ 1 010 мм</text>
    <text x="360" y="265" text-anchor="middle" class="small">без стационарного стола до школьного сценария</text>

    <line x1="0" y1="545" x2="693" y2="545" class="arrow"/>
    <line x1="0" y1="506" x2="0" y2="557" class="ext"/><line x1="693" y1="506" x2="693" y2="557" class="ext"/>
    <text x="346" y="535" text-anchor="middle" class="dim">3 850 мм</text>
  </g>

  <rect x="55" y="760" width="1490" height="98" rx="12" fill="#fffdf8" stroke="#d7d1c4" stroke-width="2"/>
  <text x="80" y="792" class="label">Что взять из референсов:</text>
  <text x="300" y="792" class="small">палитру #4/#7 (светлое дерево, тёплый белый, приглушённый шалфей), один мягкий акцент на стене и мобильный текстиль.</text>
  <text x="80" y="820" class="label">Что не переносить:</text>
  <text x="300" y="820" class="small">стол под окном/над радиатором, шкафы по всей стене и взрослую широкую кровать из #1/#5 — они съедят проход и гибкость.</text>
  <text x="80" y="847" class="note">До заказа: снять оси и габарит радиатора, подоконник, чистовую толщину пола и фактическое открывание/привязку прохода. Высокую мебель закрепить к стене.</text>
</svg>
