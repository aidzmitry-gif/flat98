<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1100" viewBox="0 0 1700 1100">
<defs>
  <style>
    .title{font:700 29px 'Segoe UI',Arial,sans-serif;fill:#193a32}
    .subtitle{font:15px 'Segoe UI',Arial,sans-serif;fill:#4d655f}
    .h{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#193a32}
    .b{font:15px 'Segoe UI',Arial,sans-serif;fill:#29483e}
    .s{font:13px 'Segoe UI',Arial,sans-serif;fill:#435d54}
    .small{font:12px 'Segoe UI',Arial,sans-serif;fill:#4e655d}
    .bold{font-weight:700}
    .card{fill:#fffefa;stroke:#ccd7d0;stroke-width:1.5}
    .wall{stroke:#29423a;stroke-width:5;fill:none}
    .dim{stroke:#437d91;stroke-width:1.6;fill:none;marker-start:url(#a);marker-end:url(#a)}
    .guide{stroke:#98aaa3;stroke-width:1.2;stroke-dasharray:5 5;fill:none}
    .alert{fill:#fff1e6;stroke:#c3845d;stroke-width:1.4}
    .safe{fill:#eaf2e9;stroke:#77917c;stroke-width:1.4}
  </style>
  <marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 1L1 4L8 7" fill="none" stroke="#437d91" stroke-width="1.4"/></marker>
  <pattern id="rad" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="8" stroke="#c67c5f" stroke-width="3"/></pattern>
</defs>
<rect width="1700" height="1100" fill="#f6f4ee"/>
<text x="45" y="47" class="title">Детская · проверка: стол до стены и кольца</text>
<text x="45" y="75" class="subtitle">План сверху по обмерам и прежним проектным контурам · окно и стол справа на плане</text>
<rect x="1430" y="25" width="225" height="46" rx="8" class="alert"/><text x="1542" y="54" text-anchor="middle" class="b bold">НЕ ДЛЯ ЗАКАЗА</text>

<rect x="40" y="105" width="1050" height="865" rx="13" class="card"/>
<text x="70" y="140" class="h">1. План комнаты — вид сверху</text>
<text x="70" y="163" class="s">X: вход → окно. Y: стена со спортом → стена с кроватью. Все размеры в мм.</text>

<!-- room 3825 × 2810, 0.18 px/mm; rectangular approximation -->
<line x1="145" y1="215" x2="833.5" y2="215" class="wall"/>
<line x1="145" y1="720.8" x2="833.5" y2="720.8" class="wall"/>
<line x1="833.5" y1="215" x2="833.5" y2="720.8" class="wall"/>
<line x1="145" y1="378.8" x2="145" y2="720.8" class="wall"/>
<line x1="145" y1="215" x2="145" y2="378.8" stroke="#52869a" stroke-width="3" stroke-dasharray="7 5"/>
<text x="123" y="297" text-anchor="middle" class="small" transform="rotate(-90 123 297)">910 B — участок, не ширина проёма</text>
<path d="M162 443 H230 M217 432 L230 443 L217 454" stroke="#437d91" stroke-width="3" fill="none"/>
<text x="162" y="427" class="small bold">взгляд от входа</text>

<!-- window O2 Y=610..2210 -->
<line x1="833.5" y1="324.8" x2="833.5" y2="612.8" stroke="#4b9bb5" stroke-width="9"/>
<text x="846" y="473" class="small bold" transform="rotate(90 846 473)">окно O2 · 1600 B</text>

<!-- S1 X800..2300 Y0..300; mat shown to Y700 -->
<rect x="289" y="215" width="270" height="126" rx="5" fill="#e2ede0" fill-opacity=".65" stroke="#719077" stroke-width="1.7" stroke-dasharray="8 5"/>
<rect x="289" y="215" width="270" height="54" rx="5" fill="#cee2cb" stroke="#63846b" stroke-width="2"/>
<line x1="310" y1="229" x2="538" y2="229" stroke="#63846b" stroke-width="6" stroke-linecap="round"/>
<text x="424" y="252" text-anchor="middle" class="b bold">S1 · рама 1500 × 300 P</text>
<text x="424" y="296" text-anchor="middle" class="s">условный мат до 700 P</text>
<text x="424" y="318" text-anchor="middle" class="small">положение колец и вылет — M</text>
<text x="424" y="337" text-anchor="middle" class="small">это не проверенная зона падения</text>

<!-- left shelves: unmeasured, not drawn to scale -->
<rect x="638" y="225" width="97" height="48" rx="5" fill="#fff2db" stroke="#bd9151" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="686" y="244" text-anchor="middle" class="small bold">левые полки</text>
<text x="686" y="262" text-anchor="middle" class="small">габарит M</text>
<text x="689" y="291" text-anchor="middle" class="small">обозначение условное</text>

<!-- full-width desk X3325..3825, Y0..2210 -->
<rect x="743.5" y="215" width="90" height="397.8" fill="#f4e9d2" stroke="#ac864a" stroke-width="2"/>
<text x="775" y="413" text-anchor="middle" class="s bold" transform="rotate(-90 775 413)">M5 · стол до стены · глубина 500 P</text>
<!-- radiator position is not surveyed -->
<rect x="812" y="365" width="21.5" height="160" fill="url(#rad)" fill-opacity=".7" stroke="#b36a50" stroke-dasharray="5 4"/>

<!-- right wardrobe X2525..3825 Y2210..2810 -->
<rect x="599.5" y="612.8" width="234" height="108" rx="5" fill="#e9d8b4" stroke="#987345" stroke-width="1.7"/>
<text x="716.5" y="649" text-anchor="middle" class="b bold">правый шкаф M1</text>
<text x="716.5" y="673" text-anchor="middle" class="s">1300 × 600 P</text>
<text x="716.5" y="696" text-anchor="middle" class="small">дверцы / зазоры — M</text>

<!-- bunk X0..2100, Y1760..2810 -->
<rect x="145" y="531.8" width="378" height="189" rx="7" fill="#dce9d8" stroke="#65836a" stroke-width="2"/>
<text x="334" y="587" text-anchor="middle" class="b bold">M2 · двухъярусная кровать</text>
<text x="334" y="612" text-anchor="middle" class="s">до 2100 × 1050 P</text>
<text x="334" y="636" text-anchor="middle" class="small">лестница / борта / модель — M</text>
<text x="334" y="658" text-anchor="middle" class="small">показан расчётный контур</text>

<!-- longitudinal dimension and 1025 -->
<line x1="559" y1="193" x2="743.5" y2="193" class="dim"/>
<line x1="559" y1="203" x2="559" y2="215" class="guide"/><line x1="743.5" y1="203" x2="743.5" y2="215" class="guide"/>
<text x="651" y="183" text-anchor="middle" class="s bold">1025 P · между контурами</text>
<line x1="145" y1="766" x2="289" y2="766" class="dim"/><line x1="289" y1="766" x2="559" y2="766" class="dim"/><line x1="559" y1="766" x2="743.5" y2="766" class="dim"/><line x1="743.5" y1="766" x2="833.5" y2="766" class="dim"/>
<text x="217" y="756" text-anchor="middle" class="small bold">800 P</text><text x="424" y="756" text-anchor="middle" class="small bold">1500 P · рама</text><text x="651" y="756" text-anchor="middle" class="small bold">1025 P</text><text x="788" y="756" text-anchor="middle" class="small bold">500 P · стол</text>
<line x1="145" y1="800" x2="833.5" y2="800" class="dim"/><text x="489" y="824" text-anchor="middle" class="b bold">3825 R · для расчёта взята меньшая длинная стена</text>
<line x1="902" y1="215" x2="902" y2="720.8" class="dim"/><text x="922" y="468" text-anchor="middle" class="s bold" transform="rotate(-90 922 468)">2810 B · ширина по плану, контрольный замер</text>
<line x1="860" y1="215" x2="860" y2="612.8" class="dim"/><text x="877" y="414" text-anchor="middle" class="small bold" transform="rotate(-90 877 414)">до 2210 B/P · стол</text>
<line x1="860" y1="612.8" x2="860" y2="720.8" class="dim"/><text x="877" y="667" text-anchor="middle" class="small bold" transform="rotate(-90 877 667)">600 P · шкаф</text>
<text x="145" y="852" class="small bold">X=0 · входная сторона</text><text x="833" y="852" text-anchor="end" class="small bold">X=3825 · оконная стена</text>
<rect x="70" y="874" width="990" height="72" rx="8" class="safe"/>
<text x="89" y="899" class="s bold">Что проверено:</text><text x="221" y="899" class="s">в этих условных координатах прямоугольники рамы / мата и столешницы не пересекаются.</text>
<text x="89" y="924" class="s">Левая закрытая часть шкафа убрана. Секция полок у стола оставлена, но её габарит ещё не задан.</text>

<rect x="1110" y="105" width="550" height="865" rx="13" class="card"/>
<text x="1135" y="141" class="h">2. Вывод по кольцам</text>
<rect x="1135" y="161" width="500" height="152" rx="9" class="alert"/>
<text x="1152" y="189" class="b bold">Пока нельзя подтвердить, что стол</text>
<text x="1152" y="213" class="b bold">не мешает занятиям на кольцах.</text>
<text x="1152" y="240" class="s">1025 мм — условный промежуток между</text>
<text x="1152" y="262" class="s">границами прямоугольников вдоль стены,</text>
<text x="1152" y="284" class="s">а не расстояние от колец и не зона падения.</text>
<text x="1135" y="349" class="h">Основа расчёта</text>
<text x="1135" y="376" class="s">• Рама: X=800–2300, Y=0–300 P.</text>
<text x="1135" y="401" class="s">• Мат: тот же X, Y=0–700 P, условный.</text>
<text x="1135" y="426" class="s">• Стол: X=3325–3825, Y=0–2210 P.</text>
<text x="1135" y="451" class="s">• 3325 − 2300 = 1025 мм P вдоль X.</text>
<text x="1135" y="476" class="s">• 2810 B − 600 P = 2210 B/P до шкафа.</text>
<text x="1135" y="510" class="h">Что измерить и выбрать</text>
<text x="1135" y="538" class="s">1. Ширину комнаты в трёх местах, диагонали;</text>
<text x="1154" y="560" class="s">точные границы окна и дверного проёма.</text>
<text x="1135" y="590" class="s">2. Модель комплекса: оси колец, вылет турника,</text>
<text x="1154" y="612" class="s">размер и расположение паспортной зоны падения.</text>
<text x="1135" y="642" class="s">3. Габарит оставляемых полок, столешницы, опор,</text>
<text x="1154" y="664" class="s">стульев и их положения при работе.</text>
<text x="1135" y="694" class="s">4. Полностью обмерить радиатор, трубы, клапан,</text>
<text x="1154" y="716" class="s">подоконник и проверить доступ и вентиляцию.</text>
<text x="1135" y="746" class="s">5. Выбрать кровать и проверить открывание шкафа,</text>
<text x="1154" y="768" class="s">ящиков и положение переносного детского столика.</text>
<rect x="1135" y="800" width="500" height="140" rx="9" fill="#edf3ef" stroke="#9ab0a2" stroke-width="1.2"/>
<text x="1152" y="828" class="s bold">R — измерено · B — план, проверить</text>
<text x="1152" y="851" class="s bold">P — эскизное предложение · M — неизвестно</text>
<text x="1152" y="877" class="s">Измеренные стены: 3825 и 3837 мм отдельно.</text>
<text x="1152" y="900" class="s">Высота: минимум 2712 мм по имеющимся точкам.</text>
<text x="1152" y="923" class="s">Какой стороне соответствует длина — уточнить.</text>
</svg>
