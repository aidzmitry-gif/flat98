<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="810" viewBox="0 0 1500 810">
<defs>
<style>.title{font:700 30px 'Segoe UI',sans-serif;fill:#183e33}.h{font:700 20px 'Segoe UI',sans-serif;fill:#183e33}.t{font:16px 'Segoe UI',sans-serif;fill:#29483e}.s{font:14px 'Segoe UI',sans-serif;fill:#435d53}.b{font-weight:700}.card{fill:#fffefa;stroke:#cad9d1;stroke-width:1.5}.wall{stroke:#23443a;stroke-width:4;fill:none}.dim{stroke:#427b8e;stroke-width:1.5}.warn{fill:#fce8db;stroke:#bf8066;stroke-width:1.5}</style>
<pattern id="overlap" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="#ba6650" stroke-width="2.5"/></pattern>
</defs>
<rect width="1500" height="810" fill="#f6f5ef"/>
<text x="35" y="47" class="title">Детская · нижние концы у противоположной стены</text>
<text x="35" y="76" class="t">Проверка направления · размеры в мм · лестница слева, горка справа</text>
<rect x="30" y="105" width="950" height="670" rx="12" class="card"/>
<text x="55" y="143" class="h">Вид сверху</text><text x="55" y="169" class="s">Цветные полосы показывают направление. Ширина лестницы и горки условна.</text>
<!-- Reference rectangle 3837 × 2810. Window at left, entrance at right; scale .16 px/mm. -->
<rect x="145" y="222" width="613.92" height="449.6" fill="#fffefa"/>
<text x="452" y="211" class="s b" text-anchor="middle">ПРОТИВОПОЛОЖНАЯ СТЕНА СО СПОРТОМ</text>
<rect x="620" y="222" width="138.92" height="145.6" fill="#f9eee5"/>
<rect x="390.92" y="222" width="240" height="112" fill="#e8f2e7" stroke="#7c9d82" stroke-dasharray="6 5"/>
<rect x="390.92" y="222" width="240" height="48" fill="#c8dec9" stroke="#6c8d73"/>
<rect x="145" y="222" width="80" height="353.6" fill="#eee8d5" stroke="#c1ac88"/><text x="185" y="429" class="s b" text-anchor="middle">СТОЛ</text>
<rect x="145" y="575.6" width="208" height="96" fill="#ead6b5" stroke="#ae906a"/><text x="249" y="620" text-anchor="middle" class="s b">ШКАФ У ОКНА</text><text x="249" y="643" text-anchor="middle" class="s">1300 × 600, проект</text>
<rect x="422.92" y="503.6" width="336" height="168" fill="#dcebdd" stroke="#76947b" stroke-width="2"/>
<text x="591" y="587" class="t b" text-anchor="middle">КРОВАТЬ</text><text x="591" y="612" class="s" text-anchor="middle">2100 × 1050, проект</text>
<rect x="422.92" y="222" width="88" height="281.6" fill="#ffebbd" fill-opacity=".78" stroke="#bd965a" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="678.92" y="222" width="80" height="281.6" fill="#e7d9bd" stroke="#ab8a60" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="422.92" y="222" width="88" height="112" fill="url(#overlap)"/>
<rect x="678.92" y="222" width="80" height="145.6" fill="url(#overlap)"/>
<text x="570" y="247" class="s b" text-anchor="middle">РАМА</text><text x="570" y="313" class="s" text-anchor="middle">мат, условно</text>
<path d="M467 355V410 M461 400L467 410L473 400" stroke="#6e5535" stroke-width="2" fill="none"/>
<path d="M719 422V374 M713 384L719 374L725 384" stroke="#6e5535" stroke-width="2" fill="none"/>
<text x="467" y="439" class="s b" text-anchor="middle">ЛЕСТНИЦА</text><text x="719" y="448" class="s b" text-anchor="middle">ГОРКА</text><text x="719" y="470" class="s" text-anchor="middle">хранение</text><text x="719" y="490" class="s" text-anchor="middle">со стороны кровати</text>
<line x1="145" y1="222" x2="758.92" y2="222" class="wall"/><line x1="145" y1="671.6" x2="758.92" y2="671.6" class="wall"/>
<line x1="145" y1="222" x2="145" y2="671.6" class="wall"/><line x1="758.92" y1="367.6" x2="758.92" y2="671.6" class="wall"/>
<line x1="758.92" y1="222" x2="758.92" y2="367.6" stroke="#4e8594" stroke-width="3" stroke-dasharray="6 5"/>
<text x="772" y="290" class="s b">ВХОД P2</text><text x="772" y="312" class="s">910 по БТИ</text>
<text x="65" y="451" class="s b">ОКНО</text><line x1="145" y1="318" x2="145" y2="574" stroke="#4e8594" stroke-width="5"/>
<line x1="759" y1="222" x2="909" y2="222" stroke="#9baea4" stroke-width="1" stroke-dasharray="5 5"/><line x1="759" y1="503.6" x2="909" y2="503.6" stroke="#9baea4" stroke-width="1" stroke-dasharray="5 5"/>
<path d="M908 222V503.6 M901 230L908 222L915 230 M901 496L908 503.6L915 496" class="dim" fill="none"/>
<text x="932" y="363" transform="rotate(90 932 363)" text-anchor="middle" class="s b">1760 до стены напротив</text>
<text x="55" y="714" class="s">Штриховка показывает пересечение с проекцией входа и с условной спортзоной.</text>
<text x="55" y="740" class="s">Стена с кроватью 3837 по обмеру. Ширина комнаты 2810 по БТИ.</text>

<rect x="1000" y="105" width="470" height="670" rx="12" class="card"/>
<text x="1025" y="143" class="h">Проверка места</text>
<text x="1025" y="187" class="t b">2810 − 1050 = 1760 мм</text>
<text x="1025" y="213" class="s">Между передним краем кровати и стеной напротив.</text>
<text x="1025" y="260" class="t b">Лестница слева</text>
<text x="1025" y="287" class="s">Нижняя ступень в показанном положении</text><text x="1025" y="309" class="s">попадает на контур спорткомплекса.</text>
<rect x="1020" y="347" width="430" height="155" rx="9" class="warn"/>
<text x="1037" y="380" class="t b">Горка справа</text>
<text x="1037" y="408" class="s">Пересекает проекцию входа P2.</text>
<text x="1037" y="432" class="s">Если выкат заканчивается у стены,</text>
<text x="1037" y="456" class="s">место для выхода после съезда равно 0 мм.</text>
<text x="1025" y="555" class="t b">Что сверить на месте</text>
<text x="1025" y="583" class="s">Чистовую ширину комнаты и входа,</text><text x="1025" y="607" class="s">габариты лестницы, выкат и зону выхода,</text><text x="1025" y="631" class="s">размер спорткомплекса и открывание фасадов.</text>
<line x1="1025" y1="668" x2="1443" y2="668" stroke="#d1ddd4"/>
<text x="1025" y="698" class="s">Основание: S10, БТИ B01, схемы детской 48 и 70.</text>
</svg>
