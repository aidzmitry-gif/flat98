<div id="tv011-numbered-elements">
  <style>
    #tv011-numbered-elements { color: var(--foreground); }

    #tv011-numbered-elements svg { display: block; width: 100%; height: auto; margin-top: 6px; }
    #tv011-numbered-elements .room { fill: color-mix(in srgb, var(--secondary) 25%, transparent); stroke: var(--foreground); stroke-width: 2; }
    #tv011-numbered-elements .kitchen-zone { fill: color-mix(in srgb, var(--orange) 13%, transparent); stroke: var(--orange); stroke-width: 1.4; stroke-dasharray: 6 4; }

    #tv011-numbered-elements .desk { fill: color-mix(in srgb, var(--blue) 16%, transparent); stroke: var(--blue); stroke-width: 1.3; }

    #tv011-numbered-elements .tv { fill: color-mix(in srgb, var(--red) 16%, transparent); stroke: var(--red); stroke-width: 1.3; }
    #tv011-numbered-elements .opening { stroke: var(--orange); stroke-width: 4; }
    #tv011-numbered-elements .module { fill: color-mix(in srgb, var(--accent) 18%, transparent); stroke: var(--border); stroke-width: 1.1; }
    #tv011-numbered-elements .badge { fill: var(--primary); stroke: var(--primary-foreground); stroke-width: 1; }
    #tv011-numbered-elements .badge-text { fill: var(--primary-foreground); font-size: 12px; font-family: inherit; text-anchor: middle; dominant-baseline: middle; }
    #tv011-numbered-elements .label { fill: var(--foreground); font-size: 12px; font-family: inherit; text-anchor: middle; }
    #tv011-numbered-elements .small { fill: var(--muted-foreground); font-size: 10px; font-family: inherit; text-anchor: middle; }
    #tv011-numbered-elements .dim { stroke: var(--muted-foreground); stroke-width: 1; }
    @media (max-width: 520px) {
      #tv011-numbered-elements .label { font-size: 21px; }
      #tv011-numbered-elements .small { font-size: 18px; }
      #tv011-numbered-elements .plan-detail { display: none; }
