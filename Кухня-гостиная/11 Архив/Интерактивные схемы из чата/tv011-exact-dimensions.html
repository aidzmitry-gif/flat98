  <p id="facade-status" class="note" aria-live="polite">Проверено: 300 + 600 + 600 + 300 + 600 = 2400 мм. Вторая широкая секция — цельный фасад ПММ.</p>
  <script>
    (function () {
      const root = document.getElementById('tv011-exact-dimensions');
      const real = root.querySelector('#facade-real');
      const reference = root.querySelector('#facade-reference');
      const status = root.querySelector('#facade-status');
      const desc = root.querySelector('#facade-desc');
      root.querySelectorAll('input[name="facade"]').forEach((input) => {
        input.addEventListener('change', () => {
          const isReal = input.value === 'real' && input.checked;
          real.hidden = !isReal;
          reference.hidden = isReal;
          status.textContent = isReal
            ? 'Проверено: 300 + 600 + 600 + 300 + 600 = 2400 мм. Вторая широкая секция — цельный фасад ПММ.'
            : 'Референс повторяет рисунок, но исключает ПММ 600 из секции 900–1500 мм.';
          desc.textContent = isReal
            ? 'Реализуемый вариант: модуль варки 600 с двумя фронтами, затем цельный фасад посудомоечной машины 600, узкий выкат 300 и пенал 600.'
            : 'Референсный фасад: две широкие секции 600 с верхним и нижним фронтом, узкая секция 300 и пенал 600. Посудомоечной машины в таком фронте нет.';
        });
      });
    }());
  </script>
