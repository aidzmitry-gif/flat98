<div id="laundry-left-wall" aria-labelledby="laundry-title">
  <style>
    #laundry-left-wall { color: var(--foreground); }
    #laundry-left-wall .laundry-drawing { display: block; width: 100%; height: auto; }
    #laundry-left-wall .wall { fill: var(--card); }
    #laundry-left-wall .unit { fill: var(--secondary); stroke: var(--border); stroke-width: 2; }
    #laundry-left-wall .machine { fill: var(--background); stroke: var(--foreground); stroke-width: 3; }
    #laundry-left-wall .door { fill: var(--accent); stroke: var(--border); stroke-width: 2; }
    #laundry-left-wall .shelf { stroke: var(--border); stroke-width: 2; }
    #laundry-left-wall .detail { fill: none; stroke: var(--muted-foreground); stroke-width: 3; }
    #laundry-left-wall .label { fill: var(--foreground); font-weight: 500; }
    #laundry-left-wall .note { fill: var(--muted-foreground); }
    #laundry-left-wall .arrow { fill: none; stroke: var(--muted-foreground); stroke-width: 2; marker-end: url(#laundry-arrow); }
  </style>
  <svg class="laundry-drawing" viewBox="0 0 900 600" role="img" aria-labelledby="laundry-title laundry-desc">
    <title id="laundry-title">Концепт левой стены постирочной</title>
    <desc id="laundry-desc">Слева высокий шкаф для хранения, справа колонна из стиральной и сушильной машин. Над техникой расположены закрытые шкафы для белья.</desc>
    <defs>
      <marker id="laundry-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted-foreground)"></path>
      </marker>
    </defs>
    <text x="40" y="42" class="label" font-size="25">Левая стена — постирочная</text>
    <text x="40" y="70" class="note" font-size="16">Концепт без точных размеров</text>
    <rect class="wall" x="40" y="100" width="820" height="440" rx="4"></rect>

    <rect class="unit" x="80" y="145" width="235" height="350" rx="3"></rect>
    <line class="shelf" x1="80" y1="245" x2="315" y2="245"></line>
    <line class="shelf" x1="80" y1="345" x2="315" y2="345"></line>
    <line class="shelf" x1="80" y1="445" x2="315" y2="445"></line>
    <rect class="door" x="102" y="166" width="191" height="307" rx="2" opacity=".45"></rect>
    <text class="label" x="198" y="292" text-anchor="middle" font-size="19">высокий шкаф</text>
    <text class="note" x="198" y="319" text-anchor="middle" font-size="15">химия · корзины</text>
    <text class="note" x="198" y="341" text-anchor="middle" font-size="15">гладильная доска</text>

    <rect class="unit" x="355" y="145" width="465" height="105" rx="3"></rect>
    <line class="shelf" x1="510" y1="145" x2="510" y2="250"></line>
    <line class="shelf" x1="665" y1="145" x2="665" y2="250"></line>
    <text class="label" x="587" y="202" text-anchor="middle" font-size="18">верхние шкафы: бельё и полотенца</text>

    <rect class="machine" x="425" y="270" width="325" height="110" rx="3"></rect>
    <circle class="detail" cx="587" cy="325" r="35"></circle>
    <circle class="detail" cx="587" cy="325" r="27"></circle>
    <text class="label" x="692" y="331" text-anchor="end" font-size="18">сушильная</text>

    <rect class="machine" x="425" y="385" width="325" height="110" rx="3"></rect>
    <circle class="detail" cx="587" cy="440" r="35"></circle>
    <circle class="detail" cx="587" cy="440" r="27"></circle>
    <circle cx="452" cy="408" r="5" fill="var(--muted-foreground)"></circle>
    <rect x="470" y="401" width="58" height="14" rx="2" fill="var(--secondary-foreground)" opacity=".35"></rect>
    <text class="label" x="692" y="446" text-anchor="end" font-size="18">стиральная</text>

    <path class="arrow" d="M 322 382 C 360 382, 370 382, 402 382"></path>
    <text class="note" x="363" y="369" text-anchor="middle" font-size="14">рядом</text>
    <text class="note" x="450" y="525" font-size="15">Точку воды и слив — за стиральной машиной</text>
  </svg>
</div>
