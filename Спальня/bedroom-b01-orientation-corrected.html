<section id="bedroom-b01-orientation-corrected" aria-labelledby="orientation-corrected-title">
  <style>
    #bedroom-b01-orientation-corrected { color: var(--foreground); }
    #bedroom-b01-orientation-corrected h2 { margin: 0 0 12px; }
    #bedroom-b01-orientation-corrected svg { display: block; width: 100%; height: auto; overflow: visible; }
    #bedroom-b01-orientation-corrected .shell { fill: color-mix(in srgb, var(--background) 88%, var(--foreground) 12%); }
    #bedroom-b01-orientation-corrected .wall { fill: none; stroke: var(--foreground); stroke-width: 6; }
    #bedroom-b01-orientation-corrected .window { stroke: var(--blue); stroke-width: 5; }
    #bedroom-b01-orientation-corrected .p6 { stroke: var(--green); stroke-width: 5; }
    #bedroom-b01-orientation-corrected .return { fill: color-mix(in srgb, var(--muted) 78%, transparent); stroke: var(--foreground); stroke-width: 1.2; }
    #bedroom-b01-orientation-corrected .radiator { fill: color-mix(in srgb, var(--orange) 16%, transparent); stroke: var(--orange); stroke-width: 1.4; stroke-dasharray: 4 3; }
    #bedroom-b01-orientation-corrected .bed { fill: color-mix(in srgb, var(--primary) 17%, var(--background) 83%); stroke: var(--foreground); stroke-width: 1.5; }
    #bedroom-b01-orientation-corrected .cot { fill: color-mix(in srgb, var(--green) 20%, var(--background) 80%); stroke: var(--green); stroke-width: 1.7; }
    #bedroom-b01-orientation-corrected .vanity { fill: color-mix(in srgb, var(--accent) 76%, transparent); stroke: var(--foreground); stroke-width: 1.3; }
    #bedroom-b01-orientation-corrected .wardrobe { fill: color-mix(in srgb, var(--secondary) 74%, var(--foreground) 26%); stroke: var(--foreground); stroke-width: 1.3; }
    #bedroom-b01-orientation-corrected .dimension { fill: none; stroke: var(--muted-foreground); stroke-width: 1.1; marker-start: url(#arrow); marker-end: url(#arrow); }
    #bedroom-b01-orientation-corrected .extension { fill: none; stroke: var(--muted-foreground); stroke-width: 1; }
    #bedroom-b01-orientation-corrected .label { fill: var(--foreground); font: 500 14px/1.2 system-ui, sans-serif; }
    #bedroom-b01-orientation-corrected .small { fill: var(--muted-foreground); font: 400 12px/1.2 system-ui, sans-serif; }
    #bedroom-b01-orientation-corrected .measure { fill: var(--foreground); font: 500 12px/1.2 system-ui, sans-serif; }
    #bedroom-b01-orientation-corrected .green { fill: var(--green); font: 500 12px/1.2 system-ui, sans-serif; }
    #bedroom-b01-orientation-corrected .orange { fill: var(--orange); font: 500 12px/1.2 system-ui, sans-serif; }
  </style>
  <h2 id="orientation-corrected-title">Верная ориентация спальни по B01</h2>
  <svg viewBox="0 0 880 670" role="img" aria-labelledby="orientation-svg-title orientation-svg-desc">
    <title id="orientation-svg-title">План спальни с окном слева, проходом P6 справа сверху и мебельной группой справа снизу</title>
    <desc id="orientation-svg-desc">Спальня B01 имеет размер 3840 на 2810 миллиметров. Окно O3 и радиатор находятся на левой наружной стене. Проход P6 расположен на правой стороне сверху. Мебельная группа глубиной 600 миллиметров занимает только нижний участок правой стены длиной 1740 миллиметров. Кровать изголовьем стоит на нижней наружной стене.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8z" fill="var(--muted-foreground)"></path></marker>
    </defs>

    <rect class="shell" x="125" y="100" width="480" height="351.25"></rect>
    <path class="wall" d="M125 100 H605 M125 451.25 H605 M125 100 V451.25 M605 217.5 V451.25"></path>
    <line class="p6" x1="605" y1="100" x2="605" y2="217.5"></line>
    <rect class="return" x="598" y="217.5" width="7" height="16.25"></rect>

    <line class="window" x1="125" y1="175" x2="125" y2="375"></line>
    <rect class="radiator" x="134" y="236" width="23" height="78" rx="2"></rect>
    <text class="label" x="42" y="156">левая наружная стена</text>
    <text class="measure" x="42" y="174">O3 · 1 600</text>
    <text class="orange" x="42" y="192">R-05 под окном</text>

    <text class="green" x="620" y="130">P6 · 940</text>
    <text class="small" x="620" y="148">свободный проход</text>
    <text class="small" x="620" y="166">без шкафа и консоли</text>
    <text class="small" x="620" y="228">стеновой узел 130</text>

    <rect class="bed" x="162.5" y="201.25" width="175" height="250" rx="7"></rect>
    <text class="label" x="190" y="315">кровать</text>
    <text class="small" x="182" y="333">1 400×2 000</text>
    <text class="small" x="172" y="470">изголовье на нижней наружной стене</text>

    <rect class="cot" x="337.5" y="332.5" width="68.75" height="118.75" rx="5"></rect>
    <text class="green" x="414" y="362">временная люлька</text>
    <text class="green" x="414" y="379">550×950</text>

    <rect class="vanity" x="530" y="233.75" width="75" height="90"></rect>
    <rect class="wardrobe" x="530" y="327.5" width="75" height="123.75"></rect>
    <text class="small" x="536" y="270">консоль +</text>
    <text class="small" x="536" y="286">зеркало 720</text>
    <text class="small" x="536" y="370">шкаф ~990</text>
    <text class="small" x="536" y="386">+ доборы</text>
    <text class="small" x="530" y="498">только на стене 5/8 · 1 740×600</text>

    <line class="dimension" x1="406.25" y1="404" x2="530" y2="404"></line>
    <text class="measure" x="428" y="395">990</text>
    <line class="dimension" x1="337.5" y1="423" x2="530" y2="423"></line>
    <text class="measure" x="402" y="414">1 540 без люльки</text>

    <line class="dimension" x1="125" y1="62" x2="605" y2="62"></line>
    <line class="extension" x1="125" y1="70" x2="125" y2="100"></line>
    <line class="extension" x1="605" y1="70" x2="605" y2="100"></line>
    <text class="measure" x="337" y="52">3 840 B01</text>
    <line class="dimension" x1="89" y1="100" x2="89" y2="451.25"></line>
    <line class="extension" x1="97" y1="100" x2="125" y2="100"></line>
    <line class="extension" x1="97" y1="451.25" x2="125" y2="451.25"></line>
    <text class="measure" x="77" y="302" transform="rotate(-90 77 302)">2 810 B01</text>

    <text class="green" x="125" y="550">Исправление: окно — слева, P6 — справа сверху, мебельная группа — справа снизу только на 1 740 мм.</text>
    <text class="small" x="125" y="579">Кровать и люлька — предложение по расстановке; B01 подтверждает стены, P6 и окно, но не мебель.</text>
    <text class="orange" x="125" y="608">Перед заказом: снять чистовой участок стены 5/8, кромки P6 и габарит R-05.</text>
  </svg>
</section>
