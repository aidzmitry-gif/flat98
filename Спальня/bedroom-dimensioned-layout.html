<div id="bedroom-dimensioned-layout" aria-label="Размерная схема спальни 5">
  <style>
    #bedroom-dimensioned-layout { color: var(--foreground); width: 100%; }

    #bedroom-dimensioned-layout .title { fill: var(--foreground); font: 500 22px system-ui, sans-serif; }
    #bedroom-dimensioned-layout .label { fill: var(--foreground); font: 500 17px system-ui, sans-serif; }
    #bedroom-dimensioned-layout .small { fill: var(--muted-foreground); font: 400 15px system-ui, sans-serif; }
    #bedroom-dimensioned-layout .dim { fill: var(--orange); font: 500 16px system-ui, sans-serif; }
    #bedroom-dimensioned-layout .furn-dim { fill: var(--purple); font: 500 16px system-ui, sans-serif; }
    #bedroom-dimensioned-layout .room { fill: color-mix(in srgb, var(--blue) 7%, transparent); }
    #bedroom-dimensioned-layout .wardrobe-room { fill: color-mix(in srgb, var(--muted) 72%, transparent); }
    #bedroom-dimensioned-layout .wall { fill: var(--foreground); opacity: .58; }
    #bedroom-dimensioned-layout .bed { fill: color-mix(in srgb, var(--purple) 24%, transparent); stroke: var(--purple); stroke-width: 3; }
    #bedroom-dimensioned-layout .bedside { fill: color-mix(in srgb, var(--purple) 14%, transparent); stroke: var(--purple); stroke-width: 2; }
    #bedroom-dimensioned-layout .built-in { fill: color-mix(in srgb, var(--viz-series-1) 30%, transparent); stroke: var(--viz-series-1); stroke-width: 3; }
    #bedroom-dimensioned-layout .vanity { fill: color-mix(in srgb, var(--yellow) 31%, transparent); stroke: var(--yellow); stroke-width: 2; }
    #bedroom-dimensioned-layout .mirror { fill: color-mix(in srgb, var(--blue) 32%, transparent); stroke: var(--blue); stroke-width: 2; }
    #bedroom-dimensioned-layout .pouf { fill: color-mix(in srgb, var(--yellow) 37%, transparent); stroke: var(--yellow); stroke-width: 2; }
    #bedroom-dimensioned-layout .clear { fill: color-mix(in srgb, var(--green) 13%, transparent); stroke: var(--green); stroke-width: 2; stroke-dasharray: 7 6; }
    #bedroom-dimensioned-layout .window { stroke: var(--green); stroke-width: 5; }
    #bedroom-dimensioned-layout .radiator { stroke: var(--muted-foreground); stroke-width: 2; stroke-dasharray: 5 5; }
    #bedroom-dimensioned-layout .measure { stroke: var(--orange); stroke-width: 2; fill: none; }
    #bedroom-dimensioned-layout .furn-measure { stroke: var(--purple); stroke-width: 2; fill: none; }
    #bedroom-dimensioned-layout .measure-dash { stroke: var(--orange); stroke-width: 2; fill: none; stroke-dasharray: 7 7; }
    #bedroom-dimensioned-layout .tick { stroke: currentColor; stroke-width: 2; }
