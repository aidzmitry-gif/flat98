<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420mm" height="297mm" viewBox="0 0 420 297">
  <title>APT-001 — локальные обмеры квартиры, А3</title>
  <desc>Лист 2. Подробные подтверждённые обмеры: масштабные фрагменты и ведомость открытых размерных цепочек. Размеры в миллиметрах.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #101820; }
      .title { font-size: 5.2px; font-weight: 700; } .sub { font-size: 2.45px; }
      .room { fill: #fbfcfd; stroke: #101820; stroke-width: .7; }
      .room2 { fill: #f7fbff; stroke: #101820; stroke-width: .7; }
      .dimline { stroke: #1c5b84; stroke-width: .3; fill: none; }
      .ext { stroke: #1c5b84; stroke-width: .22; }
      .dim { fill: #164f7a; font-size: 2.55px; font-weight: 700; }
      .name { font-size: 3.4px; font-weight: 700; } .detail { font-size: 2.3px; }
      .small { font-size: 1.95px; } .tiny { font-size: 1.75px; }
      .ceiling { fill: #125d43; font-size: 2.35px; font-weight: 700; }
      .note { fill: #6d4b0b; font-size: 2.05px; }
      .panel { fill: #f7f9fb; stroke: #9eabb6; stroke-width: .35; }
      .src { fill: #005b96; font-size: 2.05px; text-decoration: underline; }
      .thin { stroke: #101820; stroke-width: .25; fill: none; }
      .joint { stroke: #7b5b14; stroke-width: .35; stroke-dasharray: 1.5 1.1; }
    </style>
    <marker id="arrow" viewBox="0 0 4 4" refX="2" refY="2" markerWidth="2.1" markerHeight="2.1" orient="auto-start-reverse"><path d="M0,0 L4,2 L0,4 z" fill="#1c5b84"/></marker>
  </defs>

  <rect x="5" y="5" width="410" height="287" fill="#fff" stroke="#101820" stroke-width=".5"/>
  <text x="15" y="17" class="title">APT-001 · ЛОКАЛЬНЫЕ ОБМЕРЫ КВАРТИРЫ</text>
  <text x="15" y="22" class="sub">Лист 2 из 2 · А3, альбомная ориентация · размеры на размерных линиях — мм · масштаб указан у каждого фрагмента · редакция 2 · 10.08.2026</text>
  <text x="15" y="27" class="sub">Сплошной контур построен только по замкнутой подтверждённой цепочке. Пунктирный фрагмент — локальная величина без достроения помещения.</text>

  <!-- 5 Bedroom, true scale 1:20 -->
  <a href="../Чертежи квартиры/photo_2_2026-08-04_22-23-23.jpg" target="_blank">
    <path d="M18 45 L161.5 45 L159.5 238.5 L18 238.5 Z" class="room"/>
    <text x="24" y="57" class="name">5 Спальня — М 1:20</text>
    <text x="24" y="63" class="detail">Замкнутый локальный контур; оконный проём О3 есть по S14,</text>
    <text x="24" y="67" class="detail">но его ширина и привязки не зафиксированы числом.</text>
    <circle cx="27" cy="75" r="1.8" fill="#125d43"/><circle cx="151" cy="75" r="1.8" fill="#125d43"/>
    <circle cx="27" cy="228" r="1.8" fill="#125d43"/><circle cx="150" cy="228" r="1.8" fill="#125d43"/>
    <circle cx="89" cy="142" r="1.8" fill="#125d43"/>
    <text x="24" y="83" class="ceiling">H 2750 на отмеченных точках; переход 4↔5: ниже, H н/д</text>
    <text x="24" y="88" class="src">S02 — обмер спальни; S04 — фото помещения; S14 — О3</text>
  </a>
  <line x1="18" y1="39.5" x2="161.5" y2="39.5" class="dimline" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="18" y1="45" x2="18" y2="37" class="ext"/><line x1="161.5" y1="45" x2="161.5" y2="37" class="ext"/>
  <text x="73" y="38" class="dim">2870 / 2830</text>
  <line x1="12.5" y1="45" x2="12.5" y2="238.5" class="dimline" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="18" y1="45" x2="10" y2="45" class="ext"/><line x1="18" y1="238.5" x2="10" y2="238.5" class="ext"/>
  <text x="10" y="151" class="dim" transform="rotate(-90 10 151)">3870</text>
  <line x1="83" y1="238.5" x2="97" y2="238.5" stroke="#fff" stroke-width="2.1"/><line x1="83" y1="240.3" x2="97" y2="240.3" class="thin"/>
  <text x="84.5" y="247" class="small">О3: размер н/д</text>

  <!-- 9 Terrace, true scale 1:20 -->
  <a href="../Чертежи квартиры/photo_1_2026-08-04_22-23-23.jpg" target="_blank">
    <rect x="180" y="45" width="165.5" height="105.5" class="room2"/>
    <text x="187" y="57" class="name">9 Терраса — М 1:20</text>
    <text x="187" y="63" class="detail">открытая; отметки потолка не зафиксированы</text>
    <text x="187" y="70" class="src">S01 — размерный лист; S12 — связь с кухней</text>
  </a>
  <line x1="180" y1="39.5" x2="345.5" y2="39.5" class="dimline" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="180" y1="45" x2="180" y2="37" class="ext"/><line x1="345.5" y1="45" x2="345.5" y2="37" class="ext"/>
  <text x="254" y="38" class="dim">3310</text>
  <line x1="174.5" y1="45" x2="174.5" y2="150.5" class="dimline" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="172" y="108" class="dim" transform="rotate(-90 172 108)">2110 / 2130</text>
  <line x1="221.5" y1="150.5" x2="286.25" y2="150.5" stroke="#fff" stroke-width="2.1"/>
  <line x1="221.5" y1="152.3" x2="286.25" y2="152.3" class="thin"/>
  <text x="226" y="158" class="dim">остекление 1655</text>
  <line x1="286.25" y1="150.5" x2="337.4" y2="150.5" stroke="#fff" stroke-width="2.1"/>
  <line x1="286.25" y1="152.3" x2="337.4" y2="152.3" class="thin"/>
  <text x="286" y="158" class="dim">проём 1298</text>

  <!-- 4 Corridor. Independent fragments, no invented joining geometry. -->
  <g>
    <text x="181" y="174" class="name">4 Коридор — локальные фрагменты, М 1:30</text>
    <text x="181" y="179" class="note">Стык фрагментов и переход 4↔5 с проёмом/понижением не достроены.</text>
    <a href="../Чертежи квартиры/photo_6_2026-08-04_22-23-23.jpg" target="_blank">
      <rect x="184" y="190" width="32.33" height="62.67" class="room2"/>
      <text x="187" y="201" class="detail">фрагмент А</text>
      <text x="187" y="207" class="ceiling">H 2750</text>
      <text x="187" y="213" class="src">S06</text>
      <rect x="231" y="194" width="32" height="59.33" class="room2"/>
      <text x="234" y="205" class="detail">фрагмент Б</text>
      <text x="234" y="211" class="ceiling">H 2750</text>
      <text x="234" y="217" class="src">S06</text>
    </a>
    <line x1="184" y1="185.5" x2="216.33" y2="185.5" class="dimline" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="198" y="184" class="dim">970</text>
    <line x1="179.5" y1="190" x2="179.5" y2="252.67" class="dimline" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="177" y="234" class="dim" transform="rotate(-90 177 234)">1880</text>
    <line x1="231" y1="189.5" x2="263" y2="189.5" class="dimline" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="241.5" y="188" class="dim">960</text>
    <line x1="267.3" y1="194" x2="267.3" y2="253.33" class="dimline" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="269.5" y="231" class="dim" transform="rotate(-90 269.5 231)">1780</text>
    <line x1="194.5" y1="252.67" x2="205" y2="252.67" class="joint"/>
    <text x="184" y="251" class="dim">до балки: 630</text>
  </g>

  <!-- 8 Wardrobe, true scale 1:30 -->
  <a href="../Чертежи квартиры/photo_7_2026-08-04_22-23-24.jpg" target="_blank">
    <path d="M300 194 L358.17 194 L357.5 251.73 L300 251.77 Z" class="room"/>
    <text x="304" y="205" class="name">8 Гардеробная</text>
    <text x="304" y="211" class="detail">М 1:30</text>
    <text x="304" y="217" class="dim">внутр.: 1748</text>
    <text x="304" y="223" class="ceiling">H 2712–2718</text>
    <text x="304" y="229" class="src">S07</text>
  </a>
  <line x1="300" y1="189.5" x2="358.17" y2="189.5" class="dimline" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="310" y="188" class="dim">1739 / 1745</text>
  <line x1="295.5" y1="194" x2="295.5" y2="251.77" class="dimline" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="293" y="231" class="dim" transform="rotate(-90 293 231)">1732 / 1730</text>

  <!-- Data panels for all other captured measurements. -->
  <rect x="15" y="255" width="104" height="28" rx="1.4" class="panel"/>
  <text x="19" y="262" class="name">1 Кухня-гостиная · S03/S10/S12</text>
  <text x="19" y="267" class="detail">контрольный контур: ~3550 × 5705; доп. горизонталь: 2749</text>
  <text x="19" y="272" class="detail">Д2: 915 × 2150; локальная высота: 2530; розетки: ⌀15 / ⌀50</text>
  <text x="19" y="277" class="ceiling">потолок: 2714–2727; центр: 2719</text>

  <rect x="123" y="255" width="83" height="28" rx="1.4" class="panel"/>
  <text x="127" y="262" class="name">2 Детская · S10</text>
  <text x="127" y="267" class="detail">сторона: 3825 / 3837</text>
  <text x="127" y="272" class="ceiling">потолок: 2712–2716; центр 2715</text>
  <text x="127" y="277" class="note">вторая плановая сторона не зафиксирована</text>

  <rect x="210" y="255" width="93" height="28" rx="1.4" class="panel"/>
  <text x="214" y="262" class="name">3 Прихожая · S08/S09</text>
  <text x="214" y="267" class="ceiling">потолок: 2750 в углах и центре</text>
  <text x="214" y="272" class="note">замкнутая размерная цепочка отсутствует</text>
  <text x="214" y="277" class="detail">Д1: 1140 × 2150; линейная привязка н/д</text>

  <rect x="307" y="255" width="98" height="28" rx="1.4" class="panel"/>
  <text x="311" y="262" class="name">6 Ванная / 7 Туалет · F09–F20 / S05</text>
  <text x="311" y="267" class="detail">туалет, локально: короб 456; t=28; участки 933 / 1142 / 658</text>
  <text x="311" y="272" class="note">полные контуры, высоты и осевые привязки не подтверждены</text>
  <text x="311" y="277" class="note">не использовать для заказа мебели или переноса стен</text>

  <text x="15" y="289" class="tiny">Примечание: О1–О3 и Д1–Д5 показаны на листе 1; размеры известны для Д1/Д2. Переход 4↔5: проём, понижение потолка и фрагменты стен без чисел (U01). Основание расположения: S14.</text>
</svg>
