    <rect x="200" y="150" width="250" height="90" class="room r9"/>
    <text x="218" y="180" class="rn">9 · Терраса</text>
    <text x="218" y="204" class="dim">3310 × 2110 / 2130</text>
    <text x="218" y="226" class="src">S01 · S12</text>
  </a>

  <!-- 1. Kitchen-living -->
  <a href="../Чертежи квартиры/photo_12_2026-08-04_22-23-24.jpg" target="_blank">
    <rect x="110" y="240" width="430" height="410" class="room r1"/>
    <text x="135" y="282" class="rn">1 · Кухня-гостиная</text>
    <text x="135" y="312" class="dim">стены: ~3550; 5705; 2749</text>
    <text x="135" y="338" class="dim">потолок: 2714–2727; фрагмент: 2530</text>
    <text x="135" y="364" class="meta">дверной проём: 893 × 2121</text>
    <text x="135" y="394" class="src">S03 · S10 · S12</text>
    <text x="135" y="422" class="note">Размеры относятся к разным стенам/фрагментам.</text>
  </a>
  <line x1="330" y1="650" x2="410" y2="650" class="opening"/>
  <path d="M330 650 A80 80 0 0 1 410 570" class="door"/>

  <!-- 2. Child room -->
  <a href="../Чертежи квартиры/photo_10_2026-08-04_22-23-24.jpg" target="_blank">
    <rect x="540" y="240" width="330" height="410" class="room r2"/>
    <text x="565" y="282" class="rn">2 · Детская</text>
    <text x="565" y="312" class="dim">потолок: 2712–2716; центр: 2715</text>
    <text x="565" y="338" class="dim">стороны: 3825 / 3837</text>
    <text x="565" y="368" class="src">S10</text>
    <text x="565" y="395" class="note">Окно — фото F02/F07,</text>
    <text x="565" y="414" class="note">без самостоятельной цифры.</text>
  </a>

  <!-- 3. Entrance -->
  <a href="../Чертежи квартиры/photo_9_2026-08-04_22-23-24.jpg" target="_blank">
    <rect x="110" y="650" width="430" height="190" class="room r3"/>
    <text x="130" y="688" class="rn">3 · Прихожая (вход)</text>
    <text x="130" y="716" class="meta">электрощит, входная зона и проёмы — на S09</text>
    <text x="130" y="739" class="dim">потолок, углы/центр: 2750</text>
    <text x="130" y="764" class="src">S08 · S09 · F08 · F26 · F28</text>
    <text x="130" y="793" class="note">Число щита не перенесено: база рулетки на фото неоднозначна.</text>
  </a>

  <!-- 4. Corridor -->
  <a href="../Чертежи квартиры/photo_6_2026-08-04_22-23-23.jpg" target="_blank">
    <rect x="540" y="650" width="170" height="400" class="room r4"/>
    <text x="554" y="686" class="rn">4 · Коридор</text>
    <text x="554" y="714" class="dim">970 × 1880</text>
    <text x="554" y="738" class="dim">960 × 1780</text>
    <text x="554" y="762" class="meta">балка: 630</text>
    <text x="554" y="786" class="dim">потолок: 2750</text>
    <text x="554" y="814" class="src">S06</text>
