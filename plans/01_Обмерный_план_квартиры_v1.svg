    <text x="722" y="950" class="rn">8 · Гардеробная</text>
    <text x="722" y="974" class="dim">план: 1732–1745</text>
    <text x="722" y="997" class="dim">потолок: 2712–2718</text>
    <text x="722" y="1025" class="src">S07</text>
  </a>

  <!-- 5. Bedroom -->
  <a href="../Чертежи квартиры/photo_2_2026-08-04_22-23-23.jpg" target="_blank">
    <rect x="540" y="1050" width="330" height="190" class="room r5"/>
    <text x="560" y="1090" class="rn">5 · Спальня</text>
    <text x="560" y="1120" class="dim">2870 / 2830 × 3870</text>
    <text x="560" y="1146" class="meta">высота потолка, углы/центр: 2750</text>
    <text x="560" y="1176" class="src">S02 · S04</text>
  </a>

  <!-- source legend -->
  <rect x="1040" y="145" width="690" height="1095" rx="8" class="legend"/>
  <text x="1070" y="187" class="rn">Легенда источников</text>
  <text x="1070" y="218" class="subtitle">S — листы со схемами и числами (22:23); F — фото объекта (22:35).</text>
  <text x="1070" y="252" class="meta">Для ванной и туалета фото подтверждают зону и инженерию,</text>
  <text x="1070" y="274" class="meta">но не дают однозначно переносимого полного габарита.</text>

  <a href="../Чертежи квартиры/photo_14_2026-08-04_22-23-24.jpg" target="_blank"><text x="1070" y="320" class="src">S14 — легенда помещений 1–9</text></a>
  <a href="../Чертежи квартиры/photo_1_2026-08-04_22-23-23.jpg" target="_blank"><text x="1070" y="350" class="src">S01 — терраса</text></a>
  <a href="../Чертежи квартиры/photo_2_2026-08-04_22-23-23.jpg" target="_blank"><text x="1070" y="380" class="src">S02 / S04 — спальня</text></a>
  <a href="../Чертежи квартиры/photo_3_2026-08-04_22-23-23.jpg" target="_blank"><text x="1070" y="410" class="src">S03 — кухня-гостиная, стена с розетками</text></a>
  <a href="../Чертежи квартиры/photo_5_2026-08-04_22-23-23.jpg" target="_blank"><text x="1070" y="440" class="src">S05 — туалет, короб</text></a>
  <a href="../Чертежи квартиры/photo_6_2026-08-04_22-23-23.jpg" target="_blank"><text x="1070" y="470" class="src">S06 — коридор</text></a>
  <a href="../Чертежи квартиры/photo_7_2026-08-04_22-23-24.jpg" target="_blank"><text x="1070" y="500" class="src">S07 — гардеробная</text></a>
  <a href="../Чертежи квартиры/photo_9_2026-08-04_22-23-24.jpg" target="_blank"><text x="1070" y="530" class="src">S09 — прихожая, проёмы/высоты</text></a>
  <a href="../Чертежи квартиры/photo_10_2026-08-04_22-23-24.jpg" target="_blank"><text x="1070" y="560" class="src">S10 — детская, проём кухни-гостиной</text></a>
  <a href="../Чертежи квартиры/photo_12_2026-08-04_22-23-24.jpg" target="_blank"><text x="1070" y="590" class="src">S12 — кухня-гостиная и терраса</text></a>
  <a href="../Чертежи квартиры/photo_9_2026-08-04_22-35-06.jpg" target="_blank"><text x="1070" y="620" class="src">F09–F20 — ванная, инженерные точки</text></a>
  <a href="../Чертежи квартиры/photo_21_2026-08-04_22-35-06.jpg" target="_blank"><text x="1070" y="650" class="src">F21–F27 — туалет, сантехника и унитаз</text></a>
  <a href="../Чертежи квартиры/photo_8_2026-08-04_22-35-06.jpg" target="_blank"><text x="1070" y="680" class="src">F08 / F26 / F28 — прихожая, электрощит</text></a>

  <line x1="1070" y1="720" x2="1695" y2="720" class="line"/>
  <text x="1070" y="754" class="rn">Статус точности</text>
  <text x="1070" y="784" class="meta">• Дробные/парные значения сохранены как разные контрольные записи.</text>
  <text x="1070" y="810" class="meta">• Для прихожей нет переносимой числовой величины щита: конечная база на фото неясна.</text>
  <text x="1070" y="836" class="meta">• Полные габариты ванной и туалета не показаны как рабочие: текущие JPG не</text>
  <text x="1090" y="856" class="meta">  позволяют независимо подтвердить их числовые значения.</text>
  <text x="1070" y="878" class="meta">• Значения в овалах на эскизах — высоты потолка по углам и в центре.</text>
  <text x="1070" y="912" class="note">Перед заказом мебели используйте ведомость и оригинал JPG, а не только схему.</text>

  <text x="70" y="1260" class="subtitle">APT-001 · редакция 3 · 2026-08-05 · единицы: миллиметры · не является разрешением на перепланировку.</text>
</svg>
