<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1280" viewBox="0 0 1800 1280">
  <title>Единый цифровой обмерный план квартиры — редакция 3</title>
  <desc>Схема связей помещений и контрольные размеры. Контуры схематичны; числовые подписи имеют источники в ведомости и кликабельные ссылки на JPG.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #152334; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #526270; }
    .room { stroke: #1f4057; stroke-width: 3; }
    .r1 { fill: #e6f2fa; } .r2 { fill: #f7efd8; } .r3 { fill: #eee8f8; }
    .r4 { fill: #e7f4e6; } .r5 { fill: #f9e7e7; } .r6 { fill: #e7f1ee; }
    .r7 { fill: #f4ebdf; } .r8 { fill: #f2eaf6; } .r9 { fill: #e7f6f5; }
    .rn { font-size: 20px; font-weight: 700; } .meta { font-size: 14px; }
    .dim { font-size: 15px; font-weight: 700; fill: #173b56; }
    .src { font-size: 13px; fill: #005b96; text-decoration: underline; }
    .note { font-size: 13px; fill: #6a4a14; }
    .line { stroke: #4f6679; stroke-width: 2; fill: none; }
    .opening { stroke: #ffffff; stroke-width: 9; } .door { stroke: #1f4057; stroke-width: 2; fill: none; }
    .legend { fill: #f7f9fb; stroke: #9caebb; stroke-width: 1.5; }
  </style>

  <rect width="1800" height="1280" fill="#ffffff"/>
  <text x="70" y="55" class="title">Единый цифровой обмерный план квартиры — редакция 3</text>
  <text x="70" y="82" class="subtitle">Контрольные обмеры по фото. Планировочная схема — ориентировочная; размеры не усреднялись.</text>
  <text x="70" y="104" class="subtitle">Каждый блок кликабелен и ведёт к основному JPG-источнику. Полная расшифровка — в ведомости.</text>

  <!-- 9. Terrace -->
