  <line x1="191" y1="119" x2="203" y2="119" class="dimline" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="207" y="120" class="detail">контрольный размер, мм</text>
  <text x="191" y="133" class="name">Размеры и высоты</text>
  <text x="191" y="140" class="detail">Плановые размеры — синим; значения</text><text x="191" y="144" class="detail">потолка — зелёным. Разные значения</text><text x="191" y="148" class="detail">не усреднялись.</text>
  <text x="191" y="158" class="name">Неподтверждённые зоны</text>
  <text x="191" y="165" class="note">Детская: отсутствует второй плановый</text><text x="191" y="169" class="note">размер. Прихожая: нет замкнутой цепочки.</text><text x="191" y="173" class="note">Ванная и туалет: рабочий полный контур</text><text x="191" y="177" class="note">и высоты не считываются в доступных JPG.</text>
