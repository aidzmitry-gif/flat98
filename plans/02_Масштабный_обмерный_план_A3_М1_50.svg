  <text x="191" y="236" class="name">Проёмы по S14</text>
  <text x="191" y="243" class="detail">О1 — кухня, О2 — детская, О3 — спальня.</text><text x="191" y="247" class="detail">Д1 — вход 1140×2150; Д2 — кухня/прихожая 915×2150.</text><text x="191" y="251" class="detail">Д3–Д5 — санузлы и гардеробная.</text><text x="191" y="255" class="note">Для О1–О3, Д3–Д5 на S14 нет линейных</text><text x="191" y="259" class="note">привязок: показано положение, не ширина.</text>
  <text x="191" y="240" class="name">Перед применением</text>
  <text x="191" y="270" class="name">Перед применением</text>
  <text x="191" y="277" class="note">Не использовать пунктирные контуры для</text><text x="191" y="281" class="note">заказа мебели, плитки или переноса стен.</text><text x="191" y="285" class="note">Для этого нужны недостающие размеры</text><text x="191" y="289" class="note">и повторная проверка на объекте.</text>
  <text x="14" y="406" class="small">APT-001 · масштабный технический лист · лист 1 из 2 · не является разрешением на перепланировку.</text>
