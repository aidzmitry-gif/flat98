<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="297mm" height="420mm" viewBox="0 0 297 420">
  <title>Квартира — масштабный обмерный план, А3, М 1:50</title>
  <desc>Технический план с масштабом 1:50. Сплошными линиями показаны контуры с подтверждёнными размерами. Пунктирные контуры показывают положение помещения по схеме S14 и не являются координатной геометрией.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #101820; }
      .title { font-size: 5px; font-weight: 700; } .sub { font-size: 2.5px; }
      .room { fill: #fbfcfd; stroke: #101820; stroke-width: .7; }
      .provisional { fill: #fff8e8; stroke: #7b5b14; stroke-width: .55; stroke-dasharray: 2 1.2; }
      .dimline { stroke: #2d5f87; stroke-width: .28; fill: none; }
      .ext { stroke: #2d5f87; stroke-width: .22; }
      .ceiling { fill: #125d43; font-size: 2.35px; font-weight: 700; }
      .name { font-size: 3.25px; font-weight: 700; } .detail { font-size: 2.25px; }
      .dim { fill: #164f7a; font-size: 2.35px; font-weight: 700; }
      .small { font-size: 1.9px; } .src { fill: #005b96; font-size: 2.2px; text-decoration: underline; }
      .note { fill: #6d4b0b; font-size: 2.15px; }
      .panel { fill: #f7f9fb; stroke: #9eabb6; stroke-width: .35; }
      .thin { stroke: #101820; stroke-width: .25; fill: none; }
      .door { stroke: #101820; stroke-width: .35; fill: none; } .opening { stroke: #fff; stroke-width: 1.8; }
    </style>
    <marker id="arrow" viewBox="0 0 4 4" refX="2" refY="2" markerWidth="2" markerHeight="2" orient="auto-start-reverse"><path d="M0,0 L4,2 L0,4 z" fill="#2d5f87"/></marker>
    <pattern id="hatch" width="2" height="2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="2" stroke="#d7b96d" stroke-width=".35"/></pattern>
  </defs>

  <rect x="5" y="5" width="287" height="410" fill="#fff" stroke="#101820" stroke-width=".5"/>
  <text x="14" y="17" class="title">МАСШТАБНЫЙ ОБМЕРНЫЙ ПЛАН КВАРТИРЫ</text>
  <text x="14" y="22" class="sub">Лист А3 · М 1:50 при печати 100% · единицы на размерных линиях — мм · редакция 7 · 10.08.2026</text>
  <text x="14" y="27" class="sub">Основание: контрольные обмеры S01–S14. Сплошной контур = размер подтверждён; пунктир = связь помещений без полной координатной цепочки.</text>

