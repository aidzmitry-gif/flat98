<title id="title">Комната 7 — полный координационный лист: четыре развёртки и план</title>
<desc id="desc">Координационная схема санузла B01 2090 на 1740 на 2617 мм. Фиксированные плановые данные, условные высотные решения и запреты разделены.</desc>
