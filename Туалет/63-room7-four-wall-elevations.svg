<text class="body" x="1120" y="2310">• стены: светлый матовый известняк / керамогранит</text><text class="body" x="1120" y="2342">• акцент WC: рифлёный greige</text><text class="body" x="1120" y="2374">• пол: более тёмный матовый, противоскользящий</text><text class="body" x="1120" y="2406">• металл / K1: SUS304, сатиновая PVD-бронза; K1 260 × 90 × 180, дренаж</text>
<text class="red" x="1120" y="2460">Запреты: нет шкафов из верхней левой облицовки; нет ниш в стене 160 мм.</text><text class="red" x="1120" y="2492">Стена ванны: только K1; без других полок / стеллажа, щёток и розетки 230 В.</text>
<rect class="box" x="2110" y="2225" width="1180" height="340" rx="12"/>
<text class="h" x="2150" y="2270">СВЕТ · ЭЛЕКТРИКА · УПРАВЛЕНИЕ</text>
<text class="body" x="2150" y="2310">L1/L2 — потолочные светильники 3000 K; G2 — фронтальный свет зеркала.</text><text class="body" x="2150" y="2342">G3 — LED 2700 K только под тумбой; S1/S2 — извлекаемые датчики протечки.</text><text class="body" x="2150" y="2374">Сушитель 200 Вт: таймер вне D4; отдельная линия / УЗО — по электропроекту.</text><text class="body" x="2150" y="2406">SHV: только внутри зеркального шкафа, +1400 ориентир; не обычная 230 В розетка.</text>
<text class="cond" x="2150" y="2460">УСЛОВНО: высоты светильников, вентканал, оси крепежа, люк ВМ‑07, модели и монтажные карты.</text><text class="fixed" x="2150" y="2492">ФИКС.: контур B01, ванна, тумба X700…1380, ВМ‑07 X1380…2090, WC и проход 670.</text>
<text class="red" x="100" y="2670">НЕ ЧЕРТЁЖ ДЛЯ СВЕРЛЕНИЯ</text><text class="sub" x="450" y="2670">До монтажа: контрольный обмер чистовой плитки, D4, ванны/экрана/стекла, скрытых трасс, ВМ‑07 и вентиляции.</text>
