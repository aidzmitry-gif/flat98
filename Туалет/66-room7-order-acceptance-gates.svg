<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="2160" viewBox="0 0 2880 2160" role="img" aria-labelledby="title desc">
<title id="title">Комната 7 — гейты заказа и приёмки</title><desc id="desc">Последовательность зависимостей для заказа, скрытых работ, плитки и приёмки. Плановая расстановка санузла не изменяется.</desc>
<style>.bg{fill:#151715}.panel{fill:#20231f;stroke:#777c72;stroke-width:3}.card{fill:#292c27;stroke:#50564d;stroke-width:2}.must{fill:#f0c56d}.ok{fill:#58d29b}.info{fill:#8dd7d4}.stop{fill:#402927;stroke:#ef957b;stroke-width:4}.line{stroke:#525950;stroke-width:2}.arrow{fill:none;stroke:#8dd7d4;stroke-width:7}.heading{fill:#f3f0e8;font:700 46px Arial,sans-serif}.sub{fill:#aeb3aa;font:22px Arial,sans-serif}.h{fill:#f3f0e8;font:700 27px Arial,sans-serif}.label{fill:#f3f0e8;font:700 21px Arial,sans-serif}.body{fill:#d1d4cc;font:19px Arial,sans-serif}.small{fill:#aeb3aa;font:16px Arial,sans-serif}.gold{fill:#f0c56d;font:700 20px Arial,sans-serif}.red{fill:#ef957b;font:700 21px Arial,sans-serif}</style>
<rect class="bg" width="2880" height="2160"/><text class="heading" x="100" y="95">КОМНАТА 7 · ГЕЙТЫ ЗАКАЗА И ПРИЁМКИ</text><text class="sub" x="100" y="134">Последовательность зависимостей без изменения расстановки · закрывать работы только после прохождения соответствующего гейта</text><line class="line" x1="100" y1="168" x2="2780" y2="168"/>
<!-- flow --> <text class="gold" x="110" y="235">ПОСЛЕДОВАТЕЛЬНОСТЬ</text><rect class="card" x="105" y="280" width="480" height="250" rx="14"/><text class="h" x="140" y="330">1 · ОБМЕР И ДОСТУП</text><text class="body" x="140" y="375">ВМ‑07 + D4 + ванна / экран</text><text class="body" x="140" y="407">+ вентиляция</text><text class="small" x="140" y="455">Люк, траектория, петли, наличник,</text><text class="small" x="140" y="480">карты ванны / стекла / мебели.</text><path class="arrow" d="M600 405h120"/><path d="M720 405l-25-15v30z" fill="#8dd7d4"/>
<rect class="card" x="735" y="280" width="480" height="250" rx="14"/><text class="h" x="770" y="330">2 · РАЗМЕТКА</text><text class="body" x="770" y="375">Трассы, люки, сервисные</text><text class="body" x="770" y="407">границы, закладные</text><text class="small" x="770" y="455">Не сверлить и не закрывать</text><text class="small" x="770" y="480">непроверенные зоны.</text><path class="arrow" d="M1230 405h120"/><path d="M1350 405l-25-15v30z" fill="#8dd7d4"/>
<rect class="card" x="1365" y="280" width="480" height="250" rx="14"/><text class="h" x="1400" y="330">3 · СКРЫТЫЕ РАБОТЫ</text><text class="body" x="1400" y="375">Гидроизоляция + ленты +</text><text class="body" x="1400" y="407">манжеты + испытания</text><text class="small" x="1400" y="455">Проверить непрерывность и</text><text class="small" x="1400" y="480">сервис до плитки.</text><path class="arrow" d="M1860 405h120"/><path d="M1980 405l-25-15v30z" fill="#8dd7d4"/>
<rect class="card" x="1995" y="280" width="350" height="250" rx="14"/><text class="h" x="2030" y="330">4 · ПЛИТКА</text><text class="body" x="2030" y="375">Только после</text><text class="body" x="2030" y="407">приёмки скрытого</text><text class="small" x="2030" y="455">Сохранить доступ</text><text class="small" x="2030" y="480">к сервису.</text><path class="arrow" d="M2360 405h110"/><path d="M2470 405l-25-15v30z" fill="#8dd7d4"/>
<rect class="card" x="2485" y="280" width="290" height="250" rx="14"/><text class="h" x="2520" y="330">5 · МОНТАЖ</text><text class="body" x="2520" y="375">чистовой заказ</text><text class="body" x="2520" y="407">и аксессуары</text><text class="small" x="2520" y="455">по факту плитки</text>
<!-- stop --> <rect class="stop" x="105" y="580" width="2670" height="195" rx="15"/><text class="red" x="145" y="635">СТОП‑ГЕЙТ ВМ‑07</text><text class="label" x="145" y="682">Если люк ВМ‑07 не обслуживается без снятия WC — не закрывать стену и не заказывать облицовку / люк.</text><text class="small" x="145" y="724">Сначала полноразмерный шаблон WC, фактический люк и траектория обслуживания. Расстановку на листах не переносить.</text>
<!-- columns --> <text class="gold" x="110" y="850">КОНТРОЛЬНЫЕ КОЛОНКИ</text>
<rect class="panel" x="105" y="890" width="620" height="840" rx="14"/><text class="h" x="145" y="945">ДО ЗАКАЗА</text><text class="body" x="145" y="1000">□ ВМ‑07: люк + траектория + шаблон WC.</text><text class="body" x="145" y="1045">□ D4: проём, петли, короб, наличник.</text><text class="body" x="145" y="1090">□ Ванна / экран / стекло: карты монтажа.</text><text class="body" x="145" y="1135">□ Вентиляция: канал и существующая точка.</text><text class="body" x="145" y="1180">□ Тумба только после чистового пролёта.</text><text class="small" x="145" y="1240">Заказ тумбы: 670–674 × 345–347</text><text class="small" x="145" y="1266">в чистом пролёте 680 × 350.</text>
<rect class="panel" x="755" y="890" width="620" height="840" rx="14"/><text class="h" x="795" y="945">ДО СВЕРЛЕНИЯ</text><text class="body" x="795" y="1000">□ Совместная разметка по выбранным моделям.</text><text class="body" x="795" y="1045">□ Скрытые трассы подтверждены.</text><text class="body" x="795" y="1090">□ Основание / закладные под поручень проверены.</text><text class="body" x="795" y="1135">□ Полки D4: 600 × 125, верх +1050/+1320.</text><text class="body" x="795" y="1180">□ Аксессуары не попадают в ВМ‑07.</text><text class="small" x="795" y="1240">Высоты эргономики — ориентиры,</text><text class="small" x="795" y="1266">не точки сверления.</text>
<rect class="panel" x="1405" y="890" width="620" height="840" rx="14"/><text class="h" x="1445" y="945">ДО ПЛИТКИ</text><text class="body" x="1445" y="1000">□ Доступ к сифону / переливу через экран.</text><text class="body" x="1445" y="1045">□ Низкий добор: скат в чашу, пролив водой.</text><text class="body" x="1445" y="1090">□ Гидроизоляция: углы, ленты, манжеты.</text><text class="body" x="1445" y="1135">□ Водяная проба зафиксирована.</text><text class="body" x="1445" y="1180">□ Вентиляция и переток D4 рассчитаны.</text><text class="small" x="1445" y="1240">После плитки — контрольный</text><text class="small" x="1445" y="1266">замер проёма и пролёта тумбы.</text>
<rect class="panel" x="2055" y="890" width="720" height="840" rx="14"/><text class="h" x="2095" y="945">ПРИЁМКА</text><text class="body" x="2095" y="1000">□ Экран снимается независимо; сервис полный.</text><text class="body" x="2095" y="1045">□ Люк ВМ‑07 доступен без снятия WC.</text><text class="body" x="2095" y="1090">□ Скат добора проливается в чашу.</text><text class="body" x="2095" y="1135">□ Нет незапланированных ниш / полок.</text><text class="body" x="2095" y="1180">□ Фурнитура совпадает с образцом satin PVD bronze.</text><text class="body" x="2095" y="1225">□ S1/S2 доступны; тест автоматически закрывает краны.</text><text class="body" x="2095" y="1253">□ Повторное открытие воды — вручную после осмотра.</text>
<text class="red" x="2095" y="1310">ЗАПРЕТ: LED / ЭЛЕКТРИКА / ХРАНЕНИЕ</text><text class="body" x="2095" y="1348">в ВМ‑07, перегородке 160 мм,</text><text class="body" x="2095" y="1376">под ванной и под WC.</text><text class="small" x="2095" y="1428">Розетку 230V внутри не добавлять.</text>
<text class="red" x="100" y="1855">НЕ ЧЕРТЁЖ ДЛЯ СВЕРЛЕНИЯ</text><text class="sub" x="100" y="1892">Лист 66 фиксирует порядок решений и приёмки; все точки, модели и скрытые работы подтверждаются на объекте.</text>
</svg>
