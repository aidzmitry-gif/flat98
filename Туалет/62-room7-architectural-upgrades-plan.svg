<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="2160" viewBox="0 0 2880 2160" role="img" aria-labelledby="title desc">
 <title id="title">Комната 7 — архитектурные улучшения</title>
 <desc id="desc">Координационный лист санузла B01 2090 на 1740 мм с неизменной сантехнической геометрией и десятью архитектурными улучшениями. Не является чертежом для сверления.</desc>
