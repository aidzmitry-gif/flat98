 <!-- Right panel -->
 <rect class="panel" x="1900" y="250" width="900" height="1660" rx="18"/>
 <text class="heading" x="1950" y="320" font-size="38">ВНЕДРИТЬ</text>
 <text class="small" x="1950" y="353">Сначала проверить на объекте; затем закупка и монтаж.</text>
 <rect class="inset" x="1940" y="385" width="820" height="540" rx="12"/>
 <text class="must" x="1975" y="432" font-family="Arial" font-size="25" font-weight="700">MUST · ДО ПЛИТКИ / ЗАКАЗА</text>
 <text class="body" x="1975" y="475">1 · ВМ‑07: полноразмерный макет доступа;</text><text class="small" x="2010" y="501">не менять расстановку до проверки люка.</text>
 <text class="body" x="1975" y="548">2 · Одна система гидроизоляции: угловые ленты,</text><text class="small" x="2010" y="574">манжеты и водяная проба.</text>
 <text class="body" x="1975" y="621">4 · Вентиляция: существующая точка, измерить</text><text class="small" x="2010" y="647">канал; обратный клапан и переток D4 — расчётом.</text>
 <text class="body" x="1975" y="694">5 · Закладная под настоящий нагрузочный поручень.</text>
 <text class="body" x="1975" y="741">8 · S1/S2 + система протечки: ручной сброс,</text><text class="small" x="2010" y="767">доступ к запорным клапанам обязателен.</text>
 <text class="body" x="1975" y="814">10 · Матовая крупноформатная плитка; нескользкий</text><text class="small" x="2010" y="840">пол; единый физический образец satin PVD bronze.</text>
 <rect class="inset" x="1940" y="955" width="820" height="495" rx="12"/>
 <text class="rec" x="1975" y="1002" font-family="Arial" font-size="25" font-weight="700">RECOMMENDED · ЕЖЕДНЕВНОЕ УДОБСТВО</text>
 <text class="body" x="1975" y="1048">3 · Съёмный экран ванны; сифон/перелив доступны.</text>
 <text class="body" x="1975" y="1097">6 · Неподвижное безопасное стекло + прозрачный</text><text class="small" x="2010" y="1123">водоотбойник; гидрофобное покрытие — опция.</text>
 <text class="body" x="1975" y="1170">7 · Съёмная корзина на душевой стойке;</text><text class="small" x="2010" y="1196">не полка и не ниша на стене ванны.</text>
 <text class="body" x="1975" y="1243">9 · Зеркальный шкаф: глубина 80–110 мм,</text><text class="small" x="2010" y="1269">фронтальный свет; anti-fog — опционально.</text>
 <text class="small" x="1975" y="1330">Уточнить модели стекла, ванны и мебели по картам монтажа.</text>
 <rect x="1940" y="1480" width="820" height="205" rx="12" fill="#332524" stroke="#ef957b" stroke-width="3"/>
 <text class="no" x="1975" y="1527" font-family="Arial" font-size="25" font-weight="700">DO NOT ADD</text>
 <text class="body" x="1975" y="1574">Никакого дополнительного хранения, третьей полки,</text>
 <text class="body" x="1975" y="1610">LED под ванной / WC и розетки 230V внутри.</text>
 <text class="small" x="1975" y="1647">Не делать ниш в перегородках 160 мм и не занимать проход 670 мм.</text>
 <line class="muted" x1="1940" y1="1730" x2="2760" y2="1730"/>
 <text class="red" x="1950" y="1780">НЕ ЧЕРТЁЖ ДЛЯ СВЕРЛЕНИЯ</text>
 <text class="small" x="1950" y="1815">Размеры и позиции необмеренных компонентов — только после</text>
 <text class="small" x="1950" y="1843">контрольного обмера, совместной разметки и карт монтажа.</text>
 <text class="tiny" x="120" y="2020">Лист 62 · фиксированные пятна: ванна, WC, тумба, ВМ‑07 и проход не переносить. Обозначения 1–10 соответствуют правой панели.</text>
 <text class="tiny" x="2760" y="2020" text-anchor="end">28.08.2026 · Концепция / координация</text>
</svg>
