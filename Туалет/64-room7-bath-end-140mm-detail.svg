<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="2160" viewBox="0 0 2880 2160" role="img" aria-labelledby="title desc">
<title id="title">Комната 7 — низкий торцевой добор ванны 140 мм</title><desc id="desc">Координационный крупный план зоны X от 0 до 700 и Y от 0 до 140 мм у ванны. Рекомендуется низкий закрытый торцевой добор со скатом в чашу и независимым сервисом через съемный экран. Не чертеж для сверления.</desc>
<style>.bg{fill:#151715}.panel{fill:#20231f;stroke:#777c72;stroke-width:3}.box{fill:#292c27;stroke:#50564d;stroke-width:2}.tile{fill:#dedbd1;fill-opacity:.16;stroke:#e8e4d8;stroke-width:4}.screen{fill:#4a392c;stroke:#e0b16c;stroke-width:4}.water{fill:#233f45;stroke:#8dd7d4;stroke-width:4}.bath{fill:#382d27;stroke:#d6b18a;stroke-width:5}.good{fill:#21362f;stroke:#58d29b;stroke-width:4}.warn{fill:#453724;stroke:#f0c56d;stroke-width:4}.bad{fill:#402927;stroke:#ef957b;stroke-width:4}.line{stroke:#525950;stroke-width:2}.dim{fill:none;stroke:#aab0a6;stroke-width:2;stroke-dasharray:8 6}.heading{fill:#f3f0e8;font:700 46px Arial,sans-serif}.sub{fill:#aeb3aa;font:22px Arial,sans-serif}.h{fill:#f3f0e8;font:700 27px Arial,sans-serif}.label{fill:#f3f0e8;font:700 21px Arial,sans-serif}.body{fill:#d1d4cc;font:19px Arial,sans-serif}.small{fill:#aeb3aa;font:16px Arial,sans-serif}.gold{fill:#f0c56d;font:700 20px Arial,sans-serif}.green{fill:#58d29b;font:700 21px Arial,sans-serif}.red{fill:#ef957b;font:700 21px Arial,sans-serif}</style>
<rect class="bg" width="2880" height="2160"/><text class="heading" x="100" y="95">КОМНАТА 7 · НИЗКИЙ ТОРЦЕВОЙ ДОБОР ВАННЫ Y=0…140</text><text class="sub" x="100" y="134">Зона X=0…700, Y=0…140 · ванна 1600 × 700: X=0…700, Y=140…1740 · без назначения толщин, уклонов и сверления</text><line class="line" x1="100" y1="168" x2="2780" y2="168"/>
<rect class="panel" x="85" y="230" width="1740" height="1290" rx="16"/><text class="gold" x="125" y="280">ПРИНЯТЬ · A: 1600 + НИЗКИЙ ЗАКРЫТЫЙ ДОБОР СО СКАТОМ</text>
<!-- large plan --> <rect class="box" x="125" y="325" width="1050" height="610" rx="10"/><text class="label" x="165" y="370">ПЛАНОВАЯ ПРИВЯЗКА · зона у D4</text><rect class="tile" x="205" y="430" width="735" height="385"/><rect class="bath" x="205" y="545" width="490" height="270" rx="15"/><text class="label" x="450" y="690" text-anchor="middle">ВАННА</text><text class="small" x="450" y="718" text-anchor="middle">Y=140…1740</text><path d="M205 500 L695 525 L695 545 L205 545Z" class="tile"/><text class="label" x="450" y="484" text-anchor="middle">низкий закрытый торцевой добор / короб</text><text class="small" x="450" y="514" text-anchor="middle">верх — неэксплуатируемый скат в чашу</text><rect class="screen" x="205" y="545" width="490" height="45"/><text class="small" x="450" y="605" text-anchor="middle">лицевая грань X=700 продолжает линию общего съёмного экрана</text><path d="M705 430h235" fill="none" stroke="#82c3ed" stroke-width="7" stroke-dasharray="16 10"/><text class="small" x="823" y="415" text-anchor="middle">D4 / Y=0</text><line class="dim" x1="720" y1="430" x2="720" y2="545"/><text class="gold" x="748" y="471">Y=0…140</text><text class="small" x="165" y="875">Короб низкий: не полно-высотный фальшпростенок и не полка. Его верх — скат в чашу; величину уклона не назначать до выбранной ванны / системы.</text>
<!-- section --> <rect class="box" x="1215" y="325" width="565" height="610" rx="10"/><text class="label" x="1255" y="370">РАЗРЕЗ · принцип</text><rect class="tile" x="1285" y="470" width="350" height="280"/><path d="M1285 600 L1635 640 L1635 710 L1285 710Z" class="tile"/><rect class="screen" x="1285" y="710" width="350" height="40"/><rect class="bath" x="1390" y="635" width="245" height="75" rx="14"/><path d="M1285 465h350" stroke="#8dd7d4" stroke-width="10"/><text class="small" x="1460" y="440" text-anchor="middle">непрерывная гидроизоляция</text><text class="small" x="1460" y="588" text-anchor="middle">низкий короб · скат в чашу</text><path d="M1285 765h350" stroke="#8dd7d4" stroke-width="5" stroke-dasharray="8 6"/><text class="small" x="1460" y="800" text-anchor="middle">съёмный экран снимается независимо</text><text class="small" x="1460" y="827" text-anchor="middle">и даёт полный сервис сифона / перелива</text><text class="red" x="1460" y="872" text-anchor="middle">без LED · хранения · коммуникаций внутри</text>
<!-- comparison --> <text class="h" x="125" y="1015">СРАВНЕНИЕ РЕШЕНИЙ</text><rect class="good" x="125" y="1050" width="505" height="360" rx="12"/><text class="green" x="165" y="1100">A · ПРИНЯТЬ</text><text class="label" x="165" y="1140">1600 + низкий закрытый добор со скатом</text><text class="body" x="165" y="1183">Та же светлая плитка,</text><text class="body" x="165" y="1211">скат в чашу; линия X=700</text><text class="body" x="165" y="1239">продолжает общий экран,</text><text class="body" x="165" y="1267">сервис через экран отдельно.</text><text class="small" x="165" y="1320">Не уменьшает рабочую глубину</text><text class="small" x="165" y="1346">полок D4 600 × 125.</text>
<rect class="warn" x="670" y="1050" width="505" height="360" rx="12"/><text class="gold" x="710" y="1100">B · ТОЛЬКО УСЛОВНО</text><text class="label" x="710" y="1140">1700 вместо 1600</text><text class="body" x="710" y="1183">Допустимо только после</text><text class="body" x="710" y="1211">чистового обмера и</text><text class="body" x="710" y="1239">монтажной карты конкретной</text><text class="body" x="710" y="1267">ванны. Сейчас не принять.</text><text class="small" x="710" y="1320">Номинальные 40 мм</text><text class="small" x="710" y="1346">не являются запасом монтажа.</text>
<rect class="bad" x="1215" y="1050" width="565" height="360" rx="12"/><text class="red" x="1255" y="1100">C · ОТКЛОНИТЬ</text><text class="label" x="1255" y="1140">открытая щель / открытая ниша</text><text class="body" x="1255" y="1183">Собирает грязь, ломает</text><text class="body" x="1255" y="1211">гидроизоляционный контур,</text><text class="body" x="1255" y="1239">создаёт ложное хранение и</text><text class="body" x="1255" y="1267">не даёт контролируемого сервиса.</text><text class="small" x="1255" y="1320">Не оставлять открытой и</text><text class="small" x="1255" y="1346">не заполнять аксессуарами.</text>
<!-- checklist --> <rect class="panel" x="1870" y="230" width="925" height="1290" rx="16"/><text class="h" x="1920" y="285">ЧЕК‑ЛИСТ ПРИЁМКИ</text><text class="green" x="1920" y="342">Перед облицовкой</text><text class="body" x="1920" y="385">□ Подтверждён размер ванны 1600 и карта монтажа.</text><text class="body" x="1920" y="425">□ Проверен чистовой участок X=0…700, Y=0…140.</text><text class="body" x="1920" y="465">□ Гидроизоляция единая: пол, углы, примыкания.</text><text class="body" x="1920" y="505">□ Нет скрытых трасс в зоне будущего крепежа.</text><text class="green" x="1920" y="565">Перед сдачей</text><text class="body" x="1920" y="608">□ Короб низкий, закрыт и облицован той же светлой плиткой.</text><text class="body" x="1920" y="648">□ Лицевая грань X=700 продолжает линию общего экрана.</text><text class="body" x="1920" y="688">□ Экран снимается независимо, без разрушения облицовки.</text><text class="body" x="1920" y="728">□ Экран даёт полный сервис сифона / перелива.</text><text class="body" x="1920" y="768">□ Скаты пролиты водой: вода уходит в чашу.</text><text class="body" x="1920" y="808">□ Нет LED, бронзовой рамки, ниши, хранения или коммуникаций.</text><text class="body" x="1920" y="848">□ Короб не уменьшил рабочую глубину полок D4 600 × 125.</text><line class="line" x1="1920" y1="890" x2="2740" y2="890"/><text class="red" x="1920" y="940">НЕ ЧЕРТЁЖ ДЛЯ СВЕРЛЕНИЯ</text><text class="body" x="1920" y="980">Все неуказанные размеры, толщины, уклоны,</text><text class="body" x="1920" y="1008">крепёж и позиции — после обмера на объекте</text><text class="body" x="1920" y="1036">и карт выбранных изделий.</text><text class="small" x="1920" y="1102">Короб может быть несъёмным только если экран</text><text class="small" x="1920" y="1128">независимо обеспечивает полный сервис.</text>
<text class="small" x="100" y="1605">Лист 64 · Рекомендуемая база: ванна 1600 мм и низкий закрытый торцевой добор со скатом. Позиция ванны не меняется.</text><text class="small" x="100" y="1640">Высота короба — по выбранной ванне; условны материалы гидроизоляции, сборка экрана, геометрия сечения и все монтажные параметры.</text>
</svg>
