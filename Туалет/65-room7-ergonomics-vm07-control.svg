<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="2160" viewBox="0 0 2880 2160" role="img" aria-labelledby="title desc">
<title id="title">Комната 7 — эргономика и контроль доступа ВМ-07</title><desc id="desc">Координационная развёртка дальней стены и стены D4. Высоты являются эргономическими ориентирами, а не нормативами или точками сверления.</desc>
<style>.bg{fill:#151715}.panel{fill:#20231f;stroke:#777c72;stroke-width:3}.box{fill:#292c27;stroke:#50564d;stroke-width:2}.wall{fill:#e8e5da;fill-opacity:.12;stroke:#f1f0e9;stroke-width:5}.tile{stroke:#5a6057;stroke-width:1}.bath{fill:#382d27;stroke:#d6b18a;stroke-width:4}.vanity{fill:#51402f;stroke:#e0a95c;stroke-width:4}.vm{fill:#302a49;stroke:#a891ec;stroke-width:4}.wc{fill:#382d27;stroke:#d6b18a;stroke-width:4}.door{fill:#293b43;stroke:#82c3ed;stroke-width:5;stroke-dasharray:13 9}.bronze{fill:#5a4633;stroke:#e0b16c;stroke-width:4}.fix{fill:#f0c56d}.ergo{fill:#8dd7d4}.unknown{fill:#ef957b}.dim{fill:none;stroke:#9ca198;stroke-width:2;stroke-dasharray:8 6}.line{stroke:#525950;stroke-width:2}.heading{fill:#f3f0e8;font:700 46px Arial,sans-serif}.sub{fill:#aeb3aa;font:22px Arial,sans-serif}.h{fill:#f3f0e8;font:700 27px Arial,sans-serif}.label{fill:#f3f0e8;font:700 21px Arial,sans-serif}.body{fill:#d1d4cc;font:19px Arial,sans-serif}.small{fill:#aeb3aa;font:16px Arial,sans-serif}.gold{fill:#f0c56d;font:700 20px Arial,sans-serif}.cyan{fill:#8dd7d4;font:700 20px Arial,sans-serif}.red{fill:#ef957b;font:700 21px Arial,sans-serif}</style>
<rect class="bg" width="2880" height="2160"/><text class="heading" x="100" y="95">КОМНАТА 7 · ЭРГОНОМИКА И КОНТРОЛЬ ДОСТУПА ВМ‑07</text><text class="sub" x="100" y="134">Развёртка дальней стены 2090 × 2617 · плановая расстановка не меняется · диапазоны — не нормативы и не точки сверления</text><line class="line" x1="100" y1="168" x2="2780" y2="168"/>
<rect class="panel" x="85" y="230" width="1800" height="1390" rx="16"/><text class="gold" x="125" y="285">A · ДАЛЬНЯЯ СТЕНА Y=1740 · 2090 × 2617</text><rect class="wall" x="125" y="340" width="1715" height="1125"/><path class="tile" d="M125 565h1715M125 790h1715M125 1015h1715M125 1240h1715M410 340v1125M695 340v1125M980 340v1125M1265 340v1125M1550 340v1125"/>
<!-- fixed base --> <rect class="bath" x="135" y="1080" width="570" height="385" rx="18"/><text class="label" x="420" y="1280" text-anchor="middle">ТОРЕЦ ВАННЫ</text><text class="gold" x="420" y="1308" text-anchor="middle">X=0…700 · фиксировано</text><rect class="vanity" x="710" y="1030" width="560" height="435"/><ellipse cx="990" cy="1115" rx="115" ry="42" fill="#262a27" stroke="#f0c56d" stroke-width="4"/><text class="label" x="990" y="1320" text-anchor="middle">ТУМБА + РАКОВИНА</text><text class="gold" x="990" y="1348" text-anchor="middle">X=700…1380 · пролёт 680 × 350</text><text class="small" x="990" y="1376" text-anchor="middle">заказ после плитки: 670–674 × 345–347</text><rect class="vm" x="1275" y="1030" width="555" height="435"/><text class="label" x="1552" y="1290" text-anchor="middle">ВМ‑07</text><text class="gold" x="1552" y="1320" text-anchor="middle">X=1380…2090 · 710 × 360</text>
<!-- WC template --> <path d="M1370 1430 V890 Q1550 790 1730 890 V1430" fill="#d6b18a" fill-opacity=".10" stroke="#f0c56d" stroke-width="5" stroke-dasharray="15 10"/><text class="gold" x="1550" y="858" text-anchor="middle">ОБЯЗАТЕЛЬНЫЙ НАТУРНЫЙ ШАБЛОН WC 1:1</text><text class="small" x="1550" y="1460" text-anchor="middle">WC перед ВМ‑07 · расстановку не переносить</text><rect x="1365" y="1000" width="395" height="320" fill="none" stroke="#ef957b" stroke-width="5" stroke-dasharray="12 8"/><text class="red" x="1562" y="980" text-anchor="middle">ФАКТИЧЕСКИЙ ЛЮК / ТРАЕКТОРИЯ — НЕИЗВЕСТНЫ</text><text class="small" x="1562" y="1355" text-anchor="middle">обмерить с шаблоном; не закрывать до сервиса</text>
<!-- ergonomic guides --> <line x1="740" y1="1092" x2="1245" y2="1092" stroke="#8dd7d4" stroke-width="4"/><text class="cyan" x="730" y="1065" text-anchor="end">верх раковины 860–880</text><text class="small" x="730" y="1088" text-anchor="end">старт в диапазоне 850–900</text><line x1="1380" y1="1220" x2="1720" y2="1220" stroke="#8dd7d4" stroke-width="4"/><text class="cyan" x="1705" y="1214" text-anchor="end">верх сиденья WC 430–460</text><line x1="1430" y1="930" x2="1680" y2="930" stroke="#8dd7d4" stroke-width="4"/><text class="cyan" x="1700" y="925">кнопка 950–1050</text><rect x="800" y="510" width="390" height="210" fill="#233437" stroke="#aee9eb" stroke-width="4"/><text class="cyan" x="995" y="492" text-anchor="middle">зеркало: центр 1500–1600</text><text class="small" x="995" y="748" text-anchor="middle">глубина 80–110</text><line x1="740" y1="1000" x2="1245" y2="1000" stroke="#8dd7d4" stroke-width="4"/><text class="cyan" x="730" y="995" text-anchor="end">рейка тумбы 900–950</text><text class="red" x="1550" y="1515" text-anchor="middle">Аксессуары не крепить к панели ВМ‑07.</text>
<!-- legend --> <rect class="box" x="125" y="1500" width="1715" height="82" rx="8"/><circle cx="180" cy="1542" r="12" class="fix"/><text class="body" x="205" y="1549">ФИКСИРОВАНО: плановые пятна / размеры</text><circle cx="730" cy="1542" r="12" class="ergo"/><text class="body" x="755" y="1549">ЭРГОНОМИЧЕСКИЙ ОРИЕНТИР: диапазон по выбранной модели</text><circle cx="1390" cy="1542" r="12" class="unknown"/><text class="body" x="1415" y="1549">ТОЛЬКО ПОСЛЕ ОБМЕРА: люк, траектория, крепления</text>
<!-- D4 block --> <rect class="panel" x="1930" y="230" width="865" height="1390" rx="16"/><text class="gold" x="1975" y="285">B · D4 · 760 + 810 + 520</text><rect class="wall" x="1975" y="340" width="770" height="1125"/><rect class="bronze" x="2005" y="770" width="220" height="26"/><rect class="bronze" x="2005" y="1010" width="220" height="26"/><text class="small" x="2115" y="740" text-anchor="middle">полки 600 × 125</text><text class="cyan" x="2115" y="826" text-anchor="middle">верх +1320</text><text class="cyan" x="2115" y="1068" text-anchor="middle">верх +1050</text><rect class="door" x="2255" y="505" width="290" height="960"/><text class="label" x="2400" y="990" text-anchor="middle">D4 · наружу</text><text class="small" x="2400" y="1018" text-anchor="middle">810 — не чистый проём</text><rect class="bronze" x="2580" y="670" width="135" height="410" rx="7"/><path d="M2605 700v350m30-350v350m30-350v350m30-350v350" stroke="#e0b16c" stroke-width="4"/><text class="small" x="2648" y="640" text-anchor="middle">сушитель</text><text class="cyan" x="2648" y="1110" text-anchor="middle">800×400×76</text><text class="small" x="2648" y="1136" text-anchor="middle">центр 1000–1100</text><circle cx="2380" cy="890" r="18" class="bronze"/><circle cx="2380" cy="630" r="18" class="bronze"/><text class="cyan" x="2415" y="640">крючок 1650–1700</text><text class="cyan" x="2415" y="900">крючок 1200–1300</text><text class="red" x="1975" y="1535">Наличник, петли, модель и реальный проём — проверить.</text><text class="small" x="1975" y="1570">Полки сохраняют глубину 125; не занимать их коробом / аксессуарами.</text>
<text class="red" x="100" y="1715">НЕ ЧЕРТЁЖ ДЛЯ СВЕРЛЕНИЯ</text><text class="sub" x="100" y="1750">Все высоты — эргономические ориентиры для выбора моделей и контрольной разметки; не являются нормативом, проектной отметкой или точкой крепления.</text><text class="small" x="100" y="1800">Аксессуары у WC: бумага +650…700; гигиенический душ +650…750 — только после натурной проверки досягаемости по выбранной чаше; не на панели ВМ‑07.</text><text class="small" x="100" y="1828">Ёршик — по фактической чаше, пол оставить моющимся. До закрытия ВМ‑07 проверить реальный люк и траекторию обслуживания без переноса WC.</text>
</svg>
