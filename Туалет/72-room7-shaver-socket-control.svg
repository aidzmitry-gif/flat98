<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Комната 7 — SHV для бритвы: зеркальный шкаф и стоп-гейт</title>
  <desc id="desc">Координационный лист. SHV — только заводской shaver supply unit с разделительным трансформатором внутри накладного зеркального шкафа на стороне дальше от ванны. Обычная открытая розетка 230 В не допускается. Без монтажных координат.</desc>
  <style>
    .bg{fill:#171817}.panel{fill:#232522;stroke:#8d918a;stroke-width:2}.wall{fill:#d9d1c5;stroke:#eee7dd;stroke-width:3}.tile{stroke:#b6aa9b;stroke-width:1}.mirror{fill:#303c3d;stroke:#aee9eb;stroke-width:3}.cab{fill:#524637;stroke:#d8b07d;stroke-width:3}.door{fill:#645440;stroke:#ebc287;stroke-width:2}.shv{fill:#f3a458;stroke:#ffe0ac;stroke-width:3}.wire{fill:none;stroke:#f5c878;stroke-width:3;stroke-dasharray:7 5}.safe{fill:#41ce85}.stop{fill:#f38f68}.line{stroke:#50544f;stroke-width:1.5}.heading{fill:#f3f0e8;font:700 28px Arial,sans-serif}.sub{fill:#a8aaa4;font:16px Arial,sans-serif}.label{fill:#f3f0e8;font:700 16px Arial,sans-serif}.small{fill:#c1c4bc;font:14px Arial,sans-serif}.tiny{fill:#a8aaa4;font:12px Arial,sans-serif}.gold{fill:#f5c878;font:700 16px Arial,sans-serif}.green{fill:#41ce85;font:700 15px Arial,sans-serif}.warn{fill:#f3a458;font:700 15px Arial,sans-serif}.red{fill:#f38f68;font:700 15px Arial,sans-serif}.dim{fill:none;stroke:#a8aaa4;stroke-width:1.2;stroke-dasharray:5 4}
  </style>
  <rect class="bg" width="1600" height="1100"/>
  <text class="heading" x="56" y="54">Комната 7 · SHV для бритвы — координация до плитки</text>
  <text class="sub" x="56" y="83">Только заводской shaver supply unit с разделительным трансформатором · фасад и принцип питания · без монтажных координат</text>

  <!-- elevation -->
  <rect class="panel" x="55" y="120" width="780" height="905" rx="14"/>
  <text class="gold" x="85" y="162">Фасад стены у тумбы: ванна слева, WC / ВМ‑07 справа</text>
  <rect class="wall" x="115" y="205" width="660" height="695"/>
  <path class="tile" d="M115 380H775M115 555H775M115 730H775M280 205V900M445 205V900M610 205V900"/>
  <rect class="cab" x="320" y="310" width="290" height="405" rx="6"/>
  <rect class="mirror" x="338" y="328" width="254" height="369" rx="3"/>
  <line x1="465" y1="328" x2="465" y2="697" stroke="#aee9eb" stroke-width="2"/>
  <text class="label" x="465" y="738" text-anchor="middle">накладной зеркальный шкаф</text>
  <text class="small" x="465" y="760" text-anchor="middle">общая глубина 80–110 мм</text>
  <path d="M592 512h70" stroke="#ebc287" stroke-width="3"/><path d="M662 512l-12-8m12 8l-12 8" stroke="#ebc287" stroke-width="3"/>
  <text class="tiny" x="618" y="482">открывание к WC / ВМ‑07</text>
  <rect x="175" y="745" width="145" height="105" rx="4" fill="#51402f" stroke="#e0a95c" stroke-width="3"/>
  <text class="label" x="247" y="796" text-anchor="middle">тумба</text><text class="tiny" x="247" y="816" text-anchor="middle">у ванны</text>
  <rect x="610" y="745" width="115" height="105" fill="#352e53" stroke="#a48afb" stroke-width="3"/>
  <text class="label" x="667" y="796" text-anchor="middle">ВМ‑07</text><text class="tiny" x="667" y="816" text-anchor="middle">не занимать</text>
  <path d="M115 900H775" stroke="#f0eee7" stroke-width="6"/>
  <path class="dim" d="M635 310V715"/><path class="dim" d="M620 310h30M620 715h30"/>
  <text class="warn" x="650" y="370">SHV внутри шкафа</text>
  <rect class="shv" x="535" y="470" width="42" height="54" rx="6"/>
  <text x="556" y="493" text-anchor="middle" fill="#171817" font-family="Arial,sans-serif" font-size="12" font-weight="700">SHV</text><text x="556" y="508" text-anchor="middle" fill="#171817" font-family="Arial,sans-serif" font-size="10">20–50 VA</text>
  <path d="M578 497h115" stroke="#f3a458" stroke-width="2"/><path d="M693 497l-10-6v12z" fill="#f3a458"/>
  <text class="tiny" x="618" y="550">дальняя от ванны сторона</text><text class="tiny" x="618" y="566">за закрытой дверцей</text>
  <line class="dim" x1="280" y1="520" x2="195" y2="520"/><text class="small" x="126" y="509">ванна</text><text class="tiny" x="126" y="527">обычной 230V здесь нет</text>
  <line class="dim" x1="556" y1="524" x2="556" y2="900"/><text class="gold" x="571" y="625">центр +1400 мм</text><text class="small" x="571" y="646">диапазон +1350…1450</text><text class="tiny" x="571" y="664">проектный ориентир</text>
  <text class="red" x="115" y="952">Горизонталь, крепёж и ось — только после выбора шкафа и натурной разметки.</text>
  <text class="tiny" x="115" y="977">Ниша в стене 160 мм не допускается; геометрия ванны, тумбы, WC и ВМ‑07 не меняется.</text>

  <!-- electrical principle -->
  <rect class="panel" x="870" y="120" width="675" height="440" rx="14"/>
  <text class="gold" x="902" y="163">Принцип питания и защиты</text>
  <rect x="915" y="215" width="145" height="72" rx="7" fill="#303331" stroke="#a8aaa4" stroke-width="2"/><text class="label" x="987" y="246" text-anchor="middle">щит</text><text class="tiny" x="987" y="266" text-anchor="middle">L / N / PE</text>
  <path class="wire" d="M1060 251H1135"/><path d="M1135 251l-12-8v16z" fill="#f5c878"/>
  <rect x="1137" y="215" width="170" height="72" rx="7" fill="#3a342b" stroke="#f5c878" stroke-width="2"/><text class="label" x="1222" y="243" text-anchor="middle">отдельное</text><text class="small" x="1222" y="264" text-anchor="middle">недиммируемое ответвление</text>
  <path class="wire" d="M1307 251H1370"/><path d="M1370 251l-12-8v16z" fill="#f5c878"/>
  <rect class="shv" x="1373" y="205" width="130" height="92" rx="8"/><text x="1438" y="238" text-anchor="middle" fill="#171817" font-family="Arial,sans-serif" font-size="16" font-weight="700">SHV</text><text x="1438" y="260" text-anchor="middle" fill="#171817" font-family="Arial,sans-serif" font-size="12">изолирующий</text><text x="1438" y="277" text-anchor="middle" fill="#171817" font-family="Arial,sans-serif" font-size="12">трансформатор</text>
  <text class="small" x="915" y="333">Проектный ориентир защиты: RCBO / УЗО типа A 30 мА.</text>
  <text class="small" x="915" y="359">IP, класс, мощность и подключение — только по паспорту выбранного модуля и проекту электрика.</text>
  <text class="small" x="915" y="385">SHV не объединять с LED, сушителем, ВМ‑07, тумбой или пространством под ванной.</text>
  <text class="red" x="915" y="425">Не заменять SHV обычной универсальной розеткой 230 В 2P+PE.</text>
  <text class="tiny" x="915" y="467">Этот лист не применяет иностранные нормы вместо действующих ТНПА РБ.</text>

  <!-- stop gate -->
  <rect class="panel" x="870" y="585" width="675" height="440" rx="14"/>
  <text class="gold" x="902" y="628">Стоп-гейт до заказа и плитки</text>
  <circle class="safe" cx="920" cy="684" r="11"/><text class="label" x="946" y="690">1. Выбраны паспортные шкаф и заводской SHV.</text>
  <circle class="safe" cx="920" cy="735" r="11"/><text class="label" x="946" y="741">2. Подтверждены глубина 80–110 мм и открывание дверцы.</text>
  <circle class="safe" cx="920" cy="786" r="11"/><text class="label" x="946" y="792">3. Электрик подтвердил зону по действующим ТНПА РБ.</text>
  <circle class="safe" cx="920" cy="837" r="11"/><text class="label" x="946" y="843">4. Подтверждены IP/класс, L/N/PE и защитное отключение.</text>
  <circle class="stop" cx="920" cy="902" r="11"/><text class="red" x="946" y="908">Любой пункт не пройден → SHV не монтировать.</text>
  <text class="small" x="946" y="934">Бритва хранится в тумбе, зарядка переносится вне санузла.</text>
  <line class="line" x1="902" y1="961" x2="1510" y2="961"/>
  <text class="tiny" x="902" y="987">СТАТУС: условная инженерная точка. Не рабочий чертёж для сверления и не выбор конкретного SKU.</text>
</svg>
